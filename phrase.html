<style>

}

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

h1,h2{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.en{font-family:var(--f-en)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-2)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

.sheetbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--sheet);color:var(--red);background:var(--page);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700}
.sheetbtn[aria-pressed="true"]{background:var(--sheet);color:#fff}
.sheetbtn i{width:14px;height:10px;border-radius:2px;background:var(--sheet);display:inline-block}
.sheetbtn[aria-pressed="true"] i{background:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--page);border-radius:10px;padding:6px 12px;font-size:13px;min-height:34px}
.btn:hover{border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.sub{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.sub select{border:1px solid var(--rule);border-radius:10px;padding:6px 10px;background:var(--page);min-height:36px}

.pj{font-size:14px;color:var(--ink-2)}
.red{color:var(--red);font-weight:700;border-radius:3px;transition:background .15s,color .15s}
.sheet-on .red{color:transparent;background:var(--sheet);cursor:pointer;user-select:none}
.sheet-on .red.peek{color:var(--red);background:var(--red-soft)}
.side{display:flex;align-items:center;gap:6px;margin-left:auto}
.chk{display:flex;gap:4px}
.chk button{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-3);background:none;padding:0}
.chk button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.star{border:0;background:none;padding:0 2px;font-size:17px;line-height:1;color:var(--ink-3)}
.star[aria-pressed="true"]{color:var(--star)}
.spk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);background:var(--page);color:var(--ink-2);flex:none;padding:0}
.spk:hover{color:var(--red);border-color:var(--red)}
.spk svg{width:13px;height:13px;fill:currentColor}
.row{display:flex;align-items:flex-start;gap:8px}
.more{display:flex;justify-content:center;padding:18px 0}
.empty{padding:30px;text-align:center;color:var(--ink-2)}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;background:var(--ink);color:var(--page);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--page);padding:8px 14px;border-radius:10px;font-size:13px;z-index:40}
.banner{max-width:980px;margin:8px auto 0;padding-inline:16px}
.banner p{background:var(--red-soft);border-radius:8px;padding:8px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

thus|副|したがって、こうして|[thus] reducing waste|[こうして]廃棄物を減らす|
hence|副|それゆえ|The road was closed, [hence] the delay.|道路が閉鎖されていた。[だから]遅れたのだ。|
barring|前|〜がなければ|[barring] any delays|遅れが[なければ]|
on the grounds that|熟|〜という理由で|[on the grounds that] it is too costly|費用がかかりすぎる[という理由で]|
by means of|熟|〜によって|[by means of] a survey|アンケート[によって]|
expedient|形|好都合な、便宜的な|an [expedient] solution|[便宜的な]解決策|
ubiquitous|形|至る所にある|[ubiquitous] smartphones|[どこにでもある]スマートフォン|
precarious|形|不安定な|a [precarious] financial situation|[不安定な]財政状況|
`);

</script>
<script>
/* words-common.js — parses the word data shared by both apps */
(function () {
'use strict';
const THEMES = {
  office: 'オフィス・社内', hr: '人事・採用', biz: '経営・取引', money: 'お金・経理', sales: '営業・販売',
  shop: '買い物・飲食', travel: '出張・旅行', event: '会議・イベント', build: '建物・不動産',
  scene: '写真描写（Part 1）', make: '製造・物流', tech: 'IT・メディア', life: '生活・地域', gen: '頻出の一般語'
};
const LEVELS = {
  1: { name: 'Level 1', score: '600点', note: '基礎を固める' },
  2: { name: 'Level 2', score: '730点', note: 'ここで差がつく' },
  3: { name: 'Level 3', score: '860点', note: '800点の壁を越える' },
  4: { name: 'Level 4', score: '990点', note: '上級者の語彙' }
};
const POS = { '動': '動詞', '名': '名詞', '形': '形容詞', '副': '副詞', '前': '前置詞', '接': '接続詞', '熟': '熟語' };
const slug = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
function parseRel(s) {
  if (!s) return [];
  return s.split('／').map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(\S+)\s+([A-Za-z][A-Za-z '\-.,]*?)(?:\s+([^\x00-\x7F].*))?$/);
    return m ? { tag: m[1], w: m[2].trim(), ja: (m[3] || '').trim() } : { tag: '', w: x, ja: '' };
  });
}
function split(s) {
  const a = s.indexOf('['), b = s.indexOf(']');
  if (a < 0 || b < a) return { pre: s, key: '', post: '' };
  return { pre: s.slice(0, a), key: s.slice(a + 1, b), post: s.slice(b + 1) };
}
function parse() {
  const out = [], seen = new Set();
  let lv = 1, th = 'gen', n = 0;
  (window.WORDS_SRC || []).forEach(src => src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line[0] === '#') { lv = +line.slice(1) || 1; return; }
    if (line[0] === '@') { th = line.slice(1).trim(); return; }
    const p = line.split('|');
    if (p.length < 6) return;
    let id = slug(p[0]); while (seen.has(id)) id += '_'; seen.add(id);
    n++;
    const ph = split(p[3]), pj = split(p[4]);
    out.push({
      n, id, w: p[0], pos: p[1], ja: p[2], main: p[2].split('；')[0].trim(),
      ph: p[3], phPre: ph.pre, phKey: ph.key, phPost: ph.post,
      pj: p[4], pjPre: pj.pre, pjKey: pj.key, pjPost: pj.post,
      rel: parseRel(p[5]), relRaw: p[5], lv, th
    });
  }));
  return out;
}
const WORDS = parse();
window.VOCAB = { WORDS, BY_ID: new Map(WORDS.map(w => [w.id, w])), THEMES, LEVELS, POS, slug, split };
})();

</script>
<script>
/* b-app.js — the phrase word book: level sections, red sheet, 3-pass check marks, listen-through audio */
(function () {
'use strict';
const V = window.VOCAB;
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* ---------- storage ---------- */
const Store = {
  db: null, prefix: 'phrase1000:', pending: new Map(), failed: false,
  async init() { try { this.db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { this.db = null; } },
  async get(path) {
    if (this.db) { try { const s = await this.db.doc(path).get(); return s.exists ? clone(s.data()) : null; } catch (e) { this.fail(e); return null; } }
    try { const v = localStorage.getItem(this.prefix + path); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  },
  save(path, data) {
    let p = this.pending.get(path);
    if (!p) { p = { data: null, running: false }; this.pending.set(path, p); }
    p.data = clone(data);
    if (!p.running) this.flush(path, p);
  },
  async flush(path, p) {
    p.running = true;
    while (p.data) {
      const d = p.data; p.data = null;
      if (this.db) { try { await this.db.doc(path).set(d); } catch (e) { this.fail(e); } }
      else { try { localStorage.setItem(this.prefix + path, JSON.stringify(d)); } catch (e) { /* blocked */ } }
      if (p.data) await new Promise(r => setTimeout(r, 300));
    }
    p.running = false;
  },
  fail(e) {
    console.warn('store', e);
    if (this.failed) return; this.failed = true;
    $('#bannerText').textContent = e && e.code === 'invalid_argument' ? 'このアカウントではチェックを保存できません（閲覧のみ）。' : 'チェックの保存に失敗しました。ページを開き直してください。';
    $('#banner').hidden = false;
  }
};

/* ---------- state ---------- */
let marks = {}, settings = { sheet: false, lv: '1', flt: 'all', jp: true }, query = '', limit = 200;
const bit = (id, b) => ((marks[id] || 0) & b) !== 0;
function toggle(id, b) { marks[id] = (marks[id] || 0) ^ b; if (!marks[id]) delete marks[id]; Store.save('marks/all', { m: marks }); }
const saveSettings = () => Store.save('meta/settings', settings);
let tt = null;
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2200); };

/* ---------- speech ---------- */
const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  en: null, ja: null, token: 0, _u: null,
  init() {
    if (!this.ok) return;
    const q = v => (/natural|neural|online/i.test(v.name) ? 3 : /google/i.test(v.name) ? 2 : 1);
    const load = () => {
      let all = []; try { all = speechSynthesis.getVoices() || []; } catch (e) { all = []; }
      this.en = all.filter(v => /^en[-_]US/i.test(v.lang)).sort((a, b) => q(b) - q(a))[0] || all.find(v => /^en/i.test(v.lang)) || null;
      this.ja = all.filter(v => /^ja/i.test(v.lang)).sort((a, b) => q(b) - q(a))[0] || null;
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  stop() { this.token++; try { if (this.ok) speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
  say(text, lang, keep) {
    return new Promise(res => {
      if (!this.ok || !text) return res(false);
      if (!keep) this.stop();
      const token = this.token, u = new SpeechSynthesisUtterance(text), v = lang === 'ja' ? this.ja : this.en;
      if (v) u.voice = v; u.lang = v ? v.lang : (lang === 'ja' ? 'ja-JP' : 'en-US'); u.rate = lang === 'ja' ? 1.1 : 0.92;
      let done = false; const fin = () => { if (!done) { done = true; clearTimeout(g); res(token === this.token); } };
      u.onend = fin; u.onerror = fin;
      const g = setTimeout(fin, 4000 + text.length * 160);
      this._u = u;
      setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { fin(); } }, 30);
    });
  }
};

/* ---------- rendering ---------- */
function visible() {
  const q = query.trim().toLowerCase();
  return V.WORDS.filter(w => (settings.lv === 'all' || String(w.lv) === settings.lv)
    && (!q || w.w.toLowerCase().indexOf(q) >= 0 || w.ja.indexOf(query.trim()) >= 0 || w.ph.toLowerCase().indexOf(q) >= 0)
    && (settings.flt === 'all' || (settings.flt === 'c0' && !bit(w.id, 1)) || (settings.flt === 'c1' && bit(w.id, 1)) || (settings.flt === 'c3' && bit(w.id, 4)) || (settings.flt === 'star' && bit(w.id, 8))));
}
function entry(w) {
  const chk = [1, 2, 4].map((b, i) => `<button data-bit="${b}" aria-pressed="${bit(w.id, b)}" aria-label="${i + 1}周目のチェック"></button>`).join('');
  return `<article class="ent" data-id="${esc(w.id)}">
    <div>
      <div class="head"><span class="no">${String(w.n).padStart(4, '0')}</span><span class="w">${esc(w.w)}</span><span class="pos">${esc(w.pos)}</span><button class="spk" data-say="w" aria-label="${esc(w.w)} の発音">${SPK}</button>
        <span class="side"><span class="chk">${chk}</span><button class="star" data-bit="8" aria-pressed="${bit(w.id, 8)}" aria-label="苦手の印">★</button></span></div>
      <div class="mean"><span class="red">${esc(w.ja)}</span></div>
      ${w.relRaw ? `<div class="rel">${esc(w.relRaw.replace(/／/g, '　'))}</div>` : ''}
    </div>
    <div>
      <div class="row"><p class="ph">${esc(w.phPre)}<b>${esc(w.phKey)}</b>${esc(w.phPost)}</p><button class="spk" data-say="ph" aria-label="フレーズを聞く">${SPK}</button></div>
      <p class="pj">${esc(w.pjPre)}<span class="red">${esc(w.pjKey)}</span>${esc(w.pjPost)}</p>
    </div>
  </article>`;
}
function stats(list) {
  const n = list.length, c1 = list.filter(w => bit(w.id, 1)).length, c3 = list.filter(w => bit(w.id, 4)).length, st = list.filter(w => bit(w.id, 8)).length;
  return `<div class="stat"><div><b>${c1}</b><span> / ${n}語 1周目</span></div><div><b>${c3}</b><span>語 3周済み</span></div><div><b>${st}</b><span>語 ★</span></div><span class="note" style="margin-left:auto">○をタップで周回チェック・★は苦手の印</span></div>
    <div class="meter"><i style="width:${n ? c1 / n * 100 : 0}%"></i></div>`;
}
function render() {
  document.body.classList.toggle('sheet-on', !!settings.sheet);
  $('#sheet').setAttribute('aria-pressed', String(!!settings.sheet));
  $('#jp').setAttribute('aria-pressed', String(!!settings.jp));
  $('#lv').innerHTML = [1, 2, 3, 4].map(l => `<button data-lv="${l}" aria-pressed="${settings.lv === String(l)}">${V.LEVELS[l].score}</button>`).join('') + `<button data-lv="all" aria-pressed="${settings.lv === 'all'}">すべて</button>`;
  $('#flt').value = settings.flt;
  const levelWords = V.WORDS.filter(w => settings.lv === 'all' || String(w.lv) === settings.lv);
  const list = visible(), shown = list.slice(0, limit);
  let html = stats(levelWords), lastLv = null, lastTh = null, open = false;
  shown.forEach(w => {
    if (w.lv !== lastLv) {
      if (open) { html += '</div>'; open = false; }
      html += `<div class="lvhead"><h2>${V.LEVELS[w.lv].name}</h2><span>${V.LEVELS[w.lv].score}レベル・${V.LEVELS[w.lv].note}</span></div>`;
      lastLv = w.lv; lastTh = null;
    }
    if (w.th !== lastTh && !query) { if (open) html += '</div>'; html += `<div class="thhead">${esc(V.THEMES[w.th] || w.th)}</div><div class="page">`; open = true; lastTh = w.th; }
    else if (!open) { html += '<div class="page">'; open = true; }
    html += entry(w);
  });
  if (open) html += '</div>';
  if (!list.length) html += '<div class="empty">該当する単語がありません。</div>';
  if (list.length > shown.length) html += `<div class="more"><button class="btn" id="more">続きを表示（残り ${list.length - shown.length}語）</button></div>`;
  $('#view').innerHTML = html;
  const m = $('#more'); if (m) m.onclick = () => { limit += 400; render(); };
}

/* ---------- events ---------- */
$('#view').addEventListener('click', e => {
  const ent = e.target.closest('.ent'); if (!ent) return;
  const w = V.BY_ID.get(ent.dataset.id); if (!w) return;
  const b = e.target.closest('button');
  if (b && b.dataset.say) { TTS.say(b.dataset.say === 'w' ? w.w : w.ph.replace(/[[\]]/g, ''), 'en'); return; }
  if (b && b.dataset.bit) { const k = +b.dataset.bit; toggle(w.id, k); b.setAttribute('aria-pressed', String(bit(w.id, k))); return; }
  const red = e.target.closest('.red');
  if (red && settings.sheet) red.classList.toggle('peek');
});
$('#lv').addEventListener('click', e => { const b = e.target.closest('button[data-lv]'); if (!b) return; settings.lv = b.dataset.lv; limit = 200; saveSettings(); stopPlay(); render(); window.scrollTo(0, 0); });
$('#sheet').onclick = () => { settings.sheet = !settings.sheet; saveSettings(); render(); toast(settings.sheet ? '赤シートをかけました。赤い部分をタップすると一瞬だけ見られます' : '赤シートを外しました'); };
$('#jp').onclick = () => { settings.jp = !settings.jp; saveSettings(); $('#jp').setAttribute('aria-pressed', String(settings.jp)); };
$('#flt').onchange = e => { settings.flt = e.target.value; limit = 200; saveSettings(); render(); };
let deb = null;
$('#q').oninput = e => { clearTimeout(deb); deb = setTimeout(() => { query = e.target.value; limit = 200; render(); }, 160); };

/* ---------- listen-through (word → meaning → phrase) ---------- */
let playing = null;
function stopPlay() {
  if (!playing) return;
  playing = null; TTS.stop();
  $('#playerBox').innerHTML = ''; $('#play').setAttribute('aria-pressed', 'false'); $('#play').textContent = '▶ 聞き流し';
  document.querySelectorAll('.ent.now').forEach(x => x.classList.remove('now'));
}
async function startPlay() {
  if (!TTS.ok) { toast('このブラウザは読み上げに対応していません'); return; }
  const list = visible();
  if (!list.length) return;
  // start from the first entry visible on screen
  let start = 0;
  const ents = [...document.querySelectorAll('.ent')];
  const firstVis = ents.find(el => el.getBoundingClientRect().bottom > 120);
  if (firstVis) { const k = list.findIndex(w => w.id === firstVis.dataset.id); if (k >= 0) start = k; }
  const me = playing = { i: start };
  $('#play').setAttribute('aria-pressed', 'true'); $('#play').textContent = '■ 停止';
  for (let i = start; i < list.length && playing === me; i++) {
    const w = list[i];
    if (i >= limit) { limit = i + 200; render(); }
    document.querySelectorAll('.ent.now').forEach(x => x.classList.remove('now'));
    const el = document.querySelector(`.ent[data-id="${w.id}"]`);
    if (el) { el.classList.add('now'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    $('#playerBox').innerHTML = `<div class="player" role="status"><span class="mono">${String(w.n).padStart(4, '0')}</span><span class="en">${esc(w.w)}</span><button class="btn" id="pstop">■ 停止</button></div>`;
    $('#pstop').onclick = stopPlay;
    if (!(await TTS.say(w.w, 'en', true)) || playing !== me) break;
    await new Promise(r => setTimeout(r, 450));
    if (settings.jp && TTS.ja) { if (!(await TTS.say(w.ja.replace(/[〜～]/g, '').replace(/；/g, '、'), 'ja', true)) || playing !== me) break; await new Promise(r => setTimeout(r, 300)); }
    if (!(await TTS.say(w.ph.replace(/[[\]]/g, ''), 'en', true)) || playing !== me) break;
    await new Promise(r => setTimeout(r, 900));
  }
  if (playing === me) stopPlay();
}
$('#play').onclick = () => { if (playing) stopPlay(); else startPlay(); };

/* ---------- boot ---------- */
async function boot() {
  TTS.init();
  await Store.init();
  const [m, s] = await Promise.all([Store.get('marks/all'), Store.get('meta/settings')]);
  marks = (m && m.m) || {};
  settings = Object.assign(settings, s || {});
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

</script>
<script>
/* pwa.js — offline kit glue shared by every page: service worker, link back to the kit home, persistent storage */
(function () {
  'use strict';
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ }); });
  }
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (p) { if (!p) return navigator.storage.persist(); }).catch(function () {});
    }
  } catch (e) { /* ignore */ }
  function addHome() {
    var top = document.querySelector('.top-in');
    if (!top || document.querySelector('.kit-home')) return;
    var a = document.createElement('a');
    a.href = './';
    a.className = 'kit-home';
    a.textContent = '‹ Kit';
    a.setAttribute('aria-label', 'TOEIC Study Kit のホームに戻る');
    a.style.cssText = 'font:600 13px/1 system-ui,-apple-system,sans-serif;color:inherit;opacity:.7;text-decoration:none;padding:10px 6px 10px 0;white-space:nowrap';
    top.insertBefore(a, top.firstChild);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addHome); else addHome();
})();

</script>
