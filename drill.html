<title>TOEIC 800 Drill</title>

<style>
:root{
  --paper:#FBF8F8; --surface:#FFFFFF; --sunk:#F4EFF0; --line:#E9DFE1;
  --ink:#222428; --ink-2:#5E6168; --ink-3:#8A8D94;
  --drop:#C8466A; --drop-soft:#F6E1E7; --rule:#EDCFD7;
  --graphite:#2B2E33; --on-graphite:#FFFFFF;
  --ok:#1C7C5C; --ok-soft:#DDF0E8; --ng:#B8322F; --ng-soft:#F8E0DE; --warn:#9A6210; --warn-soft:#F6EAD3;
  --hl:#FBE7A6; --focus:#2D6CDF;
  --f-jp:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-en:"Source Serif 4","Georgia","Times New Roman",serif;
  --f-mono:"IBM Plex Mono","Consolas","Menlo",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141416; --surface:#1C1C20; --sunk:#232228; --line:#34313A;
    --ink:#ECEAE8; --ink-2:#A9A7AE; --ink-3:#7D7B83;
    --drop:#EC809A; --drop-soft:#3A2129; --rule:#4E2E38;
    --graphite:#E9E6E2; --on-graphite:#17171A;
    --ok:#5CC9A0; --ok-soft:#173127; --ng:#F2807A; --ng-soft:#3A1D1C; --warn:#E2AA55; --warn-soft:#352812;
    --hl:#5B4A12; --focus:#7FA8FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141416; --surface:#1C1C20; --sunk:#232228; --line:#34313A;
  --ink:#ECEAE8; --ink-2:#A9A7AE; --ink-3:#7D7B83;
  --drop:#EC809A; --drop-soft:#3A2129; --rule:#4E2E38;
  --graphite:#E9E6E2; --on-graphite:#17171A;
  --ok:#5CC9A0; --ok-soft:#173127; --ng:#F2807A; --ng-soft:#3A1D1C; --warn:#E2AA55; --warn-soft:#352812;
  --hl:#5B4A12; --focus:#7FA8FF;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.en{font-family:var(--f-en);font-size:17.5px;line-height:1.7;font-optical-sizing:auto}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--drop)}

/* ---------- frame ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:880px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-mono);font-weight:600;font-size:14px;letter-spacing:.02em}
.brand .dd{font-family:var(--f-mono);font-size:12px;color:var(--drop);border:1px solid var(--rule);border-radius:99px;padding:1px 9px}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:14px 10px 12px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--drop);font-weight:700}
.tabs button:hover{color:var(--ink)}
main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
.banner{max-width:880px;margin:10px auto 0;padding-inline:16px}
.banner p{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:17px}
hr.rule{border:0;border-top:1px dashed var(--rule);margin:4px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.3;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.btn.primary:hover{opacity:.9}
.btn.drop{background:var(--drop);border-color:var(--drop);color:#fff;font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;background:var(--surface);color:var(--ink-2)}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.ng{border-color:transparent;background:var(--ng-soft);color:var(--ng)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.drop{border-color:transparent;background:var(--drop-soft);color:var(--drop)}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--ink-3);border-radius:99px;padding:5px 12px;font-size:13px;background:none;color:var(--ink-2)}
.toggle[aria-pressed="true"]{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:700}

/* ---------- mark-sheet bubble ---------- */
.bub{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--drop);color:var(--drop);font-family:var(--f-mono);font-size:13px;font-weight:500;background:var(--surface);transition:background .12s,color .12s}
.bub.sm{width:22px;height:22px;font-size:11px;border-width:1.25px}
.bub.on{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.bub.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bub.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.bub.ring{box-shadow:0 0 0 3px var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px 28px;align-items:end}
.hero .rl{grid-column:1/-1;max-width:640px}
.count{font-family:var(--f-mono);font-weight:500;font-size:64px;line-height:.9;letter-spacing:-.03em}
.count small{font-size:18px;letter-spacing:0;margin-left:4px;color:var(--ink-2)}
.ruler{width:100%;height:auto;display:block;overflow:visible}
.ruler text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3)}
.ruler .t-mark{font-size:11.5px;fill:var(--ink)}
.split{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.split b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
@media (max-width:560px){.hero{grid-template-columns:1fr}.count{font-size:52px}}

/* ---------- plan rows ---------- */
.plan{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px dashed var(--rule)}
.prow:first-child{border-top:0}
.prow .t{font-weight:700;font-size:14.5px}
.prow .d{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px}

/* ---------- player ---------- */
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pbar .pl{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;color:var(--drop);border:1px solid var(--rule);border-radius:6px;padding:2px 8px}
.pbar .pc{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.pbar .sp{margin-left:auto}
.prog{height:3px;background:var(--sunk);border-radius:2px;margin-bottom:18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--drop)}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.clock.over{color:var(--warn)}
.stem{padding:4px 0 14px}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px}
.choice:hover{background:var(--sunk)}
.choice .ct{padding-top:2px}
.choice.picked{background:var(--sunk);border-color:var(--line)}
.choice[disabled]{cursor:default}
.choice[disabled]:hover{background:none}
.choice.picked[disabled]{background:var(--sunk)}
.qblock{padding:14px 0;border-top:1px dashed var(--rule)}
.qblock:first-child{border-top:0;padding-top:0}
.qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.qhead .n{font-family:var(--f-mono);font-size:12.5px;color:var(--drop)}
.qhead .qt{font-family:var(--f-en);font-size:16.5px;line-height:1.55}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.two .doccol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:760px){.two{grid-template-columns:1fr}.two .doccol{position:static;max-height:none}}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.doc .dl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.doc .dt{font-family:var(--f-en);font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.doc mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.blank{font-family:var(--f-mono);font-size:13px;color:var(--drop);white-space:nowrap}
.blank b{font-weight:600}

/* ---------- feedback ---------- */
.fb{margin-top:14px;border-radius:10px;padding:14px 16px;background:var(--sunk)}
.fb .v{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb .v.ok{color:var(--ok)} .fb .v.ng{color:var(--ng)}
.fb .ex{margin-top:8px;font-size:14.5px}
.fb .ja{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vocab span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.vocab span b{font-family:var(--f-en);font-weight:600;font-size:13.5px;margin-right:6px}
.tutor{margin-top:12px;border-top:1px dashed var(--rule);padding-top:12px}
.tutor textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical}
.msg{white-space:pre-wrap;font-size:14px;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.msg.me{background:none;border-style:dashed;color:var(--ink-2)}

/* ---------- listening ---------- */
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--drop);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.speed{display:flex;gap:4px}
.speed button{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.script{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sline{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start}
.sline .who{font-family:var(--f-mono);font-size:12px;color:var(--drop);padding-top:3px}
.sline .en{font-size:16px}
.sline button{border:0;background:none;color:var(--ink-3);padding:2px 6px;border-radius:6px}
.sline button:hover{color:var(--ink);background:var(--sunk)}
.sline.now .en{background:var(--hl);border-radius:3px}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi .k{font-size:12.5px;color:var(--ink-2)}
.kpi .n{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2}
.kpi .n small{font-size:13px;color:var(--ink-2);margin-left:3px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center;font-size:13.5px}
.bar-track{position:relative;height:14px;background:var(--sunk);border-radius:3px}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:0 4px 4px 0}
.bar-tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--drop)}
.bar-tick.t7{background:var(--ink-3)}
.bar-val{font-family:var(--f-mono);text-align:right;font-size:13px}
@media (max-width:520px){.bar-row{grid-template-columns:92px 1fr 52px}}
.tagtable{width:100%;border-collapse:collapse;font-size:13.5px}
.tagtable th{font-weight:400;color:var(--ink-3);text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tagtable td{padding:8px;border-bottom:1px dashed var(--rule);vertical-align:middle}
.tagtable td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3)}
.legend-note{font-size:12px;color:var(--ink-3);margin-top:6px}

/* ---------- misc ---------- */
.empty{padding:26px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--drop);border-radius:50%;animation:sp 0.9s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.gen{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 12px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:50;max-width:calc(100vw - 32px)}
.note{font-size:13px;color:var(--ink-2);line-height:1.65}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink-2)}
.field select,.field input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-height:38px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-3)}
.coach{border-left:3px solid var(--drop);padding:4px 0 4px 14px;white-space:pre-wrap;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* Starter bank — Part 5. Original questions. Explanations never cite choices by letter,
   so choice order can be shuffled safely at load. */
window.STARTER = window.STARTER || {};
STARTER.s5 = { part: 5, units: [
{q:"The marketing team conducted a ------- analysis of customer feedback before launching the campaign.",choices:["thoroughly","thorough","thoroughness","more thoroughly"],answer:1,tag:"pos",
 ex:"冠詞 a と名詞 analysis の間は、名詞を修飾する形容詞の位置です。thorough（徹底的な）が正解。副詞 thoroughly は名詞を修飾できず、名詞 thoroughness では a ------- analysis の形になりません。",
 ja:"マーケティングチームは、キャンペーン開始前に顧客の声を徹底的に分析した。",vocab:[["conduct","〜を実施する"],["customer feedback","顧客の意見"]]},
{q:"Ms. Tanaka responded ------- to the client's request, which impressed her supervisor.",choices:["prompt","promptness","promptly","prompted"],answer:2,tag:"pos",
 ex:"自動詞 responded の後ろで動詞を修飾するのは副詞。promptly（迅速に）が正解。prompt は形容詞・動詞、promptness は名詞です。",
 ja:"タナカさんは顧客の依頼に迅速に対応し、上司を感心させた。",vocab:[["supervisor","上司"]]},
{q:"By the time the new manager arrives next week, the renovation of the lobby ------- .",choices:["will complete","has completed","was completing","will have been completed"],answer:3,tag:"verb",
 ex:"By the time ＋現在形（arrives）で「未来のある時点までに」→ 未来完了。さらに主語 the renovation は「完了される」側なので受動態の will have been completed。",
 ja:"来週新しいマネージャーが着任するまでに、ロビーの改装は完了しているだろう。",vocab:[["renovation","改装"]]},
{q:"All employees ------- to submit their expense reports by the fifth of each month.",choices:["are required","require","requiring","have required"],answer:0,tag:"verb",
 ex:"require 人 to do（人に〜を求める）の受動態 be required to do。主語 employees は「求められる」側です。require や have required では目的語がなく to submit とつながりません。",
 ja:"全従業員は毎月5日までに経費報告書を提出しなければならない。",vocab:[["expense report","経費報告書"]]},
{q:"The list of approved vendors ------- updated every quarter by the purchasing department.",choices:["are","were","is","being"],answer:2,tag:"verb",
 ex:"主語は list（単数）。of approved vendors は修飾語なので、直前の vendors につられて are にしないこと。every quarter は習慣を表すので現在形 is。",
 ja:"承認済み業者のリストは購買部によって四半期ごとに更新される。",vocab:[["vendor","販売業者"],["purchasing department","購買部"]]},
{q:"Participants must bring ------- own laptops to the training session.",choices:["they","their","them","theirs"],answer:1,tag:"pron",
 ex:"own は所有格と組み合わせて「自分自身の」を表します（their own laptops）。空所の後ろに名詞句が続くので所有格 their。",
 ja:"参加者は研修に各自のノートパソコンを持参しなければならない。",vocab:[]},
{q:"The director thanked the volunteers and told ------- that the event had raised over $10,000.",choices:["they","their","theirs","them"],answer:3,tag:"pron",

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const diffDays = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000); };
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v)).trim();
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function shuffleQ(q, seed) {
  const r = rng(seed), idx = q.choices.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  q.choices = idx.map(i => q.choices[i]); q.answer = idx.indexOf(q.answer);
}
Object.assign(App, { esc, today, addDays, diffDays, clone, sleep, uid, hash });

/* ---------- events ---------- */
const handlers = {};
App.on = (ev, fn) => { (handlers[ev] = handlers[ev] || []).push(fn); };
App.emit = (ev, data) => { (handlers[ev] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(e); } }); };

const INTERVALS = [1, 3, 7, 14, 30];

App.record = function (r) {
  // r: {part, key, tag, ok, guess, sec, mode}

    const v = o[k] || (o[k] = { n: 0, c: 0, s: 0, ema: null });
    v.n++; v.c += r.ok ? 1 : 0; v.s = Math.round((v.s + r.sec) * 10) / 10;
    v.ema = Math.round(((v.ema == null ? 0.6 : v.ema) * 0.8 + credit * 0.2) * 1000) / 1000;
  };

  const dp = S.day.parts[r.part] || (S.day.parts[r.part] = { n: 0, c: 0 }); dp.n++; dp.c += r.ok ? 1 : 0;
  Store.save('meta/stats', S.stats);

function addReview(r) {

  if (c) { c.box = 0; c.lapses = (c.lapses || 0) + 1; }
  else { c = { key: r.key, part: r.part, tag: r.tag, box: 0, lapses: 0, added: t }; S.reviews.push(c); }
  c.due = addDays(t, 1); c.last = t; c.guess = !!(r.ok && r.guess);
  Store.save('review/' + r.key, c);
}
function reviewResult(key, ok, guess) {
  const t = today(), c = S.reviews.find(x => x.key === key);
  if (!c) return;
  if (ok && !guess) {
    c.box = (c.box || 0) + 1;
    if (c.box >= INTERVALS.length) { c.done = true; c.due = '9999-12-31'; }
    else c.due = addDays(t, INTERVALS[c.box]);
  } else if (ok) { c.due = addDays(t, 1); }
  else { c.box = 0; c.lapses = (c.lapses || 0) + 1; c.due = addDays(t, 1); }

const FEMALE = /(female|woman|zira|aria|jenny|michelle|hazel|susan|libby|sonia|maisie|natasha|clara|emma|ava\b|samantha|karen|moira|tessa|fiona|victoria|serena|allison|joanna|salli|kimberly|ivy|kendra|nicole|olivia|amber|ashley|cora|elizabeth|jane|nancy|sara|linda|catherine|heather|annette|freya|elsie|abbi|bella|hollie|mia\b|leah|molly|google us english|google uk english female)/i;
const MALE = /(\bmale|\bman\b|david|mark|guy|ryan|george|william|christopher|eric|roger|steffan|thomas|daniel|alex\b|fred|oliver|arthur|brandon|davis|jacob|jason|tony|andrew|brian|liam|james|richard|sean|connor|duncan|elliot|ethan|harry|lewis|matthew|google uk english male)/i;

const TTS = App.TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [], female: [], male: [], token: 0, _u: null,
  init() {
    if (!this.ok) return;
    const load = () => {
      let all = [];
      try { all = speechSynthesis.getVoices() || []; } catch (e) { all = []; }
      this.voices = all.filter(v => /^en([-_]|$)/i.test(v.lang));
      this.female = this.voices.filter(v => FEMALE.test(v.name)).sort((a, b) => quality(b) - quality(a));
      this.male = this.voices.filter(v => !FEMALE.test(v.name) && MALE.test(v.name)).sort((a, b) => quality(b) - quality(a));
      App.emit('voices');
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  byName(n) { return this.voices.find(v => v.name === n) || null; },
  pick(gender, seed) {
    const list = gender === 'M' ? this.male : this.female;
    if (S.profile.voiceMode === 'fixed') { const v = this.byName(gender === 'M' ? S.profile.voiceM : S.profile.voiceW); if (v) return { voice: v, pitch: 1 }; }
    if (list.length) {
      const top = list.filter(v => quality(v) === quality(list[0]));
      return { voice: top[seed % top.length], pitch: 1 };
    }

  },
  cast(seedStr) {

    const m2 = this.pick('M', (s >>> 5) + 1), w2 = this.pick('W', (s >>> 7) + 1);
    if (m2.voice === m.voice) m2.pitch = 0.9;
    if (w2.voice === w.voice) w2.pitch = 1.12;

  },
  stop() { this.token++; try { if (this.ok) speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
  say(text, v, rate, token) {
    return new Promise(res => {
      if (!this.ok || token !== this.token) return res(false);
      const u = new SpeechSynthesisUtterance(text);
      u.lang = v && v.voice ? v.voice.lang : 'en-US';

      u.pitch = (v && v.pitch) || 1; u.rate = rate || 1;

      if (opt.onLine) opt.onLine(i);

    }

    return true;
  }

</script>
<script>
/* player.js — study session engine and question screens */
(function () {
'use strict';
const App = window.App, S = App.S, esc = App.esc;
const $ = (s, r) => (r || document).querySelector(s);
const LET = ['A', 'B', 'C', 'D'];
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
const pct = x => Math.round(x * 100) + '%';
const fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const stage = () => $('#view');
let sess = null, cur = null;

/* ---------- session ---------- */
function focusJob(part, n, focus) {
  const job = { done: false, error: null, progress: '', listeners: new Set(), batch: null };
  App.AI.gen(part, { count: n, focus, onProgress: t => { job.progress = t; job.listeners.forEach(f => f(job)); } })
    .then(b => { job.batch = b; }).catch(e => { job.error = e; })
    .finally(() => { job.done = true; job.listeners.forEach(f => f(job)); App.emit('stock', part); });
  return job;
}
App.startSession = function (opt) {
  App.TTS.stop();
  App.leavePlayer();
  sess = { title: opt.title, queue: [], i: 0, results: [], started: Date.now(), used: new Set(), busy: false };
  opt.blocks.forEach(b => {
    if (b.kind === 'review') {
      App.dueToday().slice(0, b.n || 15).forEach(r => sess.queue.push({ type: 'review', block: b.id, key: r.key, part: r.part }));
    } else if (b.part) {
      const step = { type: 'fill', block: b.id, part: b.part, n: b.n, fresh: !!b.fresh, focus: b.focus || null };
      if (step.fresh) step.job = focusJob(b.part, b.n, b.focus);
      else App.ensure(b.part, b.n * 2);
      sess.queue.push(step);
    }
  });
  App.current = 'player';
  document.querySelectorAll('#tabs button').forEach(x => x.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
  advance(0);
};
App.leavePlayer = () => {
  if (cur) closeUnit(true);
  sess = null; cur = null;
};
const unitStep = (step, p) => ({ type: 'new', block: step.block, part: step.part, b: p.b, u: p.u });
async function expandFill(step) {
  const my = sess;
  let picks = [];
  if (step.fresh) {
    if (!step.job.done && !(await waitJob(step.job, step))) return [];
    if (step.job.batch) picks = step.job.batch.units.map((u, ui) => ({ b: step.job.batch.id, u: ui }));
    else if (step.job.error) App.toast(App.AI.message(step.job.error) || '問題を作成できませんでした');
  } else {
    picks = App.unseen(step.part, my.used).slice(0, step.n);
    if (!picks.length) {
      const job = App.job(step.part) || App.ensure(step.part, Infinity);
      if (!job) { App.toast('Part ' + step.part + ' の未出題の問題がありません'); return []; }
      if (!(await waitJob(job, step))) return [];
      if (job.error) { const m = App.AI.message(job.error); if (m) App.toast(m); }
      picks = App.unseen(step.part, my.used).slice(0, step.n);
    } else if (picks.length < step.n && App.AI.on) {
      App.ensure(step.part, Infinity);
      picks.forEach(p => my.used.add(App.keyOf(p.b, p.u, 0)));
      return picks.map(p => unitStep(step, p)).concat([{ type: 'fill', block: step.block, part: step.part, n: step.n - picks.length }]);
    }
  }
  picks.forEach(p => my.used.add(App.keyOf(p.b, p.u, 0)));
  return picks.map(p => unitStep(step, p));
}
function waitJob(job, step) {
  return new Promise(resolve => {
    const P = App.PART[step.part];
    stage().innerHTML = header(step) + `<div class="gen"><span class="spin" style="width:26px;height:26px;border-width:3px"></span>
      <h2 style="font-size:17px">Claude が Part ${step.part} の問題を作っています</h2>
      <p class="note mono" id="genInfo">問題を考えています…（20〜60秒）</p>
      <p class="note">${step.focus ? '選んだ分野に絞って' : 'いまの弱点を多めに入れて'}作成します。初回は AI 利用の許可を求められます。</p>
      <div class="actions"><button class="btn sm ghost" id="skipGen">待たずに次へ進む</button></div></div>`;
    bindHeader();
    let settled = false;
    const finish = v => { if (settled) return; settled = true; job.listeners.delete(fn); resolve(v); };
    const fn = () => {
      const n = App.progressCount(job.progress), el = $('#genInfo');
      if (el && n) el.textContent = P.set ? '設問 ' + n + ' 問目まで作成しました…' : n + ' 問目まで作成しました…';
      if (job.done) finish(true);
    };
    job.listeners.add(fn);
    $('#skipGen').onclick = () => finish(false);
    if (job.done) finish(true);
  });
}
async function advance(delta) {
  const my = sess;
  if (!my || my.busy) return;
  my.busy = true;
  try {
    if (cur) closeUnit(false);
    my.i += delta;
    for (;;) {
      if (sess !== my) return;
      if (my.i >= my.queue.length) { summary(); return; }
      const step = my.queue[my.i];
      if (step.type === 'fill') { const steps = await expandFill(step); if (sess !== my) return; my.queue.splice(my.i, 1, ...steps); continue; }
      if (await show(step)) return;
      my.queue.splice(my.i, 1);
    }
  } finally { my.busy = false; }
}
function closeUnit(leaving) {
  const c = cur; if (!c) return;
  clearInterval(c.timer); clearInterval(c.pre);
  App.TTS.stop();
  App.addStudy((Date.now() - c.t0) / 1000);
  const st = c.step;
  if (!leaving && sess && st.answered && st.block !== 'extra') {
    const nx = sess.queue[sess.i + 1];
    if (!nx || nx.block !== st.block) { S.day.done[st.block] = true; App.saveDay(); }
  }
  cur = null;
}
async function show(step) {
  let batch, u;
  if (step.type === 'review') {
    const k = App.parseKey(step.key);
    batch = await App.fetchBatch(k.b);
    if (!batch || !batch.units[k.u]) return false;
    u = k.u;
    cur = mkCur(step, batch, u, App.PART[batch.part].set ? [k.q] : [0]);
    if (App.PART[batch.part].set && !batch.units[u].qs[k.q]) { cur = null; return false; }
  } else {
    batch = App.batch(step.b);
    if (!batch || !batch.units[step.u]) return false;
    u = step.u;
    cur = mkCur(step, batch, u, App.PART[batch.part].set ? batch.units[u].qs.map((_, i) => i) : [0]);

const mkCur = (step, batch, u, qIdx) => ({ step, batch, part: batch.part, uIdx: u, unit: batch.units[u], qIdx, sel: {}, guess: {}, graded: false, t0: Date.now(), timer: null, pre: null, tutor: {}, review: step.type === 'review', playing: false });
const qOf = qi => (App.PART[cur.part].set ? cur.unit.qs[qi] : cur.unit);

/* ---------- rendering ---------- */
function header(step) {
  const total = sess.queue.length, more = sess.queue.slice(sess.i + 1).some(s => s.type === 'fill');
  return `<div class="pbar"><span class="pl">PART ${step.part}</span><span class="pc">${Math.min(sess.i + 1, total)} / ${total}${more ? '+' : ''}</span>${step.type === 'review' ? '<span class="chip drop">復習</span>' : ''}<span class="clock" id="clock"></span><button class="btn sm ghost sp" id="quit">終了</button></div>
  <div class="prog"><i style="width:${total ? Math.round(sess.i / total * 100) : 0}%"></i></div>`;
}
function bindHeader() { const q = $('#quit'); if (q) q.onclick = summary; }
function render() {
  const c = cur, P = c.part;
  const body = P === 5 ? r5() : P === 2 ? r2() : P === 6 ? r6() : P === 7 ? r7() : r34();

  bindHeader(); bindAll();
  if (!c.graded) { startClock(); if (App.PART[P].sec === 'L') autoPlay(); }
}
const blankify = (s, fill) => esc(s).replace(/-------/g, fill ? `<span class="blank" style="color:var(--ok)">${esc(fill)}</span>` : '<span class="blank">-------</span>');
function choiceList(qi, q, showText) {

  }).join('')}</div>`;
}
function answerBar(single) {

  <span class="note">${s ? '<span class="kbd">A</span>–<span class="kbd">' + LET[App.PART[cur.part].nc - 1] + '</span> で選択　<span class="kbd">Enter</span> で解答　<span class="kbd">G</span> で迷った' : 'すべてマークすると採点できます。自信のない設問は「迷った」を押してください。'}</span></div>`;
}
function nextBar() {

}
function statusChip(qi, ok) {

}
function feedback(qi, q, extra) {
  const c = cur, sel = c.sel[qi], ok = sel === q.answer, pace = App.PART[c.part].pace;
  const time = c.part === 5 ? `<span class="chip ${c.answerSec > pace * 1.5 ? 'warn' : ''}">${Math.round(c.answerSec)}秒${c.answerSec > pace ? '（目標' + pace + '秒）' : ''}</span>` : '';
  let h = `<div class="fb"><div class="v ${ok ? 'ok' : 'ng'}">${ok ? '✓ 正解' : '✕ 不正解'}<span class="muted" style="font-weight:400">正解 (${LET[q.answer]}) <span class="en" style="font-size:15px">${esc(q.choices[q.answer])}</span></span>${statusChip(qi, ok)}${time}</div>`;
  if (q.ex) h += `<div class="ex">${esc(q.ex)}</div>`;

  if (extra && extra.vocab && extra.vocab.length) h += `<div class="vocab">${extra.vocab.map(v => `<span><b>${esc(v[0])}</b>${esc(v[1])}</span>`).join('')}</div>`;
  if (App.AI.on) h += `<div class="actions" style="margin-top:10px"><button class="btn sm" data-ask="${qi}">Claude に質問する</button>${!ok || c.guess[qi] ? `<button class="btn sm ghost" data-sim="${qi}">似た問題を作る</button>` : ''}</div><div class="tutor" id="tutor${qi}" hidden></div>`;
  return h + '</div>';
}
function qBlock(qi, label, text) {
  const c = cur, q = qOf(qi), multi = c.qIdx.length > 1;
  return `<div class="qblock"><div class="qhead"><span class="n">${esc(label)}</span>${text ? `<span class="qt">${esc(text)}</span>` : ''}</div>${choiceList(qi, q, true)}
    ${!c.graded && multi ? `<div class="actions" style="margin-top:6px"><button class="toggle" data-g="${qi}" aria-pressed="${!!c.guess[qi]}">迷った</button></div>` : ''}${c.graded ? feedback(qi, q, null) : ''}</div>`;
}
const singleOf = () => (cur.qIdx.length === 1 ? cur.qIdx[0] : null);

function r5() {
  const c = cur, q = c.unit;
  return `<div class="stem en">${blankify(q.q, c.graded ? q.choices[q.answer] : null)}</div>${choiceList(0, q, true)}${c.graded ? feedback(0, q, { ja: q.ja, vocab: q.vocab }) + nextBar() : answerBar(0)}`;
}
function r2() {
  const c = cur, u = c.unit;
  let h = playerBar();
  if (!c.graded) return h + `<p class="note" style="margin-bottom:8px">Mark your answer on your answer sheet.　問いかけへの最も適切な応答を選んでください。</p>${choiceList(0, u, false)}${answerBar(0)}`;
  h += `<div class="script" style="margin-bottom:10px"><div class="sline" data-idx="0"><span class="who">${esc(u.spk)}</span><span class="en">${esc(u.text)}</span><button data-line="0" aria-label="この文を再生">▶</button></div></div>`;
  return h + choiceList(0, u, true) + feedback(0, u, { ja: u.ja }) + shadowBar() + nextBar();
}
function r34() {
  const c = cur, u = c.unit;
  let h = playerBar();
  if (c.part === 4 && u.kind) h += `<div class="label" style="margin-bottom:6px">${esc(u.kind)}</div>`;
  h += c.qIdx.map(qi => qBlock(qi, 'Q' + (qi + 1), u.qs[qi].q)).join('');
  if (!c.graded) return h + answerBar(singleOf());
  h += `<section class="card" style="margin-top:16px"><div class="sec-h"><h2>スクリプト</h2></div><div class="script">${u.lines.map((l, i) => `<div class="sline" data-idx="${i}"><span class="who">${esc(l[0])}</span><span class="en">${esc(l[1])}</span><button data-line="${i}" aria-label="この文を再生">▶</button></div>`).join('')}</div>
    ${u.ja ? `<details style="margin-top:10px"><summary class="note">和訳を表示</summary><p class="note" style="margin-top:6px">${esc(u.ja)}</p></details>` : ''}${shadowBar()}</section>`;
  return h + nextBar();
}
function r6() {
  const c = cur, u = c.unit;
  const text = esc(u.text).replace(/\[\[(\d)\]\]/g, (m, d) => {
    const qi = +d - 1, q = u.qs[qi];
    if (!q) return m;
    const active = c.qIdx.indexOf(qi) >= 0;
    if (c.graded || !active) return `<span class="blank" style="color:${active ? 'var(--ok)' : 'var(--ink-2)'}">(${d}) ${esc(q.choices[q.answer])}</span>`;
    return `<span class="blank">(<b>${d}</b>) -------</span>`;
  });
  const doc = `<div class="doc"><div class="dl">${esc(u.title || 'Text')}</div><div class="dt">${text}</div></div>${c.graded && u.ja ? `<details class="doc"><summary class="note">全文の和訳</summary><p class="note" style="margin-top:6px">${esc(u.ja)}</p></details>` : ''}`;
  const qs = c.qIdx.map(qi => qBlock(qi, '(' + (qi + 1) + ')', u.qs[qi].choices[0].split(' ').length > 4 ? '空所に入る最も適切な文' : '')).join('');

function hl(text, marks) {
  const ranges = [];
  marks.forEach(m => {
    if (!m) return;
    let i = text.indexOf(m);
    if (i < 0) i = text.toLowerCase().indexOf(m.toLowerCase());
    if (i >= 0) ranges.push([i, i + m.length]);
  });
  ranges.sort((a, b) => a[0] - b[0]);

  ranges.forEach(r => { const s = Math.max(r[0], pos); if (r[1] <= s) return; out += esc(text.slice(pos, s)) + '<mark>' + esc(text.slice(s, r[1])) + '</mark>'; pos = r[1]; });

  const extra = c.graded ? `${marks.length ? '<p class="note" style="margin-bottom:8px">黄色の部分が正解の根拠です。</p>' : ''}${App.AI.on ? '<button class="btn sm ghost" id="trans">Claude に全文訳を頼む</button><div id="transOut"></div>' : ''}` : '';

/* ---------- interaction ---------- */
function bindAll() {
  const st = stage();
  st.querySelectorAll('.choice').forEach(b => { b.onclick = () => pick(+b.dataset.q, +b.dataset.c); });
  st.querySelectorAll('[data-g]').forEach(b => { b.onclick = () => { const qi = +b.dataset.g; cur.guess[qi] = !cur.guess[qi]; b.setAttribute('aria-pressed', String(!!cur.guess[qi])); }; });
  const sub = $('#submit'); if (sub) { sub.onclick = grade; updateSubmit(); }
  const nx = $('#next'); if (nx) nx.onclick = () => advance(1);
  const pl = $('#play'); if (pl) pl.onclick = togglePlay;
  st.querySelectorAll('[data-rate]').forEach(b => { b.onclick = () => { S.profile.rate = +b.dataset.rate; App.saveProfile(); st.querySelectorAll('[data-rate]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.rate === S.profile.rate))); }; });
  st.querySelectorAll('[data-line]').forEach(b => { b.onclick = () => playLine(+b.dataset.line); });
  const rp = $('#replay'); if (rp) rp.onclick = () => playAll();
  const sh = $('#shadow'); if (sh) sh.onclick = shadow;

}
function pick(qi, ci) {
  if (!cur || cur.graded || ci >= App.PART[cur.part].nc) return;
  cur.sel[qi] = ci;
  stage().querySelectorAll('.choice[data-q="' + qi + '"]').forEach(b => {
    const on = +b.dataset.c === ci;
    b.classList.toggle('picked', on); b.setAttribute('aria-checked', String(on));
    b.querySelector('.bub').classList.toggle('on', on);
  });

}
function updateSubmit() { const b = $('#submit'); if (b && cur) b.disabled = cur.qIdx.some(qi => cur.sel[qi] == null); }
function startClock() {
  const el = $('#clock'); if (!el) return;
  const pace = App.PART[cur.part].pace, target = pace ? pace * cur.qIdx.length : null, me = cur;
  const tick = () => { const s = (Date.now() - me.t0) / 1000; el.textContent = fmtT(s) + (target ? ' / ' + fmtT(target) : ''); el.classList.toggle('over', !!target && s > target); };
  tick(); me.timer = setInterval(tick, 500);
}
function grade() {
  const c = cur;
  if (!c || c.graded || c.qIdx.some(qi => c.sel[qi] == null)) return;
  clearInterval(c.timer); clearInterval(c.pre);
  App.TTS.stop(); c.playing = false;
  c.graded = true;
  c.answerSec = Math.min(180, (Date.now() - c.t0) / 1000 / c.qIdx.length);
  c.qIdx.forEach(qi => {
    const q = qOf(qi), ok = c.sel[qi] === q.answer, guess = !!c.guess[qi];
    const key = c.review ? c.step.key : App.keyOf(c.batch.id, c.uIdx, qi);
    const sec = Math.round(c.answerSec * 10) / 10;
    App.record({ part: c.part, key, tag: q.tag, ok, guess, sec, mode: c.review ? 'review' : 'new' });
    sess.results.push({ part: c.part, tag: q.tag, ok, guess, sec, review: c.review });
  });
  c.step.answered = true;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

/* ---------- audio ---------- */
function playerBar() {
  const r = S.profile.rate || 1;
  return `<div class="player"><button class="play" id="play" aria-label="再生／停止">${PLAY}</button>
    <div style="flex:1;min-width:150px"><div id="pstat" class="note">${App.TTS.ok ? 'まもなく再生します' : 'このブラウザは音声の読み上げに対応していません'}</div></div>
    <div class="speed" role="group" aria-label="再生速度">${[0.8, 0.9, 1, 1.1, 1.2].map(s => `<button data-rate="${s}" aria-pressed="${s === r}">${s.toFixed(1)}×</button>`).join('')}</div></div>`;
}
function shadowBar() {

    <span class="note">1文ごとに間が空くので、聞こえたとおりに声に出してみましょう（シャドーイング）。▶ で1文だけ再生できます。</span></div>`;
}
const setP = t => { const el = $('#pstat'); if (el) el.textContent = t; };
const setPlayBtn = on => { const b = $('#play'); if (b) b.innerHTML = on ? STOP : PLAY; };
function audioItems() {
  const u = cur.unit, cast = App.TTS.cast(cur.batch.id + ':' + cur.uIdx);
  if (cur.part === 2) {
    const qv = cast[u.spk === 'M' ? 'M' : 'W'], rv = cast[u.spk === 'M' ? 'W' : 'M'];
    return [{ text: u.text, v: qv, gap: 900 }].concat(u.choices.map((t, i) => ({ text: LET[i] + '. ' + t, v: rv, gap: 700 })));
  }
  return u.lines.map(l => ({ text: l[1], v: cast[l[0]] || cast.W, gap: cur.part === 4 ? 250 : 380 }));
}
function hlLine(i) { stage().querySelectorAll('.sline').forEach(el => el.classList.toggle('now', +el.dataset.idx === i)); }
async function runAudio(items, label, idxMap) {
  const me = cur;
  if (!App.TTS.ok || !me) return;
  clearInterval(me.pre);
  me.playing = true; setPlayBtn(true);
  const done = await App.TTS.play(items, { onLine: i => { if (cur !== me) return; if (i >= 0) setP(label + ' ' + (i + 1) + ' / ' + items.length); hlLine(i < 0 ? -1 : idxMap ? idxMap(i) : i); } });
  if (cur !== me) return;
  me.playing = false; setPlayBtn(false);

}
const playAll = () => runAudio(audioItems(), '再生中…');
function togglePlay() {

  if (cur.playing) { App.TTS.stop(); cur.playing = false; setPlayBtn(false); setP('停止しました'); }
  else playAll();
}

function shadow() {
  const items = audioItems().map(it => Object.assign({}, it, { gap: Math.round(900 + it.text.split(/\s+/).length * 430 / (S.profile.rate || 1)) }));
  runAudio(items, 'リピート練習', null);
}
function autoPlay() {
  const me = cur;
  if (!App.TTS.ok) return;
  if (me.part === 2) { setTimeout(() => { if (cur === me && !me.playing && !me.graded) playAll(); }, 700); return; }
  let left = me.review ? 3 : 8;
  const msg = () => setP('設問を先読みしてください… ' + left + '秒後に再生（▶ ですぐ再生）');
  msg();
  me.pre = setInterval(() => {
    if (cur !== me || me.playing || me.graded) { clearInterval(me.pre); return; }
    left--;
    if (left <= 0) { clearInterval(me.pre); playAll(); } else msg();
  }, 1000);
}

/* ---------- Claude tutor, similar questions, translation ---------- */
function tutorContext(qi) {
  const c = cur, u = c.unit, q = qOf(qi), sel = c.sel[qi], ok = sel === q.answer;
  let s = 'あなたは TOEIC L&R の指導経験が豊富な、日本人学習者向けの英語講師です。学習者（前回645点、本番で800点が目標）の質問に日本語で答えてください。結論を先に、300字程度まで。必要なら短い英語の例文を1〜2個添えてください。問題の正解は変えないでください。\n\n';
  s += '[TOEIC Part ' + c.part + ']\n';
  if (c.part === 5) s += '問題文: ' + u.q + '\n';
  else if (c.part === 2) s += '問いかけ: ' + u.text + '\n';
  else if (c.part === 6) s += '本文:\n' + u.text + '\n設問: 空所 [[' + (qi + 1) + ']]\n';
  else if (c.part === 7) s += u.docs.map(d => '[' + d.label + ']\n' + d.text).join('\n\n') + '\n設問: ' + q.q + '\n';
  else s += 'スクリプト:\n' + u.lines.map(l => l[0] + ': ' + l[1]).join('\n') + '\n設問: ' + q.q + '\n';
  s += '選択肢:\n' + q.choices.map((t, i) => '(' + LET[i] + ') ' + t).join('\n') + '\n';
  s += '正解: (' + LET[q.answer] + ') ' + q.choices[q.answer] + '\n学習者の解答: (' + LET[sel] + ') ' + q.choices[sel] + (ok ? '（正解）' : '（不正解）') + (c.guess[qi] ? '・迷いながら解答' : '') + '\n';
  if (q.ex) s += '解説: ' + q.ex + '\n';
  return s;
}
function openTutor(qi) {
  const box = $('#tutor' + qi); if (!box) return;
  box.hidden = !box.hidden;
  if (box.hidden || box.dataset.init) return;
  box.dataset.init = '1';
  box.innerHTML = `<div class="row">${['なぜ他の選択肢はダメ？', 'この文法をもっと詳しく', '似た例文を3つ'].map(s => `<button class="chip" data-quick="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="msgs"></div>
    <div class="field" style="margin-top:10px"><label for="tq${qi}">質問（日本語でOK）</label><textarea id="tq${qi}" placeholder="例：なぜ現在完了になるの？"></textarea></div>
    <div class="actions"><button class="btn sm primary" data-send="1">送信</button></div>`;
  box.querySelectorAll('[data-quick]').forEach(b => { b.onclick = () => sendTutor(qi, b.dataset.quick); });
  box.querySelector('[data-send]').onclick = () => { const ta = $('#tq' + qi), v = ta.value.trim(); if (v) { ta.value = ''; sendTutor(qi, v); } };
}
async function sendTutor(qi, text) {
  const me = cur, box = $('#tutor' + qi); if (!me || !box) return;
  const list = box.querySelector('.msgs'), btn = box.querySelector('[data-send]');
  if (btn.disabled) return;
  const turns = me.tutor[qi] || (me.tutor[qi] = []);
  turns.push({ role: 'user', content: turns.length ? text : tutorContext(qi) + '\n質問: ' + text });
  const mine = document.createElement('div'); mine.className = 'msg me'; mine.textContent = text; list.appendChild(mine);
  const out = document.createElement('div'); out.className = 'msg'; out.textContent = '考え中…'; list.appendChild(out);
  btn.disabled = true;
  try {
    const input = turns.length > 7 ? [turns[0]].concat(turns.slice(-6)) : turns.slice();
    const ans = await App.AI.ask(input, { onText: ({ text: t }) => { out.textContent = t; } });
    turns.push({ role: 'assistant', content: ans }); out.textContent = ans;
  } catch (e) {
    turns.pop();
    const m = App.AI.message(e);
    out.textContent = (e && e.text ? e.text + '\n\n' : '') + (m || '中断しました');
  } finally { btn.disabled = false; }
}
async function makeSimilar(qi, btn) {
  const me = cur, q = qOf(qi), P = me.part, u = me.unit;
  const like = P === 5 ? { q: u.q, correct: u.choices[u.answer], tag: u.tag } : P === 2 ? { text: u.text, correct: u.choices[u.answer], tag: u.tag } : { question: q.q || ('blank ' + (qi + 1)), correct: q.choices[q.answer], tag: q.tag };
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 作成中…';
  try {
    const batch = await App.AI.gen(P, { count: P === 5 || P === 2 ? 3 : 1, focus: [q.tag], like });
    if (!sess) return;
    const at = sess.queue.indexOf(me.step); if (at < 0) return;
    const steps = batch.units.map((x, ui) => ({ type: 'new', block: 'extra', part: P, b: batch.id, u: ui }));
    steps.forEach(s => sess.used.add(App.keyOf(s.b, s.u, 0)));
    sess.queue.splice(at + 1, 0, ...steps);
    btn.textContent = 'このあとに ' + steps.length + (App.PART[P].set ? 'セット' : '問') + ' 追加しました';
    const nb = $('#next'); if (nb) nb.textContent = '次へ';
  } catch (e) {
    btn.disabled = false; btn.textContent = '似た問題を作る';
    const m = App.AI.message(e); if (m) App.toast(m);
  }
}
async function translate(btn) {
  const me = cur, out = $('#transOut'); if (!me || !out) return;
  btn.disabled = true;
  const box = document.createElement('div'); box.className = 'msg'; box.textContent = '翻訳しています…'; out.innerHTML = ''; out.appendChild(box);
  const src = me.unit.docs.map(d => '[' + d.label + ']\n' + d.text).join('\n\n');
  try {
    const t = await App.AI.ask('次の英文を、TOEIC学習者が英文と対照しやすい自然な日本語に全訳してください。見出しや段落の区切りは原文どおりに保ち、訳文だけを出力してください。\n\n' + src, { cache: { gcTime: 86400000 }, tier: 'quick', onText: ({ text }) => { box.textContent = text; } });
    box.textContent = t;
  } catch (e) { box.textContent = App.AI.message(e) || '中断しました'; btn.disabled = false; }
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (App.current !== 'player' || !cur) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (tag === 'BUTTON' && (k === 'enter' || k === ' ')) return;
  if (cur.graded) { if (k === 'enter' || k === 'n') { e.preventDefault(); advance(1); } return; }
  if (k === 'enter') { const b = $('#submit'); if (b && !b.disabled) { e.preventDefault(); grade(); } return; }
  if (k === ' ' && App.PART[cur.part].sec === 'L') { e.preventDefault(); togglePlay(); return; }
  const single = singleOf(); if (single == null) return;
  const map = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 };
  if (Object.prototype.hasOwnProperty.call(map, k)) { e.preventDefault(); pick(single, map[k]); }
  else if (k === 'g') { const t = stage().querySelector('[data-g]'); if (t) t.click(); }
});

/* ---------- summary ---------- */
function summary() {
  const s = sess; if (!s) { App.go('home'); return; }
  if (cur) closeUnit(false);
  App.TTS.stop();
  sess = null; cur = null;
  App.current = 'summary';
  const R = s.results, n = R.length, c = R.filter(r => r.ok).length;
  const mins = Math.max(1, Math.round((Date.now() - s.started) / 60000));
  const newRev = R.filter(r => !r.review && (!r.ok || r.guess)).length;
  const byPart = {}; R.forEach(r => { const b = byPart[r.part] || (byPart[r.part] = { n: 0, c: 0, s: 0 }); b.n++; b.c += r.ok ? 1 : 0; b.s += r.sec; });
  const miss = {}; R.filter(r => !r.ok || r.guess).forEach(r => { miss[r.tag] = (miss[r.tag] || 0) + 1; });
  const missRows = Object.entries(miss).sort((a, b) => b[1] - a[1]);
  stage().innerHTML = `<div class="stack">
    <section class="card"><div class="label">${esc(s.title)}</div><h1 style="font-size:22px;margin-top:4px">おつかれさまでした</h1>
      <div class="kpis" style="margin-top:14px">
        <div class="kpi"><div class="k">解答</div><div class="n">${n}<small>問</small></div></div>
        <div class="kpi"><div class="k">正答率</div><div class="n">${n ? pct(c / n) : '—'}</div></div>
        <div class="kpi"><div class="k">かかった時間</div><div class="n">${mins}<small>分</small></div></div>
        <div class="kpi"><div class="k">復習に追加</div><div class="n">${newRev}<small>問</small></div></div>
      </div></section>
    ${n ? `<section class="card"><div class="sec-h"><h2>パート別</h2></div><div class="bars">${Object.keys(byPart).sort().map(p => { const b = byPart[p]; return `<div class="bar-row"><span>Part ${p}</span><div class="bar-track"><span class="bar-fill" style="width:${Math.max(2, b.c / b.n * 100)}%"></span></div><span class="bar-val">${b.c}/${b.n}</span></div>`; }).join('')}</div>
      ${byPart[5] ? `<p class="legend-note">Part 5 の平均解答時間 ${Math.round(byPart[5].s / byPart[5].n)}秒（本番の目安は20秒）</p>` : ''}</section>` : ''}
    ${missRows.length ? `<section class="card"><div class="sec-h"><h2>間違えた・迷った分野</h2></div><div class="row">${missRows.map(([t, k]) => `<span class="chip ng">${esc(App.tagName(t))} ×${k}</span>`).join('')}</div><p class="note" style="margin-top:8px">これらは明日以降の復習に出ます。AI の新しい問題もこの分野が多めになります。</p></section>` : ''}
    ${n && App.AI.on ? '<section class="card"><div class="sec-h"><h2>Claude からひとこと</h2></div><div id="advice" class="note">今回の結果をもとに、次にやることを短くアドバイスします。</div><div class="actions"><button class="btn sm" id="adv">アドバイスをもらう</button></div></section>' : ''}
    <div class="actions"><button class="btn primary" id="home">ホームへ戻る</button></div>
  </div>`;
  window.scrollTo(0, 0);
  $('#home').onclick = () => App.go('home');
  const adv = $('#adv');
  if (adv) adv.onclick = async () => {
    adv.disabled = true;
    const box = $('#advice'); box.textContent = '考え中…'; box.classList.remove('note'); box.style.whiteSpace = 'pre-wrap';
    const weak = App.weakTags(null, 4).map(t => App.tagName(t) + ' ' + pct(S.stats.tags[t].ema)).join('、') || 'まだ不明';
    const lines = Object.keys(byPart).map(p => `- Part ${p}: ${byPart[p].c}/${byPart[p].n} 正解、平均 ${Math.round(byPart[p].s / byPart[p].n)} 秒`).join('\n');
    const prompt = `あなたはTOEIC学習コーチです。学習者は前回645点（L350/R295）、12月19日の本番で800点が目標で、本番まであと${App.diffDays(App.today(), App.EXAM)}日、平日は1日1時間（うち単語30分）学習しています。今回の練習結果を見て、日本語で短くフィードバックしてください。\n形式：「よかった点」1行、「課題」1〜2行、「次にやること」1行。全体で200字以内。専門用語には短い説明を添える。\n\n今回の結果：\n${lines}\n間違えた・迷った分野：${missRows.map(([t, k]) => App.tagName(t) + '×' + k).join('、') || 'なし'}\nこれまでの弱点（直近の正答率が低い順）：${weak}`;
    try { box.textContent = await App.AI.ask(prompt, { onText: ({ text }) => { box.textContent = text; } }); }
    catch (e) { box.textContent = App.AI.message(e) || '中断しました'; adv.disabled = false; }
  };
}
})();

</script>
<script>
/* pwa.js — offline kit glue shared by every page: service worker, link back to the kit home, persistent storage */
(function () {
  'use strict';
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ }); });
  }
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (p) { if (!p) return navigator.storage.persist(); }).catch(function () {});
    }
  } catch (e) { /* ignore */ }
  function addHome() {
    var top = document.querySelector('.top-in');
    if (!top || document.querySelector('.kit-home')) return;
    var a = document.createElement('a');
    a.href = './';
    a.className = 'kit-home';
    a.textContent = '‹ Kit';
    a.setAttribute('aria-label', 'TOEIC Study Kit のホームに戻る');
    a.style.cssText = 'font:600 13px/1 system-ui,-apple-system,sans-serif;color:inherit;opacity:.7;text-decoration:none;padding:10px 6px 10px 0;white-space:nowrap';
    top.insertBefore(a, top.firstChild);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addHome); else addHome();
})();

</script>
