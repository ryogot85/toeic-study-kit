<title>Elias Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --sunk:#EEEAF6; --line:#E0DAEC;
  --ink:#231F33; --ink-2:#5E5872; --ink-3:#8F89A3;
  --accent:#2E8B62; --accent-ink:#FFFFFF; --accent-soft:#DDF1E6;
  --cheek:#E0528F; --cheek-soft:#FBE3EE;
  --marker:#FFE08A; --good:#2E8B62; --good-soft:#DDF1E6; --bad:#C8414B; --bad-soft:#F9E1E3;
  --f-disp:"Fredoka","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-en:"Literata","Georgia","Times New Roman",serif;
  --f-jp:"M PLUS Rounded 1c","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --read:19px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15131C; --surface:#1D1A27; --sunk:#252134; --line:#342F46;
    --ink:#EDEAF5; --ink-2:#B1ABC4; --ink-3:#7F7996;
    --accent:#62D29E; --accent-ink:#0B2419; --accent-soft:#1B3A2C;
    --cheek:#F27FB0; --cheek-soft:#3B1D2B;
    --marker:rgba(255,214,102,.30); --good:#62D29E; --good-soft:#1B3A2C; --bad:#F2808A; --bad-soft:#3C1C22;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15131C; --surface:#1D1A27; --sunk:#252134; --line:#342F46;
  --ink:#EDEAF5; --ink-2:#B1ABC4; --ink-3:#7F7996;
  --accent:#62D29E; --accent-ink:#0B2419; --accent-soft:#1B3A2C;
  --cheek:#F27FB0; --cheek-soft:#3B1D2B;
  --marker:rgba(255,214,102,.30); --good:#62D29E; --good-soft:#1B3A2C; --bad:#F2808A; --bad-soft:#3C1C22;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.disp{font-family:var(--f-disp)}
.en{font-family:var(--f-en)}
.note{font-size:13px;color:var(--ink-2);line-height:1.65}
.eyebrow{font-family:var(--f-disp);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* frame */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:19px;letter-spacing:.01em}
.leaf{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:var(--accent);transform:rotate(-45deg);display:inline-block;position:relative}
.leaf::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--cheek);opacity:.75}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:15px 10px 13px;color:var(--ink-2);border-bottom:2px solid transparent;font-size:14px}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:22px 90px}
.banner{max-width:980px;margin:10px auto 0;padding-inline:16px}
.banner p{background:var(--cheek-soft);border-radius:10px;padding:8px 12px;font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-family:var(--f-disp);font-weight:600;font-size:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:42px;line-height:1.3}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.cheek{background:var(--cheek-soft);color:var(--cheek);border-color:transparent}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* library */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px 28px;align-items:center}
@media (max-width:720px){.intro{grid-template-columns:1fr}}
.intro h1{font-family:var(--f-disp);font-weight:600;font-size:28px;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--sunk);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-disp);font-weight:600;font-size:24px;line-height:1.2}
.kpi span{font-size:12px;color:var(--ink-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.story{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;width:100%}
.story:hover{border-color:var(--ink-3)}
.story .no{font-family:var(--f-disp);font-size:12.5px;color:var(--ink-3)}
.story h3{font-family:var(--f-disp);font-weight:600;font-size:19px}
.story .jt{font-size:13px;color:var(--ink-2)}
.story .meta{display:flex;gap:6px;flex-wrap:wrap}
.story .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.done{color:var(--good);font-weight:700}
.season{display:flex;flex-direction:column;gap:12px}
.season-h{display:flex;flex-direction:column;gap:4px}
.season-h h2{font-family:var(--f-disp);font-weight:600;font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* reader */
.rhead{display:flex;flex-direction:column;gap:6px}
.rhead h1{font-family:var(--f-disp);font-weight:600;font-size:30px;line-height:1.2}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.timer{font-family:var(--f-disp);font-weight:600;font-size:18px;min-width:64px;text-align:center}
.text{max-width:70ch;margin:0 auto}
.para{position:relative;padding:6px 0}
.para p.en{font-size:var(--read);line-height:1.85}
.para .tr{font-size:14.5px;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:8px 12px;margin:6px 0 4px}
.para .pbtn{position:absolute;left:-44px;top:10px;display:flex;flex-direction:column;gap:4px}
@media (max-width:1060px){.para .pbtn{position:static;flex-direction:row;margin-top:4px}}
.pbtn button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:11.5px;padding:1px 7px;color:var(--ink-3);min-width:32px;min-height:26px}
.pbtn button:hover{color:var(--ink);border-color:var(--ink-3)}
.th{font-style:italic;color:var(--ink-2)}
.vw{font:inherit;color:inherit;background:linear-gradient(transparent 58%,var(--marker) 58%);border:0;padding:0 1px;border-radius:2px;cursor:pointer}
.hide-vocab .vw{background:none;cursor:text}
.reading .vw{background:none}
.now p.en{background:var(--accent-soft);border-radius:6px}
.pop{position:fixed;z-index:40;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop b{font-family:var(--f-en);font-size:17px}
.pop .badge{display:inline-block;margin-left:6px;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.result{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.wpm{font-family:var(--f-disp);font-weight:600;font-size:52px;line-height:1}
.wpm small{font-size:16px;color:var(--ink-2);margin-left:4px}
.gauge{height:12px;background:var(--sunk);border-radius:6px;position:relative;overflow:visible;margin-top:8px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.gauge .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--cheek)}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q p.en{font-size:16.5px;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-family:var(--f-en);font-size:15.5px}
.opt:hover{background:var(--sunk)}
.opt .k{flex:none;font-family:var(--f-disp);font-weight:600;color:var(--ink-3);width:18px}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.ex{margin-top:8px;font-size:14px;color:var(--ink-2)}
.vtable{width:100%;border-collapse:collapse;font-size:14px}
.vtable td{padding:7px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.vtable td:first-child{font-family:var(--f-en);font-weight:600;white-space:nowrap}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.notes{display:flex;flex-direction:column;gap:14px}
.notes .n{border-left:3px solid var(--cheek);padding:1px 0 1px 13px}
.notes .n h3{font-size:15px;font-weight:700;margin-bottom:3px}
.notes .n p{font-size:14px;color:var(--ink-2);line-height:1.8}

/* compose */
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button.chip{font-size:13px;padding:4px 11px}
.gen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 10px;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* stats */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-disp);font-size:11px;fill:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px)}
.empty{padding:26px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink-2)}
.field select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="leaf" aria-hidden="true"></span><b>Elias Reading Room</b></div>
    <nav class="tabs" id="tabs" aria-label="メイン">
      <button data-view="shelf">本棚</button>
      <button data-view="write">新しいお話</button>
      <button data-view="stats">記録</button>
    </nav>
  </div>
</header>
<div class="banner" id="banner" hidden><p id="bannerText"></p></div>
<main id="view"><div class="empty"><span class="spin"></span> 読み込み中…</div></main>
<div id="popHost"></div>
<div class="toast" id="toast" hidden></div>
<script>
/* Elias Reading Room — original fan-made short stories (unofficial). Stories 1–2. */
window.STORIES = window.STORIES || [];
STORIES.push({
  id: 'overdue-tab', no: 1,
  title: 'The Overdue Tab', ja: '女王陛下のツケ',
  cast: ['Ashur', 'Erpin', 'Ner', 'Master'], place: "Erpien · Ashur's Bakery",
  paras: [
    [`The bell above the door of Ashur's Bakery rang, and the Master stepped inside. Erpin followed close behind and immediately pressed her face against the display case.`,
     `「エシュールのパン屋」のドアの上でベルが鳴り、教主が店に入った。すぐ後ろについてきたエルフィンは、さっそくショーケースに顔を押しつけている。`],
    [`"It's a magic school," said a voice from behind the counter. Ashur appeared, holding a rolling pin like a wand. "Not a bakery. Please remember that."`,
     `「魔法学校よ」とカウンターの奥から声がした。麺棒を杖のように構えたエシュールが現れる。「パン屋じゃないの。覚えておいて」`],
    [`"Good morning, Ashur," the Master said. "Erpin says you wanted to see us."`,
     `「おはよう、エシュール」と教主は言った。「用があるってエルフィンから聞いたけど」`],
    [`"I did." Ashur placed a sheet of paper on the counter. It unrolled, and kept unrolling, until it reached the floor. "This is an invoice. For Her Majesty's tab."`,
     `「ええ」エシュールがカウンターに紙を置くと、それはくるくると広がり、さらに広がって、床まで届いた。「これは請求書。女王陛下のツケのね」`],
    [`Erpin blinked. "A what?"`,
     `エルフィンはまばたきした。「せーきゅーしょ？」`],
    [`"An invoice. A list of everything you ate without paying." Ashur pointed at the first line. "Thirty-seven strawberry cakes. Twelve cream puffs. One cake shaped like Yggdrasil, which was for display only."`,
     `「請求書。あなたがお金を払わずに食べたものの一覧よ」エシュールは一行目を指さした。「いちごケーキ37個。シュークリーム12個。それから世界樹の形のケーキ1個。あれは展示用だったのに」`],
    [`"It looked lonely," Erpin said.`,
     `「さみしそうだったんだもん」とエルフィン。`],
    [`"The balance is now three months overdue," Ashur went on, ignoring her. "My flour supplier wants her money by Friday. She doesn't accept excuses. Or cake."`,
     `「残高はもう3か月も支払期限を過ぎてるの」エシュールは彼女を無視して続けた。「小麦粉の仕入れ先には金曜までに払わなきゃいけないのよ。言い訳は通用しない。ケーキもね」`],
    [`(So that's why she called us,) the Master thought, and turned to Erpin. "Can you afford to pay this?"`,
     `（それで呼ばれたのか）と教主は思い、エルフィンのほうを向いた。「これ、払える余裕はある？」`],
    [`Erpin puffed out her cheeks. "I'm the Queen! The Guardian of Elias! Queens don't pay for cake. Cake is a gift from the people."`,
     `エルフィンはほっぺをふくらませた。「わたしは女王なのよ！ エーリアスの守護者！ 女王はケーキにお金なんて払わないの。ケーキは国民からの贈り物なんだから」`],
    [`"The people," Ashur said through her teeth, "would like to be paid."`,
     `「その国民は」エシュールは歯を食いしばって言った。「お金を払ってほしいそうよ」`],
    [`The bell rang again. Ner walked in, calm and serious as always. "I heard there was a financial problem," she said. "As High Priestess, I will review the document."`,
     `またベルが鳴った。いつものように落ち着いた真面目な顔でネルが入ってくる。「お金の問題が起きていると聞きました」と彼女は言った。「司祭長として、その書類を確認します」`],
    [`She read the invoice slowly, line by line, the way she read everything that involved the Order's money. Then she stopped. "Ashur. What is this item near the end? 'Magic lesson for the Queen, one hour.'"`,
     `ネルは、教団のお金が絡むものを読むときと同じように、一行ずつゆっくりと請求書を読んだ。そして手を止めた。「エシュール。最後のほうのこの項目は何ですか？『女王への魔法の授業、1時間』」`],
    [`Ashur coughed. "She stood in my classroom for an hour."`,
     `エシュールは咳払いした。「1時間、教室に立ってたのよ」`],
    [`"She was waiting for the cakes to come out of the oven," Ner said. "I will remove that line. I would also like to request a discount, since the Queen is your most loyal customer."`,
     `「ケーキがオーブンから出てくるのを待っていただけです」とネル。「この行は削除します。それと、女王はあなたの一番のお得意様ですから、割引をお願いしたいですね」`],
    [`"She's my most EXPENSIVE customer!"`,
     `「一番お金のかかる客よ！」`],
    [`The Master raised a hand before the argument could grow. "I have an idea. Erpin works here this weekend, and every hour she works reduces the balance. Ashur gets help, and the tab gets smaller."`,
     `言い争いが大きくなる前に、教主は手を挙げた。「提案がある。今週末はエルフィンがここで働いて、1時間ごとに残高を減らすのはどう？ エシュールは人手が増えるし、ツケも減る」`],
    [`Ashur narrowed her eyes. Ner nodded once. Erpin looked at the cakes, then at the Master, and smiled far too brightly. "Deal!"`,
     `エシュールは目を細めた。ネルは一度うなずいた。エルフィンはケーキを見て、それから教主を見て、明るすぎる笑顔を浮かべた。「のった！」`],
    [`On Saturday, Erpin wore an apron and stood behind the counter. By noon the shop had sold out, and Ashur was almost smiling. Then she checked the inventory.`,
     `土曜日、エルフィンはエプロンをつけてカウンターに立った。昼には店の品物が売り切れ、エシュールはほとんど笑顔だった。そして在庫を確認した。`],
    [`"Forty cookies are missing," she said.`,
     `「クッキーが40枚足りない」と彼女は言った。`],
    [`Erpin's cheeks were suspiciously round. "Quality control," she mumbled.`,
     `エルフィンのほっぺは怪しいほど丸かった。「ひんしつかんり」と彼女はもごもご言った。`],
    [`The Master gently pulled one of those round cheeks, and a cookie crumb fell out. Ashur picked up her pen and added a new line to the invoice.`,
     `教主がその丸いほっぺをそっと引っぱると、クッキーのかけらがぽろりと落ちた。エシュールはペンを取り、請求書に新しい行を書き足した。`],
    [`That night, the Master opened the diary that Ner checked every morning and wrote three sentences: "Erpin worked at a magic school today. Her tab went down by two hours and up by forty cookies. I think Ashur needs a longer roll of paper."`,
     `その夜、教主はネルが毎朝チェックする日記を開き、3つの文を書いた。「今日、エルフィンは魔法学校で働いた。ツケは2時間分減って、クッキー40枚分増えた。エシュールにはもっと長い紙が必要だと思う」`]
  ],
  vocab: [
    ['invoice', '請求書', 'invoice|invoices'], ['balance', '残高', 'balance'], ['overdue', '支払期限を過ぎた', 'overdue'],
    ['supplier', '仕入れ先', 'supplier'], ['afford', '〜する余裕がある', 'afford'], ['financial', '金銭の、財務の', 'financial'],
    ['review', '確認する、見直す', 'review'], ['discount', '割引', 'discount'], ['loyal', '常連の、忠実な', 'loyal'],
    ['reduce', '減らす', 'reduces|reduce'], ['sold out', '売り切れた', 'sold out'], ['inventory', '在庫', 'inventory']
  ],
  qs: [

STORIES.push({

     `午後1時58分、教主のスマホに通知が届いた。「お荷物は配達中です！ 到着予定：午後3時 ― シュパン急便」`],
    [`"Did someone order something?" the Master asked.`,

     `教団本部の机で書類を整理していたネルは、顔も上げずに答えた。「私です。3時の大事な会議のための備品です。荷物が無事に届くよう見ていてください」`],

    [`At 2:31, the tracking page updated: "Package has left Erpien. Current speed: very fast."`,

     `2時52分、土煙が門の前で止まり、シュパンが得意げな笑顔で「シュパボルト」から飛び降りた。「シュパン急便です！ 8分早く到着！ 受取人さんはいますか？ サインをお願いします」`],
    [`Before the Master could answer, a familiar figure hurried across the courtyard. Neat robe. Serious face. "I'm Ner, the priestess of Yggdrasil," she announced. "I will sign for it."`,
     `教主が答える前に、見慣れた姿が中庭を急いでやって来た。きちんとした法衣。真面目な顔。「私はネル、世界樹の司祭です」と彼女は名乗った。「私がサインします」`],
    [`Shoupan handed over her pen without a second look. To her, and to everyone else in the courtyard, it was Ner.`,
     `シュパンは確かめもせずにペンを渡した。彼女にとっても、中庭にいた他の誰にとっても、それはネルだった。`],
    [`But the Master knew better. Only a few people could see through that kind of disguise, and the Master was one of them. This "Ner" had a small pumpkin leaf stuck in her hair.`,
     `だが教主にはわかっていた。あの手の変装を見破れる者はほんのわずかで、教主はその一人なのだ。この「ネル」の髪には、小さなかぼちゃの葉がくっついていた。`],

    [`"Delivery confirmed!" Shoupan shouted happily after her. "Please rate us five stars!"`,
     `「配達完了です！」シュパンがうれしそうにその背中へ叫んだ。「星5つの評価をお願いします！」`],
    [`The Master followed the footprints to Speaki's pumpkin patch, where the box was already open. Several pumpkins had been arranged in a circle around it, like guests at a party.`,
     `教主が足跡をたどってスピッキーのかぼちゃ畑へ行くと、箱はもう開けられていた。そのまわりには、パーティーの客のようにいくつものかぼちゃが輪になって並べられている。`],
    [`"Speaki just wanted to share," Speaki sniffed, back in her own form. "The pumpkins never get any dessert."`,
     `「スピッキーは、分けてあげたかっただけです」元の姿に戻ったスピッキーが鼻をすすった。「かぼちゃたちは、いつもデザートをもらえないんです」`],
    [`The Master looked inside the box. The melon bocconcini tower was no longer a tower. It was a flat, sticky circle. Shoupan's deliveries were always on time. The condition of the contents was a different story.`,
     `教主は箱の中をのぞいた。メロン・ボッコンチーニのタワーは、もはやタワーではなかった。平たくてべたべたした円盤だ。シュパンの配達はいつも時間どおり。中身の状態はまた別の話だった。`],
    [`Footsteps crunched behind them. The real Ner stood there, as calm as ever, but her left eye was twitching.`,

     `「スピッキー」と彼女は言った。「正座。両手を上げなさい」`],

    [`Ner picked up the box and studied the ruined dessert for a long moment. Then she turned to the Master. "The meeting," she said, "has been postponed."`,
     `ネルは箱を持ち上げ、つぶれたデザートを長いあいだ見つめた。それから教主のほうを向いた。「会議は」と彼女は言った。「延期になりました」`],
    [`"Was anyone else invited?" the Master asked.`,
     `「他に誰か招待してたの？」と教主はたずねた。`],
    [`Ner took a spoon from her sleeve. "Please don't ask questions you already know the answer to, Master."`,
     `ネルは袖からスプーンを取り出した。「答えがわかっている質問はしないでください、教主様」`],
    [`That evening, the Master left a review on the delivery page: "Arrived early. Contents flattened. The customer ate them anyway."`,
     `その晩、教主は配達ページにレビューを書いた。「予定より早く到着。中身はぺしゃんこ。それでもお客さんは完食しました」`]

STORIES.push({
  id: 'forty-three-books', no: 3,
  title: 'Forty-Three Overdue Books', ja: '返却期限切れの43冊',
  cast: ['Kommy', 'Barie', 'Master'], place: 'Werebeast Village → Belitein Public Library',
  paras: [
    [`The letter arrived on black paper with silver ink. The Master read it aloud: "Final notice. Library member Kommy has forty-three overdue books. Please return them to the Public Library of Belitein within three days, or..." The rest of the letter was a drawing of a very angry witch.`,
     `手紙は黒い紙に銀色のインクで書かれていた。教主は声に出して読んだ。「最終通知。図書館利用者コミーは、43冊の本を返却期限切れのまま借りています。3日以内にベリタイン（魔女の王国）公立図書館へ返却してください。さもないと……」手紙の残りは、ものすごく怒った魔女の絵だった。`],
    [`Kommy was lying on a pile of cushions in her room in the Werebeast Village, with an open book over her face. "Kommy is not home," said the book.`,
     `コミーは獣人の村にある自分の部屋で、クッションの山の上に寝そべり、開いた本を顔にのせていた。「コミーは留守です」と本が言った。`],
    [`The Master looked around. There were books on the shelves, books on the floor, and books holding up a table with one short leg.`,
     `教主は部屋を見回した。本棚に本、床にも本、脚が1本短いテーブルを支えているのも本だった。`],
    [`"The deadline was last month," the Master said.`,
     `「返却期限は先月だったよ」と教主は言った。`],
    [`"Deadlines are just numbers," Kommy said. "Kommy read that somewhere."`,
     `「締め切りなんてただの数字です」とコミーは言った。「どこかの本で読みました」`],
    [`"Barie doesn't think so."`,
     `「バリエはそう思ってないみたいだけど」`],
    [`That got her attention. Kommy slowly lifted the book from her face. Everyone in Elias knew about Barie, the witch intern who managed the library. She was quiet and polite, and absolutely terrifying whenever a book was damaged.`,
     `それでようやくコミーの気を引いた。彼女はゆっくりと顔から本をどけた。エーリアスで、図書館を管理する見習い魔女バリエのことを知らない者はいない。静かで礼儀正しく、そして本が傷んでいたときには本当に恐ろしいのだ。`],
    [`Moving forty-three books to the Witch Kingdom took two backpacks, one wheelbarrow, and a great deal of complaining. Belitein lay deep underground, and the library stood at the end of a long, dim street lined with lanterns. Inside, it was so quiet that the Master could almost hear the pages breathing.`,
     `43冊の本を魔女の王国まで運ぶには、リュック2つと手押し車1台、そして山ほどの文句が必要だった。ベリタインは地下深くにあり、図書館はランタンが並ぶ長く薄暗い通りの突き当たりに建っている。中はとても静かで、ページの息づかいまで聞こえてきそうだった。`],
    [`Barie looked up from the front desk. "Weeelcome," she whispered, stretching the word like warm taffy. "Are you... returning... something?"`,
     `受付カウンターのバリエが顔を上げた。「いらっしゃいませぇぇ」と、温かいタフィーを引き伸ばすように言葉を伸ばしてささやく。「返却……ですか……？」`],
    [`"Forty-three books," the Master said. "We're sorry they're late."`,
     `「43冊です」と教主は言った。「遅くなってすみません」`],
    [`Barie checked each book carefully. She opened the covers, examined the spines, and counted the pages. The Master held their breath at book number thirty-one, which had a small tea stain on the back.`,
     `バリエは1冊ずつ丁寧に確認した。表紙を開き、背を調べ、ページを数える。31冊目で教主は息をのんだ。裏表紙に小さな紅茶のしみがあったのだ。`],
    [`"This... stain," Barie said softly. "Explaaain... please."`,
     `「この……しみは」とバリエは静かに言った。「説明……してくださぁい」`],
    [`"Kommy was reading about an ancient kingdom," Kommy said. "The kingdom fell. Kommy was shocked. The tea was also shocked."`,
     `「コミーは古代の王国の本を読んでいました」とコミーは言った。「王国が滅びました。コミーはびっくりしました。紅茶もびっくりしました」`],
    [`For a long moment, Barie said nothing. Then she glanced at the title, and her expression changed. "You... finished this?"`,
     `しばらくのあいだ、バリエは何も言わなかった。それから題名に目をやり、表情が変わった。「これを……読み終えたんですか？」`],
    [`"Twice," Kommy said. "The footnotes are the best part."`,
     `「2回です」とコミー。「脚注がいちばん面白いです」`],
    [`Barie's eyes lit up. Very few borrowers ever read the footnotes. "Library policy... allows members to renew books... in good condition," she said. "And members who truly read... may reserve new arrivals... before anyone else."`,
     `バリエの目が輝いた。脚注まで読む利用者などめったにいないのだ。「図書館の規則では……状態のよい本は……貸出を延長できます」と彼女は言った。「そして、本当に本を読む利用者は……新着の本を……誰よりも先に予約できます」`],
    [`Kommy's ears stood straight up. "New arrivals?"`,
     `コミーの耳がぴんと立った。「新着？」`],
    [`Barie led them to a shelf marked COMING SOON. Kommy stared at it the way Erpin stared at cake.`,
     `バリエは「近日入荷」と書かれた棚へ二人を案内した。コミーは、エルフィンがケーキを見つめるときのようにその棚を見つめた。`],
    [`In the end, they left with a warning about the tea, a small cleaning fee, and eleven new books. The Master carried all of them.`,
     `結局、二人は紅茶についての注意と、少額のクリーニング代と、新しい本11冊を持って図書館を出た。本は全部、教主が運んだ。`],
    [`On the way back to the surface, Kommy fell asleep in the wheelbarrow with one hand resting on the top book.`,
     `地上へ戻る途中、コミーは積んだ本のいちばん上に片手をのせたまま、手押し車の中で眠ってしまった。`],
    [`(Forty-three books returned. Eleven borrowed,) the Master thought, pushing the wheelbarrow up the long slope. (Next time, I'm setting a reminder.)`,
     `（43冊返却。11冊貸出）長い坂道で手押し車を押しながら、教主は思った。（次からはリマインダーを設定しよう）`]
  ],
  vocab: [
    ['notice', '通知', 'notice'], ['overdue', '期限を過ぎた', 'overdue'], ['deadline', '期限、締め切り', 'deadline|deadlines'],
    ['intern', '見習い、実習生', 'intern'], ['damaged', '損傷した', 'damaged'], ['examine', '調べる', 'examined'],

    ['reserve', '予約する', 'reserve'], ['arrival', '新着品、到着', 'arrivals'], ['fee', '料金', 'fee'], ['reminder', 'リマインダー、通知', 'reminder']
  ],
  qs: [
    { q: 'What was the purpose of the letter?', c: ['To invite Kommy to a reading event', 'To ask Kommy to return late books', 'To announce new library hours', 'To offer Kommy a job at the library'], a: 1,
      ex: 'Final notice ... forty-three overdue books. Please return them ... が根拠。返却期限切れの本の返却を求める通知です。' },
    { q: 'Why did Barie’s attitude toward Kommy change?', c: ['Kommy paid a large fee.', 'The Master apologized twice.', 'She learned that Kommy had read the book carefully.', 'The tea stain was easy to remove.'], a: 2,
      ex: '題名を見て You... finished this? と驚き、脚注まで読んだと知って目を輝かせています。' },
    { q: 'What is NOT mentioned as a result of the visit?', c: ['Kommy received a warning.', 'Kommy paid a cleaning fee.', 'Kommy borrowed new books.', 'Kommy got a new library card.'], a: 3,
      ex: '注意（warning）、クリーニング代（cleaning fee）、新しい本11冊は本文にあります。新しい利用者カードの話はありません。' }
  ]
});

STORIES.push({
  id: 'night-shift', no: 4,
  title: 'Help Wanted: Night Shift', ja: '夜勤スタッフ募集中',
  cast: ['Levi', 'Goldy', 'Xion', 'Master'], place: 'Monatium · Monatium 25',
  paras: [
    [`"Yes, hello?? Is there a reason you called?"`,
     `「はい、もしもし？？ ご用件は何でしょうか？」`],
    [`Levi answered before the first ring had even finished. The Master had learned to call her only in emergencies, because Levi treated every call as a possible job offer.`,
     `レヴィは1回目の呼び出し音が鳴り終わる前に電話に出た。教主は緊急時にしか彼女に電話しないようにしていた。レヴィはどんな電話も仕事の依頼かもしれないと思って出るからだ。`],
    [`"It's me," the Master said. "You wanted me to be your reference?"`,
     `「私だよ」と教主は言った。「推薦人になってほしいんだって？」`],
    [`"Yes! Monatium 25 is hiring for the night shift!" Levi's voice was bright and very, very tired. "It'll be my ninth part-time job, but it's the first one with a chair."`,
     `「はい！ モナティウム25が夜勤の人を募集してるんです！」レヴィの声は明るく、そしてものすごく疲れていた。「9つ目のアルバイトになりますけど、椅子があるのは初めてなんです」`],
    [`The interview took place in the back room of the convenience store, between boxes of instant noodles and a refrigerator that hummed like a sleepy dragon. Goldy, the store manager, sat behind a small desk with a clipboard. Xion, the senior part-timer, leaned against the wall with her arms folded and her eyes half closed, as if she could see things no one else could.`,
     `面接はコンビニの奥の部屋で、カップ麺の箱と、眠そうなドラゴンのようにうなる冷蔵庫のあいだで行われた。店長のゴールディは、クリップボードを手に小さな机の向こうに座っている。先輩アルバイトのシオンは腕を組んで壁にもたれ、他の誰にも見えないものが見えているかのように目を半分閉じていた。`],
    [`"So," Goldy said with a professional smile, "tell me about your experience, customer— I mean, applicant."`,
     `「では」ゴールディは営業用の笑顔で言った。「これまでのご経験を教えてください、お客様――いえ、応募者様」`],
    [`Levi handed over her résumé. It was twelve pages long and written in very small letters. Delivery assistant. Bakery helper. Library shelf organizer. Potion tester for a certain shop, weekends only.`,
     `レヴィは履歴書を差し出した。12ページもあり、とても小さな字でびっしり書かれている。配達アシスタント。パン屋の手伝い。図書館の本棚整理。とある店の薬の試飲係（週末のみ）。`],
    [`"Impressive," Goldy said, flipping through the pages. "Very flexible. How many hours do you sleep?"`,
     `「すばらしいですね」ゴールディはページをめくりながら言った。「とても融通がききそう。睡眠は何時間ですか？」`],
    [`"On average?" Levi counted on her fingers and stopped at two.`,
     `「平均でですか？」レヴィは指を折って数え、2本目で止めた。`],
    [`Goldy turned to the Master. "And you're the reference. Is she reliable?"`,
     `ゴールディは教主のほうを向いた。「そしてあなたが推薦人ですね。彼女は信頼できますか？」`],
    [`(She once worked three jobs in one day and still returned a library book on time.) "She's the hardest-working person I know," the Master said. "Maybe too hard-working."`,
     `（一日に3つの仕事をこなして、それでも図書館の本を期限内に返したことがある）「私が知る中で一番の働き者です」と教主は言った。「働きすぎなくらいに」`],
    [`Xion finally opened her eyes. "The night shift is no ordinary battlefield," she said in a low voice. "When the moon rises, the customers of darkness arrive. Are you prepared to face them?"`,
     `シオンがようやく目を開けた。「夜勤はただの戦場ではない」と彼女は低い声で言った。「月が昇るとき、闇の客たちがやって来る。お前にそれと向き合う覚悟はあるか？」`],
    [`"The customers of darkness?" Levi asked.`,
     `「闇の客……ですか？」とレヴィ。`],
    [`"Elves who forgot to buy milk," Goldy explained.`,
     `「牛乳を買い忘れたエルフたちのことです」とゴールディが説明した。`],
    [`Levi took a small purple bottle from her pocket. It was an invigoration potion from Posher's shop, and she drank it in one gulp. Her eyes opened wide. Her hair stood up slightly. "I am prepared," she said, and her voice echoed a little.`,
     `レヴィはポケットから小さな紫色の瓶を取り出した。ポーシャーの店の元気が出る薬で、彼女はそれを一気に飲み干した。目が大きく見開かれ、髪が少し逆立つ。「覚悟はできています」と言った彼女の声は、少しエコーがかかっていた。`],
    [`"...Does that potion have side effects?" the Master asked.`,
     `「……その薬、副作用はあるの？」と教主はたずねた。`],
    [`"Only a few," Levi said. "For the next hour, I can hear colors."`,
     `「ちょっとだけです」とレヴィ。「これから1時間、色が聞こえるようになります」`],
    [`Goldy wrote something on her clipboard and nodded. "You're hired. Your first shift starts tonight at ten. Overtime is paid in cash. Please don't listen to the colors while you're using the register."`,
     `ゴールディはクリップボードに何か書き込んでうなずいた。「採用です。初回の勤務は今夜10時から。残業代は現金で支払います。レジを打っているあいだは、色の声を聞かないでくださいね」`],
    [`Outside the store, Levi bowed so deeply that she almost fell over. "Thank you for the recommendation, Master!"`,
     `店の外で、レヴィは転びそうになるほど深くお辞儀をした。「推薦してくださってありがとうございます、教主様！」`],
    [`"Promise me one thing," the Master said. "Take one day off this week."`,
     `「ひとつだけ約束して」と教主は言った。「今週は1日休むこと」`],
    [`Levi thought about it very seriously. Then her phone rang. "Yes, hello?? Is there a reason you called?"`,
     `レヴィはとても真剣に考えた。そのとき、電話が鳴った。「はい、もしもし？？ ご用件は何でしょうか？」`],
    [`The Master sighed and went back inside to buy her a sandwich for later.`,
     `教主はため息をつき、あとで食べる用のサンドイッチを買いに店の中へ戻った。`]
  ],

<script>

STORIES.push({
  id: 'comedy-hour', no: 5,
  title: "Rim's Comedy Hour", ja: 'リムのお笑いアワー',
  cast: ['Rim', 'Renewa', 'Erpin', 'Canna', 'Selene', 'Master'], place: 'Sprite Kingdom · Elias Theater',
  paras: [
    [`Posters were taped to every lamppost in the Sprite Kingdom: ONE NIGHT ONLY! RIM'S COMEDY HOUR! ELIAS THEATER, SMALL HALL. ADMISSION FREE. PUMPKIN SOUP INCLUDED.`,
     `妖精王国じゅうの街灯にポスターが貼られていた。「一夜かぎり！ リムのお笑いアワー！ エーリアス劇場・小ホール。入場無料。かぼちゃスープつき」`],
    [`"Free admission," Erpin read with suspicion. "And free soup. That's a trap."`,
     `「入場無料」エルフィンが疑わしそうに読み上げた。「スープも無料。これは罠よ」`],
    [`"It's Rim," the Master said. "She just wants people to come."`,
     `「リムだよ」と教主は言った。「ただ人に来てほしいだけだって」`],
    [`Rim, the phantom of balance, lived alone in a tall tower, and most phantoms kept their distance from her. It wasn't because she was dangerous. It was because of the puns. She couldn't stop making them, and she knew it.`,
     `均衡の幽霊リムは高い塔にひとりで住んでいて、ほとんどの幽霊は彼女と距離を置いていた。危険だからではない。ダジャレのせいだ。彼女はダジャレをやめられず、自分でもそれをわかっていた。`],
    [`At the theater, Renewa sat in the ticket booth with a stack of reservation cards. "Good evening! You're our first guests," she said. "Actually, you're the only guests who reserved seats. The hall has a capacity of eighty."`,
     `劇場では、リニュアがチケット売り場で予約カードの束を前に座っていた。「こんばんは！ 最初のお客様です」と彼女は言った。「というか、席を予約したお客様はみなさんだけなんです。ホールの定員は80人なんですけど」`],
    [`"How many reservations are there?" the Master asked.`,
     `「予約は何件あるの？」と教主はたずねた。`],
    [`Renewa checked her list. "Three. You, Her Majesty, and Canna."`,
     `リニュアはリストを確認した。「3件です。教主様と、女王陛下と、カンナさん」`],
    [`Canna was already sitting in the front row with her arms crossed. "I'm here to provide security," she said. "If the jokes become dangerous, I'll take appropriate action."`,
     `カンナはもう最前列で腕を組んで座っていた。「警備のために来た」と彼女は言った。「ジョークが危険な域に達したら、適切な措置を取る」`],
    [`"What kind of action?"`,
     `「どんな措置？」`],
    [`"The kind that goes boom."`,
     `「ドカンといくやつだ」`],
    [`The lights dimmed. Rim floated onto the stage with her scythe, G, which seemed to lean away from her in advance.`,
     `照明が落ちた。リムが大鎌のGを持ってふわりと舞台に現れる。Gは早くも彼女から身を引いているように見えた。`],
    [`"Good evening, everyone," Rim said. "Tonight I'll be telling jokes about phantoms. I hope you find them... boo-tiful."`,
     `「みなさん、こんばんは」とリムは言った。「今夜は幽霊にまつわるジョークをお届けします。きっと……ブーティフル（boo＋beautiful）だと思ってもらえるはず」`],
    [`Silence. Somewhere in the back, a cricket stopped chirping out of respect.`,
     `沈黙。後ろのどこかで、コオロギまでが遠慮して鳴くのをやめた。`],
    [`"Why did the phantom skip the party? Because she had no body to go with." Rim's voice grew smaller. "And what do phantoms drink at the theater? Boo-ze... but only with a valid ID."`,
     `「幽霊がパーティーに行かなかったのはなぜでしょう？ 一緒に行く体がなかったから（no body＝nobody）」リムの声が小さくなっていく。「では、幽霊が劇場で飲むものは？ ブーズ（boo＋booze＝お酒）……ただし有効な身分証をお持ちの方のみ」`],
    [`Erpin made a sound like a balloon losing air. Canna reached slowly for her belt.`,
     `エルフィンは空気の抜ける風船のような声を出した。カンナはゆっくりとベルトに手を伸ばした。`],
    [`Then a quiet click came from the side of the stage. Selene, the phantom of provocation, was taking photos of Canna's furious face. "Priceless," she whispered. "Absolutely priceless."`,
     `そのとき、舞台袖から小さなシャッター音がした。挑発の幽霊セリーネが、カンナの怒り顔を写真に撮っていたのだ。「最高」と彼女はささやいた。「最高の表情ね」`],
    [`Canna jumped up. Selene ran. Erpin laughed so hard that she fell out of her seat, and the Master, who had been holding it in for ten minutes, finally laughed too.`,
     `カンナが飛び上がった。セリーネが逃げ出した。エルフィンは笑いすぎて椅子から転げ落ち、10分間こらえていた教主もついに吹き出した。`],
    [`Rim looked at them in surprise. She wasn't sure whether they were laughing at her jokes, at Canna, or at Erpin rolling on the floor. But for the first time in a long time, the room was full of laughter, and she was standing right in the middle of it.`,
     `リムは驚いてみんなを見つめた。自分のジョークに笑っているのか、カンナに笑っているのか、床を転げ回るエルフィンに笑っているのか、よくわからない。それでも久しぶりに部屋は笑い声でいっぱいで、彼女はそのまんなかに立っていた。`],
    [`After the show, Renewa handed out survey forms. Most of them came back with the same feedback: Too many puns. Please make fewer.`,
     `公演のあと、リニュアはアンケート用紙を配った。返ってきた用紙のほとんどに、同じ感想が書かれていた。「ダジャレが多すぎます。減らしてください」`],
    [`Rim read them one by one, very seriously. Then she folded the stack neatly and looked up at the Master with the smallest smile.`,
     `リムはそれを1枚ずつ、とても真剣に読んだ。そして束をきちんと折りたたみ、ほんの小さな笑みを浮かべて教主を見上げた。`],
    [`"I think they want two many puns," she said.`,
     `「みんな、ダジャレは『2つ多め（too many→two many）』がいいみたいね」と彼女は言った。`],
    [`G, the scythe, tried to hide behind the curtain.`,
     `大鎌のGは、カーテンの陰に隠れようとした。`]
  ],
  vocab: [
    ['admission', '入場（料）', 'admission|ADMISSION'], ['include', '含む', 'included|INCLUDED'], ['reservation', '予約', 'reservation|reservations'],
    ['reserve', '予約する', 'reserved'], ['capacity', '定員、収容能力', 'capacity'], ['provide', '提供する', 'provide'],
    ['security', '警備', 'security'], ['appropriate', '適切な', 'appropriate'], ['valid', '有効な', 'valid'],
    ['furious', '激怒した', 'furious'], ['survey', 'アンケート', 'survey'], ['feedback', '意見、感想', 'feedback']
  ],
  qs: [
    { q: 'How many people had reserved seats for the show?', c: ['Eighty', 'Three', 'None', 'About forty'], a: 1,
      ex: 'How many reservations are there? に Three. You, Her Majesty, and Canna. と答えています。定員（capacity）80と混同しないこと。' },
    { q: 'What finally made the audience laugh?', c: ["Rim's joke about boo-ze", 'The free pumpkin soup', 'Selene photographing Canna and the chaos that followed', 'A cricket on the stage'], a: 2,
      ex: 'セリーネがカンナの怒り顔を撮影 → カンナが追いかけ、エルフィンが転げ落ちて笑いが起きました。' },
    { q: 'What does Rim’s last line suggest?', c: ['She will keep making puns.', 'She is going to quit comedy.', 'She wants a bigger theater.', 'She did not read the surveys.'], a: 0,
      ex: '「too many（多すぎる）」を「two many」とダジャレにしており、懲りずに続けるつもりだとわかります。' }
  ]

STORIES.push({
  id: 'carrot-contract', no: 6,
  title: 'The Carrot That Needed a Contract', ja: '契約が必要なにんじん',
  cast: ['Kyarot', 'Marie', 'Elena', 'Amelia', 'Master'], place: "Kyarot's Garden · around Yggdrasil",
  paras: [
    [`Kyarot's garden surrounded Yggdrasil like a green ocean, and everything in it was enormous. There were cabbages the size of houses and strawberries you could sit on. And this morning, in the middle of it all, there was a carrot so tall that its leaves brushed the clouds.`,
     `キャロットの菜園は緑の海のように世界樹を取り囲み、そこにあるものはどれも巨大だった。家ほどもあるキャベツに、座れるほど大きないちご。そして今朝、そのまんなかに、葉が雲に届くほど背の高いにんじんが生えていた。`],
    [`"Isn't she beautiful?" Kyarot said, patting the orange trunk. "I grew her by hand. No magic shortcuts. Just love, water, and lots of encouraging shouts."`,
     `「きれいでしょう？」キャロットはオレンジ色の幹をなでながら言った。「手作業で育てたの。魔法の近道はなし。愛情と、水と、たくさんの応援の声だけ」`],
    [`"It's amazing," the Master said, looking up until their neck hurt. "How are we going to get it out of the ground?"`,
     `「すごいね」教主は首が痛くなるまで見上げた。「これ、どうやって地面から抜くの？」`],
    [`"That's the problem," Kyarot admitted. "She's a little stuck."`,
     `「そこが問題なの」とキャロットは認めた。「ちょっと引っかかっちゃってて」`],
    [`Marie arrived first, carrying a bag that ticked. "Easy," she said. "We blow up the soil around it."`,
     `最初にやって来たのは、チクタク音のする袋を抱えたマリーだった。「簡単よ」と彼女は言った。「まわりの土を吹き飛ばせばいいの」`],
    [`"No explosives in my garden!" Kyarot hugged the carrot protectively.`,
     `「私の菜園で爆発物は禁止！」キャロットはにんじんをかばうように抱きしめた。`],
    [`The second visitor arrived in a quiet elven vehicle. Elena, mayor of Monatium, stepped out holding a frozen hot Americano, followed by her secretary, Amelia, who carried a thick folder.`,
     `二人目の訪問者は、静かなエルフの乗り物でやって来た。モナティウム市長のエレナが、フローズン・ホット・アメリカーノを手に降りてくる。そのあとに、分厚いファイルを抱えた秘書のアメリアが続いた。`],
    [`"I heard you have a transportation problem," Elena said. "Monatium has the equipment to solve it. Our newest lifting machine can pull up anything and deliver it anywhere in Elias."`,
     `「運搬の問題を抱えていると聞いたわ」とエレナは言った。「モナティウムにはそれを解決する機材がある。最新の吊り上げ機なら、何でも引き抜いて、エーリアスのどこへでも届けられる」`],
    [`"For free?" Kyarot asked hopefully.`,
     `「無料で？」キャロットは期待をこめて聞いた。`],
    [`Elena smiled. "If necessary, a fair contract will be established." Amelia opened the folder. The contract was sixty pages long.`,
     `エレナはほほえんだ。「必要なら、公正な契約を結びましょう」アメリアがファイルを開く。契約書は60ページもあった。`],
    [`The Master read the first page and frowned. "Terms and conditions... The fee is 'thirty percent of the carrot'?"`,
     `教主は1ページ目を読んで顔をしかめた。「契約条件……料金は『にんじんの30パーセント』？」`],
    [`"Standard terms," Amelia said. "The mayor's brain runs on coffee, and her engineers run on carrot cake."`,
     `「標準的な条件です」とアメリア。「市長の頭脳はコーヒーで動き、技術者たちはキャロットケーキで動きますので」`],
    [`Kyarot looked at the Master with teary eyes. (All right. Time to negotiate.)`,
     `キャロットが涙目で教主を見た。（よし。交渉の時間だ）`],
    [`"Here's a better deal," the Master said. "Ten percent of the carrot, and you use this job as a demonstration. Everyone in Elias will watch your machine lift the largest vegetable in history. That's free advertising."`,
     `「もっといい条件がある」と教主は言った。「にんじんの10パーセント。それに、この仕事を実演として使えばいい。エーリアス中が、史上最大の野菜を持ち上げるあなたの機械を見ることになる。無料の宣伝だよ」`],
    [`Elena considered this, took a slow sip of coffee, and nodded. "Fifteen percent, and Kyarot appears in our promotional video."`,
     `エレナは考え、ゆっくりとコーヒーをひと口飲んでからうなずいた。「15パーセント。それとキャロットが宣伝動画に出演すること」`],
    [`"Deal!" Kyarot said, before anyone else could speak.`,
     `「のった！」誰かが口を開く前に、キャロットが言った。`],
    [`The machine unfolded with a loud hiss. Its metal arms took hold of the carrot and pulled. The ground shook. Marie cheered. Then, with a sound like the world's biggest cork, the carrot came free and rose into the air.`,
     `機械が大きな音を立てて展開した。金属の腕がにんじんをつかみ、引っぱる。地面が揺れた。マリーが歓声を上げる。そして世界一大きなコルク栓のような音とともに、にんじんが抜けて宙に浮かんだ。`],
    [`It was beautiful for exactly four seconds. Then the machine's arms began to shake.`,
     `その光景が美しかったのは、ちょうど4秒間だった。やがて機械の腕が震え始めた。`],
    [`"Amelia," Elena said calmly, "what is the maximum load?"`,
     `「アメリア」エレナは落ち着いて言った。「最大積載量は？」`],
    [`Amelia checked the specifications. "Not this."`,
     `アメリアは仕様書を確認した。「これではありません」`],
    [`The carrot landed in the middle of the garden with a tremendous thump. Nobody was hurt, although one nearby cabbage was never quite the same again.`,
     `にんじんはものすごい音を立てて菜園のまんなかに落ちた。けが人は出なかったが、近くにあったキャベツが一つ、二度と元の姿には戻らなかった。`],
    [`That evening, the Banquet Hall served carrot soup, carrot bread, carrot cake, and four hundred plates of fried carrots. Ashur arrived with her own fork. Monatium received its fifteen percent, delivered in slices.`,
     `その夜、宴会場ではにんじんスープ、にんじんパン、キャロットケーキ、そして揚げにんじん400皿がふるまわれた。エシュールはマイフォークを持ってやって来た。モナティウムには約束の15パーセントが、輪切りで届けられた。`],
    [`Elena's promotional video was never released. Kyarot, however, framed a photo of herself hugging the carrot and hung it above the garden gate.`,
     `エレナの宣伝動画が公開されることはなかった。けれどキャロットは、にんじんを抱きしめる自分の写真を額に入れ、菜園の門の上に飾った。`]
  ],
  vocab: [
    ['transportation', '運搬、輸送', 'transportation'], ['equipment', '機材、設備', 'equipment'], ['deliver', '届ける', 'deliver|delivered'],
    ['contract', '契約（書）', 'contract'], ['establish', '結ぶ、設立する', 'established'], ['terms', '（契約の）条件', 'terms|Terms'],
    ['fee', '料金', 'fee'], ['negotiate', '交渉する', 'negotiate'], ['demonstration', '実演', 'demonstration'],
    ['advertising', '宣伝', 'advertising'], ['promotional', '販売促進の、宣伝用の', 'promotional'], ['load', '積載量、荷', 'load'],
    ['specifications', '仕様（書）', 'specifications'], ['release', '公開する', 'released']
  ],
  qs: [
    { q: 'Why did Elena come to Kyarot’s garden?', c: ['To buy the garden', 'To offer a machine to move the carrot for a fee', "To stop Marie's explosion", 'To film a cooking show'], a: 1,
      ex: 'transportation problem を解決する機材がある、と申し出て、契約書（料金30%）を出しています。' },
    { q: 'What did the Master offer during the negotiation?', c: ['Payment in coffee', "A share of Ashur's bakery", 'A smaller fee plus free advertising', 'Sixty pages of new terms'], a: 2,
      ex: 'Ten percent of the carrot ... That’s free advertising. ＝ 料金を下げる代わりに宣伝の機会を提案しています。' },
    { q: 'What happened to the promotional video?', c: ['It was never released.', 'It became popular in Monatium.', 'Kyarot refused to appear in it.', 'It was shown at the Banquet Hall.'], a: 0,
      ex: '最終段落 Elena’s promotional video was never released. が根拠です。' }
  ]

<script>
/* Elias Reading Room — original fan-made short stories (unofficial). Stories 7–8. */
window.STORIES = window.STORIES || [];
STORIES.push({
  id: 'buried-treasure', no: 7,
  title: "Butter's Buried Treasure", ja: 'バターの埋めた宝物',
  cast: ['Butter', 'Diana', 'Kommy', 'Master'], place: 'Werebeast Village',
  paras: [
    [`Winter was coming to the Werebeast Village, and Chief Diana wanted a proper inventory.`,
     `獣人の村に冬が近づいていて、村長のディアナはきちんとした在庫調べをしたいと考えていた。`],
    [`"Every can of chow in the village will be counted," she announced in front of the village hall. "We will record the numbers and store the cans in the new warehouse. No more hiding food in the ground."`,
     `「村にある缶詰フードを1つ残らず数えます」と彼女は村の集会所の前で宣言した。「数を記録して、新しい倉庫に保管します。もう地面に食べ物を隠すのはおしまいです」`],
    [`Everyone slowly turned to look at Butter.`,
     `みんなが、ゆっくりとバターのほうを振り向いた。`],
    [`Butter wagged her tail. "Butter doesn't hide food!" she said happily. "Butter saves food for later. In lots of different places."`,
     `バターはしっぽを振った。「バターは食べ物を隠したりしないよ！」と彼女はうれしそうに言った。「あとのために取っておいてるの。いろんな場所にね」`],
    [`"How many places?" the Master asked.`,
     `「何か所くらい？」と教主はたずねた。`],
    [`Butter thought about it. Her smile didn't change at all. "Um... all of them?"`,
     `バターは考えた。笑顔はまったく変わらない。「うーん……ぜんぶ？」`],
    [`The Master sighed and took out a notebook. "Then let's make a map."`,
     `教主はため息をつき、ノートを取り出した。「じゃあ、地図を作ろう」`],
    [`They spent the whole morning digging. Butter remembered some places perfectly: under the big oak tree, behind the blacksmith's forge, next to a rock that looked like a sleeping pig. Other places she remembered by smell, which was faster but less reliable. Twice she dug the same hole. Once she dug up a can that belonged to someone else.`,
     `午前中いっぱい、みんなで穴を掘った。バターがはっきり覚えている場所もあった。大きな樫の木の下、鍛冶屋の裏、眠っている豚みたいな岩の隣。においで覚えている場所もあって、そちらのほうが早いけれど当てにならなかった。同じ穴を2回掘ったこともあったし、他の誰かの缶を掘り当てたこともあった。`],
    [`"That one's mine," said a voice from inside a hole.`,
     `「それ、わたしの」と穴の中から声がした。`],
    [`Kommy was lying at the bottom, curled up on a bed of leaves. "Kommy started hibernating early," she explained, without opening her eyes. "Please close the door."`,
     `コミーが穴の底で、落ち葉のベッドに丸まって寝ていた。「コミーは早めに冬眠を始めました」と、目も開けずに説明する。「ドアを閉めてください」`],
    [`"It's a hole," the Master said.`,
     `「穴だよ」と教主は言った。`],
    [`"Please close the hole."`,
     `「穴を閉めてください」`],
    [`By lunchtime, the Master's notebook was full of small X marks, and the wheelbarrow held one hundred and twelve cans. Diana checked the numbers carefully.`,
     `昼までに教主のノートは小さな×印でいっぱいになり、手押し車には缶が112個たまった。ディアナは数を注意深く確認した。`],
    [`"According to last year's records, Butter received about two hundred cans," Diana said. "Where are the rest?"`,
     `「去年の記録によると、バターが受け取った缶は約200個」とディアナは言った。「残りはどこですか？」`],
    [`Butter's ears drooped. "Butter can't remember," she admitted. "Butter is sorry."`,
     `バターの耳がしゅんと垂れた。「バター、思い出せない」と彼女は認めた。「ごめんなさい」`],
    [`Then she stopped, sniffed the air, and ran toward the edge of the forest. Beside a young tree covered in yellow flowers, she began to dig very carefully, using both hands, as if she were afraid of waking someone.`,
     `そこで彼女はぴたりと止まり、空気のにおいをかぐと、森のはずれへ駆けだした。黄色い花におおわれた若い木のそばで、誰かを起こしてしまうのをこわがるように、両手でとても慎重に掘り始めた。`],
    [`Inside was a small wooden box. It was full of cans, and every can had a name written on it in crooked letters: Diana. Kommy. Mago. Master.`,
     `中には小さな木箱があった。缶がぎっしり詰まっていて、どの缶にもゆがんだ字で名前が書いてあった。ディアナ。コミー。マーゴ。教主。`],
    [`"Butter saved these for friends," she said. "In case the winter is long."`,
     `「これはね、友だちのために取っておいたの」とバターは言った。「冬が長くなったときのために」`],
    [`Diana was quiet for a moment. Then she closed her eyes. "Even closing my eyes has its limits," she said softly. "But today, I did not see this box."`,
     `ディアナはしばらく黙っていた。それから目を閉じた。「目をつぶるのにも限度があります」と彼女は静かに言った。「でも今日は、この箱を見ませんでした」`],
    [`The warehouse was finished the following week. One shelf was labeled VILLAGE SUPPLIES. The other was labeled BUTTER'S FRIENDS, in Butter's crooked handwriting.`,
     `倉庫は翌週に完成した。一つの棚には「村の備蓄品」、もう一つの棚にはバターのゆがんだ字で「バターの友だち」と札が貼られた。`],

STORIES.push({

  cast: ['Ner', 'Erpin', 'Youngchun', 'Master'], place: 'Order Headquarters',
  paras: [
    [`Every morning at seven, Ner knocked twice on the Master's door and held out her hand. "Your diary, please."`,
     `毎朝7時、ネルは教主の部屋のドアを2回ノックして手を差し出す。「日記をお願いします」`],
    [`It was a rule of the Yggdrasil Order, or at least a rule of Ner's: the Master and the Queen had to write at least three sentences every day. According to Ner, a leader who could not reflect on the past could not guide the future. According to Erpin, it was the worst homework in the history of Elias.`,
     `それは世界樹教団の決まり――少なくともネルの決まりだった。教主と女王は毎日最低3つの文を書かなければならない。ネルいわく、過去を振り返れない指導者に未来は導けない。エルフィンいわく、エーリアス史上最悪の宿題。`],
    [`The Master didn't mind. Some days the entries were short: "Ate lunch. Ashur yelled. The weather was nice." Other days there was more to say, like the day a giant carrot fell on the garden, or the night Rim filled a theater with laughter.`,
     `教主は気にしていなかった。短い日もある。「昼ごはんを食べた。エシュールが怒鳴った。いい天気だった」。書くことが多い日もある。巨大なにんじんが菜園に落ちた日や、リムが劇場を笑い声でいっぱいにした夜のように。`],
    [`This morning, however, Ner arrived with two diaries and placed them side by side on the desk.`,
     `ところが今朝、ネルは日記を2冊持ってきて、机の上に並べて置いた。`],
    [`"Master," she said, "please look at these entries."`,
     `「教主様」と彼女は言った。「この記録を見てください」`],
    [`The Master read Erpin's diary first: "Today the Master and I ate cake. Ashur yelled. The weather was nice."`,
     `教主はまずエルフィンの日記を読んだ。「今日は教主とケーキを食べた。エシュールが怒鳴った。いい天気だった」`],
    [`Then the Master read their own: "Today Erpin and I ate cake. Ashur yelled. The weather was nice."`,
     `次に自分の日記を読んだ。「今日はエルフィンとケーキを食べた。エシュールが怒鳴った。いい天気だった」`],
    [`"The Queen," Ner said, "has been copying your diary for three weeks."`,
     `「女王は」とネルは言った。「3週間も教主様の日記を写しています」`],
    [`On the windowsill, Youngchun, who usually napped there all morning, opened one eye. "Busted," she yawned, and closed it again.`,
     `いつも午前中は窓辺で昼寝をしているブルーミーが、片目を開けた。「バレたね」とあくび混じりに言って、また目を閉じた。`],
    [`Erpin was summoned. She arrived with cream on her face and a look of total innocence. "I didn't copy! We just had the same day!"`,
     `エルフィンが呼び出された。顔にクリームをつけ、まったく無実だという表情でやって来る。「写してないもん！ 同じ一日を過ごしただけ！」`],
    [`"You wrote that you went to the Witch Kingdom on Tuesday," Ner said. "On Tuesday, you were in bed with a stomachache. From eating eleven parfaits."`,
     `「火曜日に魔女の王国へ行ったと書いていますね」とネル。「火曜日、あなたは腹痛で寝込んでいました。パフェを11個食べたせいで」`],
    [`Erpin opened her mouth, closed it, and then pointed at the Master. "The Master's diary is easier to read! Their handwriting is nicer!"`,
     `エルフィンは口を開け、閉じて、それから教主を指さした。「教主の日記のほうが読みやすいんだもん！ 字がきれいなんだもん！」`],
    [`(That's not the defense she thinks it is.)`,
     `（それは本人が思っているほどの言い訳になってない）`],
    [`Ner sighed. "As a penalty, the Queen will write one full page today, in her own words, about something she learned. I will review it this evening."`,
     `ネルはため息をついた。「罰として、女王は今日、自分の言葉で、何か学んだことについて1ページまるごと書くこと。今晩、私が確認します」`],
    [`"A whole page?!" Erpin cried. "That's like fifty sentences!"`,
     `「1ページまるごと？！」エルフィンは叫んだ。「50文くらいあるじゃない！」`],
    [`"About fifteen," the Master said.`,
     `「15文くらいだよ」と教主は言った。`],
    [`Erpin sat at the desk and stared at the empty page for a very long time. She chewed her pen. She drew a strawberry in the corner. Then, slowly, she began to write.`,
     `エルフィンは机に向かい、白紙のページをとても長いあいだ見つめた。ペンをかじった。すみっこにいちごを描いた。それから、ゆっくりと書き始めた。`],
    [`That evening, Ner took the diary to her room. She read it once, and then again. It was messy and full of spelling mistakes. It was about a day when Erpin had tried to be a good queen and failed, and how Ner had quietly fixed everything without saying a word, and how Erpin wished she were the kind of queen who could say thank you properly.`,
     `その晩、ネルは日記を自分の部屋に持っていった。一度読み、もう一度読んだ。字はぐちゃぐちゃで、つづりの間違いだらけだった。それは、エルフィンがよい女王になろうとして失敗した日のこと。ネルが何も言わずにこっそり全部を直してくれたこと。そして、ちゃんと「ありがとう」を言える女王になりたいということが書かれていた。`],
    [`Ner closed the diary and sat still for a while.`,

STORIES.push({
  id: 'five-minute-warranty', no: 9, season: 2,
  title: 'The Five-Minute Warranty', ja: '保証期間は5分間',
  cast: ['Shoupan', 'Bana', 'Amelia', 'Elena', 'Master'], place: 'Order Headquarters → Werebeast Village forge',
  paras: [
    [`Shoupan skidded to a stop in front of the Order Headquarters and tapped the shiny helmet on her head. "Look, Master! A SpeedHelmet 3! Made by the elves, and I bought it on Elfnet at a forty percent discount!"`,
     `シュパンは教団本部の前で急停止し、頭にかぶったぴかぴかのヘルメットを軽くたたいた。「見て、教主！ スピードヘルメット3だよ！ エルフ製で、Elfnetで4割引で買ったんだ！」`],
    [`"It looks expensive," the Master said.`,
     `「高そうだね」と教主は言った。`],
    [`"It shows the fastest route, reads my messages out loud, and plays music," Shoupan said proudly. "And it comes with a warranty!"`,
     `「最速ルートを表示して、メッセージを読み上げて、音楽も流してくれるんだ」シュパンは誇らしげに言った。「しかも保証つき！」`],
    [`(A discount on elven technology,) the Master thought. (That's never a good sign.)`,
     `（エルフの技術が割引……）と教主は思った。（いい予感がしない）`],
    [`Shoupan zoomed off on the Shoupabolt for her first delivery of the day. Exactly six minutes later, she was back. The helmet was singing the Monatium city anthem at full volume, and it would not come off.`,
     `シュパンはその日最初の配達へ、シュパボルトで飛び出していった。ちょうど6分後、彼女は戻ってきた。ヘルメットはモナティウムの市歌を大音量で歌っていて、どうやっても脱げなかった。`],
    [`"Help!" she shouted over the music. "It's been singing since the bridge!"`,
     `「助けて！」音楽に負けない声で彼女は叫んだ。「橋のあたりからずっと歌ってるんだ！」`],
    [`The Master found the customer service number on the box and called. After one ring, a calm voice answered. "This is Amelia, the mayor's secretary. May I ask the reason for this call?"`,
     `教主は箱に書かれたカスタマーサービスの番号に電話をかけた。1回の呼び出しで、落ち着いた声が出た。「市長秘書のアメリアです。ご用件をうかがってもよろしいですか？」`],
    [`"Why is the mayor's secretary answering customer service calls?"`,
     `「どうして市長秘書がカスタマーサービスの電話に出るの？」`],
    [`"Budget efficiency," Amelia said. "How can I help you?"`,
     `「予算の効率化です」とアメリア。「どういったご用件でしょう？」`],
    [`The Master explained the problem. There was a short pause and the sound of typing. "I see. The warranty for the SpeedHelmet 3 is valid for five minutes after purchase. According to our records, your friend has used it for six. We can offer a repair service for three thousand Candy. I will send the invoice now."`,
     `教主が事情を説明すると、少し間があって、キーボードを打つ音がした。「承知しました。スピードヘルメット3の保証は、購入から5分間有効です。記録によると、ご友人は6分間お使いになっています。修理サービスでしたら3000キャンディで承ります。ただいま請求書をお送りします」`],
    [`Shoupan's eyes narrowed. "Five minutes? That's it. I'm going to Monatium. Revenge mode."`,
     `シュパンの目が細くなった。「5分？ もういい。モナティウムに行く。復讐モードだ」`],
    [`"Wait," the Master said, grabbing the Shoupabolt's handle. "Let's get a second opinion first."`,
     `「待って」教主はシュパボルトのハンドルをつかんだ。「先に別の人にも見てもらおう」`],
    [`Bana, the werebeast blacksmith, turned the helmet over in her hands. "I've never seen a machine this complicated," she said happily, and picked up a tiny screwdriver. "Let's see what's inside. And you. Stop singing."`,
     `獣人の鍛冶屋バナは、ヘルメットを手の中でひっくり返した。「こんなに複雑な機械は初めて見たよ」とうれしそうに言って、小さなドライバーを手に取った。「中を見てみようか。そこのお前、歌うのをやめな」`],
    [`The helmet stopped singing.`,
     `ヘルメットは歌うのをやめた。`],
    [`Two minutes later, Bana held up a part the size of a candy. Printed on it in tiny letters were the words SCHEDULED MALFUNCTION UNIT — DO NOT REMOVE.`,
     `2分後、バナはキャンディほどの大きさの部品をつまみ上げた。そこには小さな字でこう印刷されていた。「計画的故障ユニット ― 取り外し禁止」`],
    [`"Werebeast wisdom," Bana said. "When something breaks, suspect the elves first. You're usually right." Then, already reaching for more tools, she added, "While I'm at it, this thing could use a few upgrades."`,
     `「獣人の知恵だよ」とバナは言った。「何かが壊れたら、まずエルフを疑え。だいたい当たるから」それから、もう次の工具に手を伸ばしながら付け加えた。「ついでだから、ちょっと改造もしておこうか」`],
    [`The Master called again and described the evidence. "Please hold," said Amelia. Soft music played. Then a new voice came on the line. "This is Elena. I hear there has been a... misunderstanding."`,
     `教主がもう一度電話をかけて証拠のことを伝えると、「少々お待ちください」とアメリアが言った。穏やかな保留音が流れ、それから新しい声が電話に出た。「エレナよ。何か……誤解があったと聞いたわ」`],
    [`"A part designed to break is not a misunderstanding," the Master said.`,
     `「壊れるように作った部品は誤解とは言わないよ」と教主は言った。`],
    [`"If necessary, a fair contract will be established," Elena said smoothly. "We will provide a free replacement. In return, Shoupan will wear Monatium advertising stickers during every delivery for one month."`,
     `「必要なら、公正な契約を結びましょう」エレナはなめらかに言った。「無料で交換品をお渡しします。その代わり、シュパンには1か月間、すべての配達でモナティウムの広告ステッカーを貼ってもらうわ」`],
    [`Shoupan thought about it. "Deal. But the stickers go on my back."`,
     `シュパンは考えた。「いいよ。でもステッカーは背中に貼る」`],
    [`"Why the back?" Elena asked.`,
     `「どうして背中なの？」とエレナは聞いた。`],
    [`"Because I'm so fast that nobody ever sees it," Shoupan said, and hung up.`,
     `「私は速すぎて、誰も背中なんて見られないからだよ」とシュパンは言って、電話を切った。`],
    [`The replacement helmet arrived the next morning. The Master checked the receipt. At the bottom, in very small letters, it said: Warranty valid for ten minutes.`,
     `交換品のヘルメットは翌朝届いた。教主はレシートを確認した。いちばん下に、とても小さな字でこう書いてあった。「保証期間：10分間」`],
    [`That night, the Master wrote three sentences in the diary: "Shoupan got a new helmet. Its warranty is twice as long as the old one. I think that counts as progress."`,
     `その夜、教主は日記に3つの文を書いた。「シュパンが新しいヘルメットを手に入れた。保証期間は前の2倍だ。これも進歩と言えるだろう」`]
  ],
  vocab: [
    ['discount', '割引', 'discount'], ['route', 'ルート、経路', 'route'], ['warranty', '保証', 'warranty'],

    ['鍛冶屋バナ', 'げっ歯類の獣人で、獣人の村で鍛冶場を営んでいます。同じイベントでシュパボルトを修理し、「何か問題が起きたら、とりあえずエルフを疑うとだいたい当たる」という獣人の常識を語ります。シュパンの改造案を「この程度じゃ全然物足りない」と言い出す凝り性の職人でもあります。'],
    ['アメリアとエレナの決め台詞', '"This is Amelia, the mayor’s secretary. May I ask the reason for this call?" と "If necessary, a fair contract will be established." は、それぞれのキャラクター紹介に出てくる台詞です。']

     `「許せない！」樽の上に立ったティグが叫んだ。「Chow Rebels が正式に捜査を開始する！」`],
    [`Rufo pushed up the aluminum-foil hat on her head. "I already know the answer," she said. "Elf drones. They fly in at night, read our minds, and steal our tea. That is why I wear this."`,
     `ルポは頭のアルミホイルの帽子を押し上げた。「答えはもうわかってるのだ」と彼女は言った。「エルフのドローンなのだ。夜に飛んできて、心を読んで、お茶を盗んでいく。だからこれをかぶってるのだ」`],
    [`Beni nodded seriously. She was wearing earplugs and had not heard a single word.`,
     `ベニーは真剣にうなずいた。耳栓をしていたので、ひと言も聞こえていなかった。`],
    [`Chief Diana sighed and turned to the Master. "Master, dear, would you help these children? If they march on Monatium again, I will have to discipline them. Even closing my eyes has its limits."`,
     `ディアナ村長はため息をつき、教主のほうを向いた。「教主様、この子たちを手伝ってやってくれないかね。またモナティウムに攻め込んだりしたら、しつけをしなきゃならない。目をつぶるのにも限度があるからね」`],
    [`The Master examined the shed. The floor was sticky, and a line of small, sticky footprints led toward the forest.`,
     `教主は物置を調べた。床はべたべたしていて、小さなべたべたの足跡が森のほうへ続いていた。`],
    [`Everyone slowly turned to look at Butter.`,
     `みんながゆっくりとバターのほうを振り向いた。`],
    [`"Butter didn't take it!" Butter said, wagging her tail. "Butter only hides chow. Honey tea is too sticky for the secret storage."`,
     `「バターじゃないよ！」バターはしっぽを振りながら言った。「バターが隠すのは缶詰フードだけ。はちみつティーはべたべたしすぎて、秘密の倉庫には入れないもん」`],
    [`(That is a surprisingly reasonable alibi,) the Master thought.`,
     `（意外とちゃんとしたアリバイだ）と教主は思った。`],
    [`They followed the footprints deep into the forest. The prints were strangely small and evenly spaced, and they stopped at the foot of a tall oak tree. High in the branches, something was blinking red.`,
     `一行は足跡をたどって森の奥へ進んだ。足跡は妙に小さく、等間隔に並んでいて、背の高い樫の木の根元で途切れていた。枝の高いところで、何かが赤く点滅している。`],
    [`It was a small delivery drone, covered in honey. Around it, one hundred jars hung neatly from the branches like strange fruit. A label on its side read: MONATIUM EXPRESS — TEST FLIGHT.`,
     `それは、はちみつまみれの小さな配達ドローンだった。そのまわりには、100個の瓶が奇妙な果物のように枝からきちんと吊るされている。機体の側面のラベルにはこう書いてあった。「モナティウム急便 ― 試験飛行中」`],
    [`"I told you!" Rufo cried. "The elves!"`,
     `「言ったとおりなのだ！」ルポが叫んだ。「エルフなのだ！」`],
    [`"WHAT?" Beni shouted.`,
     `「なにー？」ベニーが大声で言った。`],
    [`The Master climbed the tree, checked the drone's screen, and read the delivery log aloud. "Task: collect all packages in the area. Package definition: any round object with a lid."`,
     `教主は木に登ってドローンの画面を確認し、配送記録を読み上げた。「任務：周辺の荷物をすべて回収せよ。荷物の定義：ふたのついた丸いもの全般」`],
    [`Tig raised her sword. "To Monatium! Today, the Chow Rebels get justice!"`,
     `ティグが剣を掲げた。「モナティウムへ！ 今日こそ Chow Rebels が正義を果たす！」`],
    [`Before anyone could march anywhere, a message arrived on the Master's phone. It was from Amelia: "We have confirmed that one of our test drones made an unauthorized pickup in the Werebeast Village. The mayor sends her apologies, a full refund, and a coupon for ten percent off our next delivery service."`,
     `誰かが進軍を始める前に、教主のスマホにメッセージが届いた。アメリアからだった。「当市の試験用ドローン1機が、獣人の村で許可のない回収を行ったことを確認しました。市長よりお詫びと全額返金、さらに次回の配達サービス10%割引のクーポンをお送りします」`],
    [`Rufo read the message twice. "A refund," she whispered. "The elves apologized. That has never happened in history."`,
     `ルポはメッセージを2回読んだ。「返金なのだ」と彼女はささやいた。「エルフが謝ったのだ。歴史上、一度もなかったことなのだ」`],
    [`Tig slowly lowered her sword. "Then... this is our first victory?"`,
     `ティグはゆっくりと剣を下ろした。「じゃあ……これは俺たちの初勝利ってことか？」`],
    [`That evening, the whole village sat in front of the chief's house and drank honey tea. The Chow Rebels gave a long speech about their great victory. Beni, still wearing her earplugs, clapped at all the wrong moments.`,
     `その晩、村じゅうが村長の家の前に集まって、はちみつティーを飲んだ。Chow Rebels は大勝利について長い演説をした。まだ耳栓をしたままのベニーは、ことごとく的外れなところで拍手をした。`],
    [`Diana sipped her tea and smiled at the Master. "Thank you, dear. Now I only have to worry about the coupon."`,
     `ディアナはお茶をすすり、教主にほほえんだ。「ありがとうね。あとはクーポンのことだけ心配すればいいよ」`],
    [`"Why worry about the coupon?"`,
     `「どうしてクーポンが心配なの？」`],
    [`Diana pointed at the small print: Valid only for deliveries to Monatium made by the Chow Rebels, who must wear matching elf uniforms.`,
     `ディアナは小さな文字を指さした。「本クーポンは、Chow Rebels がおそろいのエルフの制服を着て、モナティウムへ配達する場合にのみ有効です」`],
    [`(The elves never lose,) the Master thought. (They just apologize with extra conditions.)`,
     `（エルフは決して負けない）と教主は思った。（謝るときも、ちゃっかり条件をつけてくるだけだ）`]
  ],
  vocab: [
    ['store', '保管する', 'stored'], ['investigation', '調査、捜査', 'investigation'], ['examine', '調べる', 'examined'],
    ['label', 'ラベル', 'label'], ['delivery', '配達', 'delivery'], ['collect', '回収する', 'collect'],
    ['confirm', '確認する', 'confirmed'], ['unauthorized', '許可のない', 'unauthorized'], ['apology', 'お詫び', 'apologies|apologized'],
    ['refund', '返金', 'refund'], ['coupon', 'クーポン', 'coupon'], ['valid', '有効な', 'Valid'], ['condition', '条件', 'conditions']
  ],
  qs: [
    { q: 'What problem did the village discover?', c: ["Butter's chow was missing.", 'The honey tea in the shed was gone.', "A drone attacked the chief's house.", 'The Chow Rebels had run away.'], a: 1,
      ex: '冒頭で、物置に保管していた100個のはちみつティーがなくなっていた（the shed was empty）とわかります。' },
    { q: 'Why did the drone take the jars?', c: ['Rufo ordered it to.', 'Butter hid them in the tree.', 'Its program treated them as packages.', 'It wanted to drink the tea.'], a: 2,
      ex: '配送記録に「荷物の定義：ふたのついた丸いもの全般」とあり、瓶を荷物と判断していました。' },
    { q: 'What is implied about the coupon?', c: ['It is hard to use without doing extra work for the elves.', 'It can be used at any shop.', 'Diana is planning to sell it.', 'It was sent by mistake.'], a: 0,
      ex: 'エルフの制服を着てモナティウムへ配達する場合だけ有効 ＝ エルフのために働かないと使えない、ということです。' }
  ],
  notes: [
    ['Chow Rebels（反アニマル缶戦線）', 'ティグ（隊長）・ルポ（参謀）・ベニー（力持ち）の3人組。第2章「Chow Unites Us All」では、ベニーが説得を聞かないよう耳栓をしてくる作戦が登場します。本人たちは反乱をごっこ遊びとして楽しんでいます。'],
    ['ルポのアルミホイル帽子', '第2章のルポの陰謀論ネタ。第3章では、エレナの猫型ロボット M.E.O.W. が本当にアルミホイルで魔法を防いでいたと判明し、ルポの説があながち外れではなかったことになります。'],
    ['はちみつティーとディアナ村長', 'はちみつティーは獣人の森の特産品（第2章でエルフィンがねだる）。"Even closing my eyes has its limits." はディアナの決め台詞です。']
  ]

<script>
/* Elias Reading Room — Season 2. Stories 11–12. */
window.STORIES = window.STORIES || [];
STORIES.push({
  id: 'pumpkin-sermon', no: 11, season: 2,
  title: 'Pumpkin Sermons, Now Half Price', ja: 'かぼちゃ説法、ただいま半額',
  cast: ['Speaki', 'Ner', 'Erpin', 'Master'], place: "Order Headquarters → Speaki's pumpkin patch",
  paras: [
    [`The posters appeared overnight on every tree near the Order Headquarters: PUMPKIN CHAPEL — SERMONS BY HIGH PRIESTESS NER — DONATIONS NOW HALF PRICE!`,
     `ひと晩のうちに、教団本部の近くの木という木にポスターが貼られた。「かぼちゃ礼拝堂 ― 司祭長ネルによる説法 ― お布施ただいま半額！」`],
    [`Erpin read one with her mouth full of cookie. "Half price? Ner is never half price. Ner is always full price. Ner is extra price."`,
     `エルフィンはクッキーをほおばったまま、それを読んだ。「半額？ ネルが半額なわけないじゃない。ネルはいつも定価よ。むしろ割増よ」`],
    [`Ner stood behind her, reading the same poster in silence. Her left eye twitched once. (Calm,) she told herself. (A priestess does not get angry.)`,
     `その後ろでネルが黙って同じポスターを読んでいた。左目が一度ぴくりと動く。（落ち着きなさい）と彼女は自分に言い聞かせた。（司祭は怒らないものです）`],
    [`"Ner, are you angry?" Erpin asked.`,
     `「ネル、怒ってる？」とエルフィンが聞いた。`],
    [`"Have I ever been angry, Your Majesty?"`,
     `「私がこれまでに怒ったことがありますか、女王様？」`],
    [`"Yesterday. The day before yesterday. Probably tomorrow."`,
     `「昨日。おととい。たぶん明日も」`],
    [`The Pumpkin Chapel turned out to be a wooden crate in the middle of Speaki's pumpkin patch. About twenty sprites sat in front of it, and on top of the crate stood a perfect copy of Ner, holding a staff and two very serious-looking pumpkins.`,
     `かぼちゃ礼拝堂の正体は、スピッキーのかぼちゃ畑のまんなかに置かれた木箱だった。その前に20人ほどの妖精が座っていて、木箱の上には、杖と、とても真面目な顔つきのかぼちゃを2つ抱えた完璧なネルのそっくりさんが立っていた。`],
    [`To everyone except the Master and the real Ner, it was simply Ner. The Master, however, could clearly see Speaki underneath.`,
     `教主と本物のネル以外の全員にとって、それはどう見てもネルだった。しかし教主には、その下にいるスピッキーがはっきり見えていた。`],
    [`"Yggdrasil has spoken!" the fake Ner announced. "Pumpkins are our friends! Also, Your Majesty, please stop eating cake before dinner! The Order's budget is very, very small!"`,
     `「世界樹はおっしゃいました！」偽のネルが宣言した。「かぼちゃは私たちの友達です！ それから女王様、夕食の前にケーキを食べるのはやめてください！ 教団の予算はとってもとっても少ないんです！」`],
    [`The sprites applauded. Erpin looked offended. "She even copies Ner's nagging."`,
     `妖精たちが拍手した。エルフィンはむっとした顔をした。「ネルの小言までまねしてる」`],
    [`"And now," the fake Ner continued, "my assistants, Pumpoo and Pumpking, will collect your donations." The two pumpkins did not move. One polite sprite placed a cookie on each of them anyway.`,
     `「では」と偽のネルは続けた。「助手のパンプーとパンプキングが、みなさんのお布施を集めます」2つのかぼちゃは動かなかった。それでも礼儀正しい妖精が1人、それぞれの上にクッキーを1枚ずつ置いた。`],
    [`The real Ner stepped forward. "I am Ner, the priestess of Yggdrasil."`,
     `本物のネルが前に進み出た。「私がネル、世界樹の司祭です」`],
    [`"No," said the fake Ner. "I am Ner."`,
     `「いいえ」と偽のネルが言った。「私がネルです」`],
    [`"Can we keep the cheaper one?" Erpin whispered to the Master. The real Ner's hand moved slowly toward her axe.`,
     `「安いほうを残しちゃだめ？」とエルフィンが教主にささやいた。本物のネルの手が、ゆっくりと斧のほうへ動いた。`],
    [`The sprites looked from one Ner to the other. After a short discussion, they voted for the one on the crate. "She's half price," one of them explained.`,
     `妖精たちは2人のネルを見比べた。少し話し合ったあと、木箱の上のほうに票を入れた。「こっちは半額だから」と1人が説明した。`],
    [`(The Order is losing to a discount,) the Master thought, and raised a hand. "One question for both of you. How many sentences must be written in the diary every day?"`,
     `（教団が割引に負けている）教主はそう思いながら手を挙げた。「2人に質問。日記には毎日何文書かなきゃいけない？」`],
    [`"Fifty!" said the fake Ner.`,
     `「50文です！」と偽のネル。`],
    [`"At least three," said the real Ner.`,
     `「最低3文です」と本物のネル。`],
    [`The sprites gasped. "The half-price one is stricter!" someone cried, and the whole congregation ran away.`,
     `妖精たちが息をのんだ。「半額のほうが厳しい！」と誰かが叫び、信者たちは全員逃げていった。`],
    [`Speaki turned back into herself and sat down on the crate, sniffing. "Speaki just wanted everyone to like Ner," she said. "People are scared of Ner, so Speaki made a nicer Ner. A cheaper Ner. Pumpoo and Pumpking helped."`,
     `スピッキーは元の姿に戻り、鼻をすすりながら木箱に座り込んだ。「スピッキーは、みんなにネルを好きになってほしかっただけです」と彼女は言った。「みんなネルを怖がるから、スピッキーがやさしいネルを作ったんです。安いネルを。パンプーとパンプキングも手伝ってくれました」`],
    [`Ner opened the donation box. Inside were twelve Candy and a note in careful, crooked letters: For the real Ner. For Yggdrasil.`,
     `ネルはお布施箱を開けた。中には12キャンディと、丁寧だけれどゆがんだ字のメモが入っていた。「本物のネルへ。世界樹のために」`],
    [`For a long moment, Ner said nothing. Then she said, "Speaki. Kneel. Arms up."`,
     `しばらくのあいだ、ネルは何も言わなかった。それから言った。「スピッキー。正座。両手を上げなさい」`],
    [`"Speaki didn't do anything that bad..." Speaki whispered, but she knelt. Ner placed the two serious pumpkins beside her, so that they seemed to be kneeling too.`,
     `「そんなに悪いことしてないのに……」とスピッキーはつぶやいたが、正座した。ネルは真面目な顔のかぼちゃ2つを彼女の横に置いた。かぼちゃまで正座しているように見えた。`],
    [`That evening, the Master noticed a new line in the Order's account book, written in Ner's neat handwriting: Donation — 12 Candy — Pumpkin Chapel (unofficial branch).`,
     `その晩、教主は教団の会計帳簿に、ネルの整った字で新しい行が書き加えられているのに気づいた。「お布施 ― 12キャンディ ― かぼちゃ礼拝堂（非公式支部）」`],
    [`(In Ner's language,) the Master thought, (I'm fairly sure that means thank you.)`,
     `（ネルの言葉では）と教主は思った。（たぶんあれが「ありがとう」なんだろう）`]
  ],
  vocab: [
    ['donation', '寄付、お布施', 'DONATIONS|donation'], ['announce', '宣言する、発表する', 'announced'], ['budget', '予算', 'budget'],
    ['applaud', '拍手する', 'applauded'], ['discussion', '話し合い', 'discussion'], ['vote', '投票する', 'voted'],
    ['discount', '割引', 'discount'], ['strict', '厳しい', 'stricter'], ['account book', '会計帳簿', 'account book'],
    ['handwriting', '筆跡', 'handwriting'], ['unofficial', '非公式の', 'unofficial'], ['branch', '支部、支店', 'branch']
  ],
  qs: [
    { q: 'Why were many sprites at the Pumpkin Chapel?', c: ['Free cake was being served.', 'Erpin had ordered them to go.', 'Donations there were half price.', 'The real Ner had invited them.'], a: 2,
      ex: 'ポスターの DONATIONS NOW HALF PRICE と、投票の理由 "She’s half price" が根拠です。' },
    { q: 'How did the Master show which Ner was real?', c: ['By asking about the diary rule', 'By pulling her cheeks', 'By checking her staff', 'By asking the pumpkins'], a: 0,
      ex: '日記には毎日何文書くか、と質問し、本物は「最低3文」と正しく答えました。' },
    { q: 'What is suggested by the new line in the account book?', c: ['Ner fined Speaki 12 Candy.', 'The Order opened a new chapel.', 'Ner lost the donation box.', 'Ner accepted the donation as a kind of thank-you.'], a: 3,
      ex: 'お布施を「非公式支部」からの寄付として帳簿に記入した ＝ 口には出さないが受け取って感謝している、と教主は解釈しています。' }
  ],
  notes: [
    ['ネルに化けるスピッキー', 'スピッキーは「アイデンティティ」の幽霊で、いちばん好きなまねの相手はネル。プロフィールの台詞からして "I’m Ner, the priestess of Yggdrasil! Oh? Who’s Speaki?" です。変装を見破れるのは、教主・まねされた本人・ブルーミーだけ。杖を持っていて、ネルの斧をうらやましがっています。かぼちゃを友達だと思っていて、なかでもパンプーとパンプキングが仲よしです。'],
    ['「私がこれまでに怒ったことがありますか？」', '第1章で、怒らないと約束させられたネルがこう言い、エルフィンが「おとといも昨日も今日も、そして明日も怒ってる」と返す掛け合いが元になっています。'],
    ['正座と「そんなに悪いことしてないのに」', 'ネルの罰「正座して両手を上げる」と、捕まったスピッキーの言い訳は原作の定番（イベント「Dancing Fate in the Card Deck」など）。スピッキーは自分のことを「スピッキー」と呼びます。']
  ]
});

STORIES.push({
  id: 'open-campus', no: 12, season: 2,
  title: 'Open Campus Day (Not a Bakery)', ja: 'オープンキャンパス（パン屋ではありません）',
  cast: ['Ashur', 'Patula', 'Erpin', 'Kommy', 'Master'], place: "Erpien · Ashur's Magic School",
  paras: [
    [`Ashur had been preparing for weeks. She printed five hundred brochures, cleaned every classroom, and hung a huge banner over the door: SPRITE KINGDOM MAGIC SCHOOL — OPEN CAMPUS DAY — FREE SAMPLE LESSONS!`,
     `エシュールは何週間も前から準備していた。パンフレットを500部刷り、教室を隅々まで掃除し、ドアの上に大きな横断幕を掲げた。「妖精王国魔法学校 ― オープンキャンパス ― 無料体験授業！」`],
    [`"This time," she told the Master, "real students will come. Not customers. Students."`,
     `「今度こそ」と彼女は教主に言った。「本物の生徒が来るわ。お客じゃなくて。生徒がね」`],
    [`At nine o'clock, the doors opened, and a long line of sprites rushed in. "Welcome to Ashur's Bakery!" Ashur cried with tears of joy. "I mean, Magic School!" Then she noticed that every single one of them was holding a plate.`,
     `9時にドアが開くと、長い列の妖精たちがなだれ込んできた。「エシュールのパン屋へようこそ！」エシュールは喜びの涙を浮かべて叫んだ。「じゃなくて、魔法学校へ！」それから彼女は、1人残らず皿を持っていることに気づいた。`],
    [`"Where are the free samples?" asked the first sprite in line. It was Erpin.`,
     `「無料サンプルはどこ？」と列の先頭の妖精が聞いた。エルフィンだった。`],
    [`"Sample LESSONS," Ashur said. "Not sample bread!"`,
     `「体験『授業』よ」とエシュールは言った。「試食パンじゃないの！」`],
    [`"The posters in town just say FREE SAMPLES," said Patula, the apprentice baker, who was helping in the kitchen. "In very large letters. I made them large myself."`,
     `「町のポスターには『無料サンプル』としか書いてないですよ」とキッチンを手伝っていた見習いパン職人のパトラが言った。「すごく大きな字で。私が大きくしたんです」`],
    [`Ashur grabbed her wand, took a deep breath, and walked to the front of the classroom. "Fine. Today's lecture is the foundation of all magic. Everyone, pay attention."`,
     `エシュールは杖をつかみ、深呼吸して教室の前へ歩いていった。「いいわ。今日の講義は、すべての魔法の基礎よ。全員、注目」`],
    [`She raised the wand high. Then she put it down, rolled up her sleeves, and punched a large ball of dough so hard that it flew across the room.`,
     `彼女は杖を高く掲げた。それから杖を置き、袖をまくって、大きなパン生地の塊を力いっぱい殴った。生地は部屋の反対側まで飛んでいった。`],
    [`"The foundation of all magic," Ashur said, "is physics."`,
     `「すべての魔法の基礎は」とエシュールは言った。「物理よ」`],
    [`(That's not magic,) the Master thought. (That's kneading.)`,
     `（それは魔法じゃない）と教主は思った。（ただの生地こねだ）`],
    [`In the back row, Kommy had already fallen asleep on her textbook. "Kommy came for the lecture," she murmured. "Lectures are very good for sleeping."`,
     `最後列では、コミーがもう教科書の上で眠っていた。「コミーは講義を聞きに来ました」と彼女はつぶやいた。「講義は眠るのにとてもいいです」`],
    [`Still, by noon, something strange had happened. Twenty-three sprites had filled out registration forms. Ashur stared at the stack of paper as if it were made of gold.`,
     `それでも昼には、不思議なことが起きていた。23人の妖精が登録用紙に記入していたのだ。エシュールは、金でできているかのように書類の束を見つめた。`],
    [`"Twenty-three applicants," she whispered. "My degree has finally paid off."`,
     `「23人の応募者……」と彼女はささやいた。「ついに私の学位が報われたわ」`],
    [`The Master picked up the top form and read the heading aloud. "Ashur's Bakery — Enrollment Form. Course: Bread Basics."`,
     `教主はいちばん上の用紙を手に取り、見出しを読み上げた。「エシュールのパン屋 ― 入学申込書。コース：パンの基礎」`],
    [`Every single form said the same thing.`,
     `どの用紙にも同じことが書かれていた。`],
    [`"The printer made a mistake!" Ashur cried. "Is it my fault that the printer can't spell MAGIC SCHOOL? Is it my fault that everyone wants to learn baking? Is it my fault that my bread is delicious?!"`,
     `「印刷屋のミスよ！」エシュールは叫んだ。「印刷屋が『魔法学校』ってつづれないのは私のせい？ みんながパン作りを習いたがるのは私のせい？ 私のパンがおいしいのは私のせいなの？！」`],
    [`(The printer only prints what it is given,) the Master thought, but decided not to say it.`,
     `（印刷屋は渡された原稿を刷るだけなんだけど）と教主は思ったが、言わないでおいた。`],
    [`"What if you combine them?" the Master suggested. "A course called Magic Baking. Students use levitation magic to knead the dough. It's magic, and it's baking."`,
     `「両方を組み合わせたら？」と教主は提案した。「『魔法パン作り』っていう講座。生徒は浮遊魔法で生地をこねるんだ。魔法でもあるし、パン作りでもある」`],
    [`Ashur thought about it for a long time. Then she took a red pen and corrected every form by hand. Course: Magic Baking. Tuition: reasonable.`,
     `エシュールは長いあいだ考えた。それから赤ペンを取り、すべての用紙を手書きで直した。「コース：魔法パン作り。授業料：良心的」`],
    [`The first Magic Baking class was a great success. Twenty-three balls of dough floated through the air, and only four of them hit the ceiling.`,
     `最初の「魔法パン作り」の授業は大成功だった。23個の生地が宙を舞い、天井にぶつかったのは4個だけだった。`],
    [`Patula marched between the tables like a general. "Don't mess around when you're in the kitchen!" she shouted, and quietly added mint to every single ball of dough.`,
     `パトラは将軍のようにテーブルのあいだを歩き回った。「キッチンでふざけないで！」と彼女は叫び、生地という生地にこっそりミントを入れていった。`],
    [`"Hey, baguette brain!" Ashur shouted at the Master, who had somehow become a student too. "Don't just float there like a lazy bagel. Knead!"`,
     `「ちょっと、バゲット頭！」エシュールは、いつの間にか生徒にされていた教主に怒鳴った。「怠けたベーグルみたいにぷかぷか浮いてないで。こねなさい！」`],
    [`As the students were leaving, Erpin handed in one last form. "Can I pay the tuition on my tab?"`,
     `生徒たちが帰りかけたころ、エルフィンが最後の用紙を差し出した。「授業料、ツケで払ってもいい？」`],
    [`Ashur smiled sweetly. "Of course, Your Majesty... NOT!"`,
     `エシュールはにっこり笑った。「もちろんですとも、女王様……なーんてね！」`]
  ],
  vocab: [

  ],
  qs: [

    { q: 'What was wrong with the registration forms?', c: ['They were printed as a bakery’s enrollment form.', 'They had no space for names.', 'Erpin had signed all of them.', 'They were written in the witch language.'], a: 0,

      ex: '最後の NOT! で直前の Of course を打ち消しています。ツケ払いは認めない、という意味です。' }

  notes: [
    ['「〜は私のせい？」', 'エシュールの初登場場面（第1章）の名物。「妖精が生まれつき魔法を使えるのは私のせい？」「魔法よりパン作りの才能があるのは私のせい？」と連発します。'],
    ['すべての魔法の基礎は物理', '第1章で、エシュールが「すべての魔法の基礎は物理」と言いながら力ずくで問題を解決する場面が元になっています。教えるときは別人のように厳しく、使徒ストーリーでは教主を "panini head" と呼んでしごきます（このSSのバゲット頭はそのもじり）。'],
    ['パン屋じゃなくて魔法学校', 'エシュールは自分の店を「魔法学校」と言い張るのに、うっかり「パン屋」と言ってはすぐ言い直します。皮肉のあとに "NOT!" を付けるのも口ぐせ。魔法理論の学位を持っていて、「やっと学位が役に立った！」と喜ぶ場面もあります。パトラは短気な見習いパン職人で、師匠の一人がエシュール。筋金入りのミント推しで、口ぐせは "Don’t mess around when you’re in the kitchen!" です。']
