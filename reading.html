STORIES.push({
  id: 'suggestion-box', no: 13, season: 2,
  title: 'The Suggestion Box', ja: 'リムの目安箱',
  cast: ['Rim', 'Shaydi', 'Selene', 'Canna', 'Master'], place: "Phantom Marsh · Rim's tower",
  paras: [
    [`Rim had decided that Phantom Marsh needed more order. So she placed a small wooden box at the entrance of her tower, with a sign: SUGGESTION BOX — YOUR OPINION MATTERS. ANONYMOUS SUGGESTIONS WELCOME.`,
     `リムは、幽霊の沼にはもっと秩序が必要だと決めた。そこで自分の塔の入り口に小さな木箱を置き、看板を立てた。「目安箱 ― あなたの意見が大切です。匿名のご提案も歓迎します」`],
    [`The Master, who had come to deliver the Order's monthly newsletter, read the sign twice. "A suggestion box? In Phantom Marsh?"`,
     `教団の月報を届けに来た教主は、看板を2回読んだ。「目安箱？ 幽霊の沼に？」`],
    [`"Order begins with listening," Rim said seriously. "If I know what bothers everyone, I can fix it. I am the phantom of balance, after all." She paused. "Some would even say I'm... well-balanced."`,
     `「秩序は耳を傾けることから始まります」とリムは真剣に言った。「みんなが何に困っているかわかれば、直せますから。私はなにしろ均衡の幽霊ですので」彼女は一拍おいた。「バランス感覚がいい、と言う人もいるかも……しれません」`],
    [`Silence. Her scythe, G, slowly turned away from her.`,
     `沈黙。大鎌のGが、ゆっくりと彼女から顔をそむけた。`],
    [`"I'm sorry," Rim whispered, quietly holding on to the Master's ankle. "It came out by itself."`,
     `「すみません」リムは小声で言い、そっと教主の足首にしがみついた。「勝手に出てしまうんです」`],
    [`By evening, the box was full. Rim sat on the steps of her tower and opened the suggestions one by one, reading each of them carefully.`,
     `夕方には、箱はいっぱいになっていた。リムは塔の階段に座り、提案を1枚ずつ開いて丁寧に読んでいった。`],
    [`The first note said: More chaos, please. The second said: Less Rim. The third was a drawing of Rim with a mustache.`,
     `1枚目には「もっと混沌を」。2枚目には「リムを減らして」。3枚目は、ひげの生えたリムの絵だった。`],
    [`"Very... valuable feedback," Rim said. Her voice was getting smaller.`,
     `「とても……貴重なご意見です」とリムは言った。声がだんだん小さくなっていく。`],
    [`The fourth note exploded into a cloud of pink glitter. When the glitter cleared, a message had appeared on the inside of the lid in large letters: THE TOP PRANKSTER WAS HERE. — S.`,
     `4枚目は、ピンクのラメの雲になって爆発した。ラメが晴れると、ふたの内側に大きな字でメッセージが浮かび上がっていた。「いたずら界のトップ参上。― S」`],
    [`"Shaydi," the Master said.`,
     `「シェイディだ」と教主は言った。`],
    [`A laugh came from somewhere behind a tree. "Your suggestion box is the funniest thing in the marsh, Rim! Nobody asks phantoms for their opinion!"`,
     `どこかの木の陰から笑い声がした。「あんたの目安箱、この沼でいちばん面白いわよ、リム！ 幽霊に意見を聞くやつなんていないって！」`],
    [`"Shaydi," Rim said patiently, "we are old enough to know better."`,
     `「シェイディ」とリムは辛抱強く言った。「私たち、もう分別のある年でしょう」`],
    [`"WE? Don't put me in your age group!" the tree shouted.`,
     `「私たち？ あんたと同じ年代にしないでよ！」と木が叫んだ。`],
    [`Then there was a click and a flash. Selene stepped out of the bushes holding a camera. "That expression you made just now was priceless," she said. "I'll call this one Order, Defeated."`,
     `そのとき、カシャッという音とフラッシュ。カメラを持ったセリーネが茂みから出てきた。「今の表情、最高だったわ」と彼女は言った。「タイトルは『秩序、敗れたり』にしようっと」`],
    [`Rim looked down at the pile of glittery paper. Her hands were shaking a little. (She really wanted this to work,) the Master thought.`,
     `リムはラメまみれの紙の山を見下ろした。手が少し震えている。（本当にうまくいってほしかったんだな）と教主は思った。`],
    [`Canna, who had come along for security, cracked her knuckles. "Command received. Shall I suppress them?"`,
     `警備のためについてきたカンナが指を鳴らした。「命令を受領。制圧しますか？」`],
    [`"No," Rim said quietly. "Suppressing phantoms only creates more chaos. That would be... unbalanced."`,
     `「いいえ」とリムは静かに言った。「幽霊を制圧しても、混沌が増えるだけです。それは……均衡を欠きます」`],
    [`The Master sat down next to her and helped sort the remaining notes. Most were jokes. One was a complaint about the smell of pumpkin soup. But at the very bottom of the box lay a small, neatly folded card with a strawberry drawn in one corner.`,
     `教主は隣に座り、残りのメモを仕分けるのを手伝った。ほとんどは冗談だった。1枚はかぼちゃスープのにおいへの苦情だった。けれど箱のいちばん底に、すみにいちごの絵が描かれた、きちんと折りたたまれた小さなカードがあった。`],
    [`Rim opened it. Please come and visit the Sprite Kingdom more often. The bakery has tables for four. — E.`,
     `リムはそれを開いた。「もっと妖精王国に遊びに来てね。パン屋には4人がけのテーブルがあるから。― E」`],
    [`Rim read it three times. "E," she said. "Who could E be?"`,
     `リムはそれを3回読んだ。「E」と彼女は言った。「Eとは、いったい誰でしょう？」`],
    [`"Someone who draws strawberries on everything," the Master said.`,
     `「何にでもいちごを描く誰かだね」と教主は言った。`],
    [`For the first time that evening, Rim smiled. She wrote a reply on the back of the card, then stood up and placed a new sign next to the box: SUGGESTIONS REVIEWED. ACTION TAKEN.`,
     `その晩はじめて、リムはほほえんだ。カードの裏に返事を書くと、立ち上がって箱の隣に新しい看板を立てた。「ご提案を確認しました。対応済みです」`],
    [`"What action?" Canna asked.`,
     `「どんな対応だ？」とカンナが聞いた。`],
    [`"I am going to the Sprite Kingdom tomorrow," Rim said. "I will bring pumpkin soup, and I will try not to make any puns." She thought for a moment. "For me, that will be a real... pun-ishment."`,
     `「明日、妖精王国へ行きます」とリムは言った。「かぼちゃスープを持っていって、ダジャレは言わないように努力します」彼女は少し考えた。「私にとっては、本当の……罰（pun-ishment）になりますね」`],
    [`G fell over on purpose.`,
     `Gはわざと倒れた。`]
  ],
  vocab: [
    ['suggestion', '提案', 'SUGGESTION|suggestions|SUGGESTIONS'], ['opinion', '意見', 'OPINION|opinion'], ['anonymous', '匿名の', 'ANONYMOUS'],
    ['deliver', '届ける', 'deliver'], ['newsletter', '会報、月報', 'newsletter'], ['security', '警備', 'security'], ['valuable', '貴重な', 'valuable'],
    ['feedback', '意見、感想', 'feedback'], ['suppress', '制圧する、抑える', 'suppress'], ['sort', '仕分ける', 'sort'],
    ['complaint', '苦情', 'complaint'], ['reply', '返事', 'reply'], ['review', '確認する、検討する', 'REVIEWED'], ['action', '対応、行動', 'ACTION|action']
  ],
  qs: [
    { q: 'Why did Rim place a box outside her tower?', c: ['To store pumpkin soup', 'To collect opinions from the residents of the marsh', 'To catch Shaydi', 'To sell tickets to a show'], a: 1,
      ex: '看板の YOUR OPINION MATTERS と、「みんなが何に困っているかわかれば直せる」という発言が根拠です。' },
    { q: 'Who most likely wrote the card with the strawberry?', c: ['Shaydi', 'Selene', 'Erpin', 'Canna'], a: 2,
      ex: '妖精王国への招待、パン屋のテーブル、差出人の E、いちごの絵 ＝ エルフィンだと推測できます。' },
    { q: 'What action did Rim decide to take?', c: ['She decided to visit the Sprite Kingdom.', 'She decided to remove the suggestion box.', 'She decided to punish Shaydi.', 'She decided to stop making soup.'], a: 0,
      ex: 'I am going to the Sprite Kingdom tomorrow が根拠です。' }
  ],
  notes: [
    ['リムとダジャレ', 'リムは「均衡（秩序）」の幽霊。第7章で初登場し、ダジャレを言っては気まずくなってエルフィンの足首にしがみつき謝ります。大鎌の名前はG。ダジャレを聞くたびに身を縮めます。'],
    ['セリーネとシェイディ', 'セリーネは「挑発」の幽霊で、相手を怒らせて顔を撮るのが趣味。"That expression you made just now was priceless." が決め台詞です。シェイディは「混沌」の幽霊で、自称「いたずら界のトップ」。ダジャレが大嫌いで、リムがダジャレを言うたびにイラッとします。'],
    ['エルフィンとリム', '第7章のエルフィンは「ダジャレがひどいから近づかない」と言っていたのに、観客の幽霊たちにリムがブーイングされると真っ先にかばい、はっきり「友達」と呼びます。シェイディとリムは最古参の幽霊どうしで、シェイディは年齢の話に敏感。このSSはその後日談のつもりで書きました。']
  ]
});

STORIES.push({
  id: 'annual-checkup', no: 14, season: 2,
  title: 'The Annual Checkup', ja: '村長の健康診断',
  cast: ['Diana', 'Hilde', 'Kommy', 'Butter', 'Amelia', 'Master'], place: 'Monatium University Hospital',
  paras: [
    [`Once a year, Monatium University Hospital offered free checkups to residents of every village in Elias. This year, the Master had made appointments for the Werebeast Village.`,
     `年に一度、モナティウム大学病院はエーリアスのすべての村の住民に無料の健康診断を行っている。今年は、教主が獣人の村の予約を取っていた。`],
    [`"I am perfectly healthy," Chief Diana said at the hospital entrance. "I don't need a checkup, dear. I need a nap."`,
     `「私はいたって健康だよ」ディアナ村長は病院の入り口で言った。「健康診断なんていらないよ。いるのは昼寝さ」`],
    [`"Kommy also needs a nap," said Kommy, who was already lying on a bench in the waiting room.`,
     `「コミーも昼寝が必要です」とコミーが言った。彼女はもう待合室のベンチで横になっていた。`],
    [`Butter ran around the lobby, reading every sign aloud. "Reception! Pharmacy! Radiology! Butter doesn't know what radiology is, but it sounds fun!"`,
     `バターはロビーを走り回り、案内板を片っ端から読み上げた。「受付！ 薬局！ 放射線科！ 放射線科って何か知らないけど、楽しそう！」`],
    [`A gentle elf in a white coat came out to greet them. It was Hilde, chief of the Medical Unit. "Hehe. Welcome," she said softly. "Are you ready for your treatment?"`,
     `白衣を着た優しそうなエルフが出迎えに来た。医療班長のヒルデだ。「ふふ。ようこそ」と彼女はやわらかく言った。「治療の準備はいいですか？」`],
    [`Diana took one step back. (Something about that smile is frightening,) the Master thought.`,
     `ディアナが一歩下がった。（あの笑顔、なんだか怖い）と教主は思った。`],
    [`The checkups began. Butter went first. The doctor tested her reflexes by tapping her knee, and Butter's tail wagged so hard that it knocked over a tray of instruments. "Excellent reflexes," Hilde noted.`,
     `健康診断が始まった。最初はバター。医師がひざをたたいて反射を調べると、バターのしっぽが勢いよく揺れて、器具の載ったトレイをひっくり返した。「反射はとても良好ですね」とヒルデは記録した。`],
    [`Kommy went second. She fell asleep inside the scanning machine, and the machine, following its instructions, waited politely until she woke up. It took three hours.`,
     `2番目はコミー。彼女は検査装置の中で眠ってしまい、装置は指示どおり、彼女が起きるまで礼儀正しく待った。3時間かかった。`],
    [`Diana was last. She sat in the chair with her arms crossed. "Just so you know," she said, "I have been the chief of my village for longer than your city has existed."`,
     `最後はディアナ。彼女は腕を組んで椅子に座った。「言っておくけどね」と彼女は言った。「私は、あんたたちの街ができるより前から村長をやってるんだよ」`],
    [`"Then you must be very strong," Hilde said kindly, and picked up a needle.`,
     `「では、とてもお強いんですね」ヒルデは優しく言い、注射針を手に取った。`],
    [`Diana went pale. The Master suddenly understood. (The chief isn't afraid of the checkup. She's afraid of needles.)`,
     `ディアナの顔が青ざめた。教主はふと気づいた。（村長が怖いのは健康診断じゃない。注射なんだ）`],
    [`"Could we try something else first?" the Master asked.`,
     `「先に何か別のことをしてもいいかな？」と教主はたずねた。`],
    [`Hilde smiled. "Of course. Some patients feel better if we talk first." She poured two cups of honey tea and began asking Diana gentle questions about the village. Diana talked about Butter's buried cans, Kommy's favorite sleeping spots, and the Chow Rebels' newest theory about the elves. Soon she was laughing.`,
     `ヒルデはほほえんだ。「もちろんです。先にお話しすると落ち着く患者さんもいますから」彼女ははちみつティーを2杯いれ、村のことをディアナに穏やかにたずね始めた。ディアナは、バターが埋めた缶詰のこと、コミーのお気に入りの昼寝場所、Chow Rebels の最新のエルフ陰謀説のことを話した。やがて彼女は笑い出した。`],
    [`While Diana was laughing, Hilde quietly finished the blood test. "Done," she said.`,
     `ディアナが笑っているあいだに、ヒルデは静かに採血を終えた。「終わりましたよ」と彼女は言った。`],
    [`Diana blinked. "When did you...?"`,
     `ディアナはまばたきした。「いつの間に……？」`],
    [`"Hehe. That was the treatment," Hilde said.`,
     `「ふふ。今のが治療です」とヒルデは言った。`],
    [`The results arrived an hour later. Butter: healthy and very energetic. Kommy: healthy, possibly part cat and part pillow. Diana: excellent health, but slightly high stress from worrying about everyone.`,
     `1時間後に結果が出た。バター：健康、元気いっぱい。コミー：健康、半分は猫で半分は枕の可能性あり。ディアナ：非常に健康、ただしみんなの心配をしすぎてストレスがやや高め。`],
    [`"Here is your prescription," Hilde said, handing Diana a small note. "One afternoon off every week. No worrying allowed."`,
     `「処方箋です」ヒルデは小さなメモをディアナに手渡した。「毎週、午後を1回お休みすること。心配は禁止です」`],
    [`Then Amelia, the mayor's secretary, appeared at the reception desk with an invoice. "Please note that the checkups are free. However, there is a fee for non-elf patients who fall asleep inside hospital equipment." She looked at Kommy. "Three hours."`,
     `そこへ市長秘書のアメリアが、請求書を持って受付に現れた。「なお、健康診断は無料です。ただし、病院の機器の中で眠ってしまったエルフ以外の患者さんには料金がかかります」彼女はコミーを見た。「3時間分です」`],
    [`Everyone looked at the invoice. Then everyone looked at Kommy. Kommy was asleep again.`,
     `全員が請求書を見た。それから全員がコミーを見た。コミーはまた眠っていた。`],
    [`In the end, the village paid with ten jars of honey tea, which Amelia accepted "as a special exception." On the way home, Diana walked a little more lightly than usual.`,
     `結局、村ははちみつティー10瓶で支払い、アメリアはそれを「特例として」受け取った。帰り道、ディアナはいつもより少しだけ軽い足取りで歩いた。`],
    [`"Master, dear," she said, "will you make the appointment again next year?"`,
     `「教主様」と彼女は言った。「来年もまた、予約を取ってくれるかね？」`],
    [`"Even though there's a needle?"`,

", "escalate", "culminate in", "inadvertently", "notwithstanding", "whereby", "albeit", "thus", "hence", "barring", "on the grounds that", "by means of", "expedient", "ubiquitous", "precarious"];

<script>
/* app.js — Elias Reading Room: timed reading, glossed vocabulary, paragraph translations, audio, quizzes, Claude-written stories */
(function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const view = () => $('#view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const countWords = s => (String(s).match(/[A-Za-z0-9'’\-]+/g) || []).length;
const fmt = s => Math.floor(s / 60) + ':' + pad(Math.floor(s % 60));
const E = window.ELIAS;
const RECALL = new Set((window.RECALL_WORDS || []).map(w => w.toLowerCase()));

/* ---------- storage: artifact db when available, else this browser ---------- */
const Store = {
  db: null, prefix: 'elias:', pending: new Map(), failed: false,
  async init() { try { this.db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch (e) { this.db = null; } },
  async get(path) {
    if (this.db) { try { const s = await this.db.doc(path).get(); return s.exists ? clone(s.data()) : null; } catch (e) { this.fail(e); return null; } }
    try { const v = localStorage.getItem(this.prefix + path); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  },
  async all(coll) {
    if (this.db) {
      try { const snap = await this.db.collection(coll).limit(500).get(); return snap.docs.map(d => Object.assign(clone(d.data()), { _id: d.id })); }
      catch (e) { this.fail(e); return []; }
    }
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i), pre = this.prefix + coll + '/';
        if (k && k.indexOf(pre) === 0) { const o = JSON.parse(localStorage.getItem(k)); if (o) out.push(Object.assign(o, { _id: k.slice(pre.length) })); }
      }
    } catch (e) { /* blocked */ }
    return out;
  },
  save(path, data) {
    let p = this.pending.get(path);
    if (!p) { p = { data: null, running: false }; this.pending.set(path, p); }
    const d = clone(data); delete d._id; p.data = d;
    if (!p.running) this.flush(path, p);
  },
  remove(path) {
    try { localStorage.removeItem(this.prefix + path); } catch (e) { /* blocked */ }
    if (this.db) this.db.doc(path).delete().catch(e => this.fail(e));
  },
  async flush(path, p) {
    p.running = true;
    while (p.data) {
      const d = p.data; p.data = null;
      if (this.db) { try { await this.db.doc(path).set(d); } catch (e) { this.fail(e); } }
      else { try { localStorage.setItem(this.prefix + path, JSON.stringify(d)); } catch (e) { /* blocked */ } }
    }
    p.running = false;
  },
  fail(e) {
    console.warn('store', e);
    if (this.failed) return; this.failed = true;
    banner(e && e.code === 'invalid_argument' ? 'このアカウントでは記録を保存できません（閲覧のみ）。' : '記録の保存に失敗しました。ページを開き直してください。');
  }
};
function banner(m) { $('#bannerText').textContent = m; $('#banner').hidden = false; }
let tt = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- state ---------- */
const S = { settings: { target: 150, font: 19, vocab: true, rate: 0.95 }, progress: {}, gen: [] };
function stories() { return (window.STORIES || []).concat(S.gen); }
const byId = id => stories().find(s => s.id === id);
function words(st) { if (!st._w) st._w = st.paras.reduce((a, p) => a + countWords(p[0]), 0); return st._w; }
function prog(id) { return S.progress[id] || (S.progress[id] = { reads: [], best: 0, quiz: null }); }
const saveProg = id => Store.save('progress/' + id, S.progress[id]);
const saveSettings = () => Store.save('meta/settings', S.settings);
function normGen(d) {
  const s = v => (typeof v === 'string' ? v.trim() : '');
  const paras = (Array.isArray(d.paras) ? d.paras : []).map(p => [s(p && p.en), s(p && p.ja)]).filter(p => p[0]);
  const text = paras.map(p => p[0]).join(' ');
  const vocab = (Array.isArray(d.vocab) ? d.vocab : []).map(v => {
    const forms = (Array.isArray(v.forms) ? v.forms : [v.w]).map(s).filter(Boolean).filter(f => new RegExp('(^|[^A-Za-z])' + escRe(f) + '(?![A-Za-z])', 'i').test(text));
    return forms.length ? [s(v.w), s(v.ja), forms.join('|')] : null;
  }).filter(Boolean).slice(0, 14);
  const qs = (Array.isArray(d.qs) ? d.qs : []).filter(q => q && Array.isArray(q.c) && q.c.length === 4 && Number(q.a) >= 0 && Number(q.a) < 4)
    .map(q => ({ q: s(q.q), c: q.c.map(s), a: Number(q.a), ex: s(q.ex) })).slice(0, 3);
  const notes = (Array.isArray(d.notes) ? d.notes : []).map(n => [s(n && n.t), s(n && n.ja)]).filter(n => n[0] && n[1]).slice(0, 3);
  return { title: s(d.title) || 'Untitled', ja: s(d.ja), place: s(d.place), cast: (Array.isArray(d.cast) ? d.cast : []).map(s).filter(Boolean), paras, vocab, qs, notes };
}

/* ---------- speech ---------- */
const TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voice: null, token: 0, _u: null,
  init() {
    if (!this.ok) return;
    const q = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 3 : /google|siri/i.test(v.name) ? 2 : 1);
    const load = () => { let all = []; try { all = speechSynthesis.getVoices() || []; } catch (e) { all = []; } this.voice = all.filter(v => /^en[-_]/i.test(v.lang)).sort((a, b) => q(b) - q(a) || (/en[-_]US/i.test(b.lang) ? 1 : 0) - (/en[-_]US/i.test(a.lang) ? 1 : 0))[0] || null; };
    load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  stop() { this.token++; try { if (this.ok) speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
  say(text, token) {
    return new Promise(res => {
      if (!this.ok || token !== this.token) return res(false);
      const u = new SpeechSynthesisUtterance(text.replace(/[()]/g, ''));
      if (this.voice) { u.voice = this.voice; u.lang = this.voice.lang; } else u.lang = 'en-US';
      u.rate = S.settings.rate || 0.95;
      let done = false; const fin = ok => { if (!done) { done = true; clearTimeout(g); res(ok && token === this.token); } };
      u.onend = () => fin(true); u.onerror = () => fin(false);
      const g = setTimeout(() => fin(true), 6000 + text.length * 120);
      this._u = u; speechSynthesis.speak(u);
    });
  },
  async play(list, onIdx) {
    this.stop(); const token = ++this.token;
    await new Promise(r => setTimeout(r, 60));
    for (const [i, text] of list) {
      if (token !== this.token) return false;
      onIdx(i);
      // long paragraphs are spoken sentence by sentence (some engines stop after ~15 s)
      for (const part of text.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [text]) { if (!(await this.say(part.trim(), token))) { onIdx(-1); return false; } }
      await new Promise(r => setTimeout(r, 250));
    }
    onIdx(-1);
    return true;
  }
};

/* ---------- Claude ---------- */
const AI = {
  sample: null, off: false,
  async init() { try { this.sample = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch (e) { this.sample = null; } if (cur.view === 'write') views.write(); },
  get on() { return !!this.sample && !this.off; },
  message(e) {
    const c = e && e.code;
    if (c === 'cancelled') return '';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) { this.off = true; return 'この表示では Claude の機能を使えません。'; }
    if (c === 'rate_limited') return '混み合っているか利用上限に達しました。少し時間をおいて試してください。';
    if (c === 'invalid_json' || c === 'empty_completion') return 'うまく書けませんでした。もう一度試してください。';
    if (c === 'refused') return 'この依頼には応答できませんでした。組み合わせを変えて試してください。';
    return '通信が途切れました。もう一度試してください。';
  },
  prompt(cast, theme, focus) {
    const sheet = E.roster.filter(r => cast.indexOf(r[0]) >= 0).map(r => `- ${r[0]} (${r[2]}, ${r[3]}; Japanese name ${r[1]}): ${r[4]}`).join('\n');
    const th = E.themes.find(t => t[0] === theme) || E.themes[E.themes.length - 1];
    const used = stories().map(s => s.title).join('; ');
    // a random Season 2 opening as a tone reference (the research-based stories)
    const pool = (window.STORIES || []).filter(s => s.season === 2);
    const ref = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    const excerpt = ref ? ref.paras.slice(0, 12).map(p => p[0]).join('\n') : '';
    return `You are writing an ORIGINAL, unofficial fan-made short story set in the world of the mobile game "Trickcal: Chibi Go" (global English version). The reader is a Japanese adult practicing English reading for the TOEIC test (goal: 800).

CANON GUIDE (follow it; never contradict it):
${E.world}

HOW TO MAKE IT FEEL LIKE TRICKCAL (researched from the voiced main story, events and the global English script):
${E.style}

CHARACTERS IN THIS STORY (keep each exactly in character, including speech habits):
- The Master: the player character. Gender-neutral: refer to them as "the Master" or "they/their". Their deadpan inner thoughts appear in parentheses, e.g. (Here we go again.)
${sheet}
${excerpt ? `
STYLE SAMPLE: the opening of an earlier story in this collection. Match its rhythm, dialogue density and humor, but do NOT reuse its plot, jokes or lines.
"""
${excerpt}
"""
` : ''}
THEME: ${th[2]}.

REQUIREMENTS
- 470 to 530 English words, split into 18 to 28 short paragraphs. Mostly dialogue; keep narration short and concrete.
- Structure: (1) a quick setup built on one character's quirk; (2) the cast's quirks collide and the problem snowballs; (3) the Master reacts with deadpan inner voice but still gets dragged in; (4) one short heartfelt beat; (5) a punchline in the last one or two paragraphs.
- Keep each character's speech habits from the sheet (third-person self-reference, catchphrases, "...NOT!", puns and so on). Use each catchphrase at most once.
- Natural modern English at CEFR B1+ to B2. Use at least 8 of these TOEIC words naturally: ${focus.join(', ')}.
- Original scenes only. Do not retell the game's story. Short signature catchphrases are fine.
- Do not reuse these existing titles or their plots: ${used}.
- For every paragraph give a natural Japanese translation. Use these Japanese names: ${E.jaNames}, and each character's Japanese name above.
- "vocab": 10 to 14 useful words or phrases that appear in the story, with Japanese meanings and "forms" = the exact spellings used in the text.
- "qs": 3 TOEIC Part 7 style questions (one detail, one inference, one vocabulary-in-context), 4 choices each, one clearly correct answer ("a" is its 0-based index), and a Japanese explanation quoting the evidence.
- "notes": 2 or 3 short Japanese notes (a heading and one to three sentences each) explaining which canon details the story builds on. Use only facts stated in this prompt; never invent lore.

Reply with only this JSON:
{"title":"English title","ja":"日本語タイトル","place":"Place · detail","cast":["Name"],"paras":[{"en":"...","ja":"..."}],"vocab":[{"w":"invoice","ja":"請求書","forms":["invoice","invoices"]}],"qs":[{"q":"...","c":["","","",""],"a":0,"ex":"..."}],"notes":[{"t":"見出し","ja":"解説"}]}`;
  }
};

/* ---------- views ---------- */
const cur = { view: 'shelf', story: null, timer: null, t0: 0, answers: {} };
const views = {};
function go(name, arg) {
  TTS.stop(); closePop();

views.shelf = () => {
  const all = stories();
  const reads = all.map(s => prog(s.id)).filter(p => p.reads.length);
  const recent = [].concat(...all.map(s => prog(s.id).reads)).sort((a, b) => (a.d > b.d ? 1 : -1)).slice(-10);
  const avg = recent.length ? Math.round(recent.reduce((a, r) => a + r.wpm, 0) / recent.length) : 0;
  const totalWords = all.reduce((a, s) => a + prog(s.id).reads.length * words(s), 0);
  view().innerHTML = `<div class="stack">
    <section class="card intro">
      <div>
        <div class="eyebrow">Reading practice in Elias</div>
        <h1 style="margin-top:6px">トリッカルの世界で、英語の長文を読む</h1>
        <p class="note" style="margin-top:10px">グローバル版の設定に沿って書いた、非公式のオリジナル短編集です。1話約500語で、TOEIC Part 7 の長めの文書2つ分にあたります。時間を計って読むと1分あたりの語数（WPM）を記録します。本番のリーディングを時間内に解き切る目安は150WPMです。</p>
      </div>
      <div class="kpis">
        <div class="kpi"><b>${reads.length}</b><span>読んだ話</span></div>
        <div class="kpi"><b>${avg || '—'}</b><span>平均WPM（直近）</span></div>
        <div class="kpi"><b>${totalWords.toLocaleString()}</b><span>読んだ語数</span></div>
      </div>
    </section>
    ${shelfGroups(all).map(([g, list]) => `<section class="season">
      <div class="season-h"><h2>${esc(g.title)}${g.badge ? ` <span class="chip cheek">${esc(g.badge)}</span>` : ''}</h2><p class="note">${esc(g.sub)}</p></div>
      <div class="shelf">${list.map(storyCard).join('')}</div>
    </section>`).join('')}
    <p class="note">これは非公式の二次創作です。キャラクターと世界観の権利は EPIDGames に帰属します。</p>
  </div>`;
  view().querySelectorAll('[data-open]').forEach(b => { b.onclick = () => openStory(b.dataset.open); });
};
const SEASONS = [
  { key: 2, title: '第2集　原作研究版', badge: '解説つき', sub: 'メインストーリーとイベントの字幕、英語版の台詞を調べ直して書いた6話。口調・定番ネタ・話の運び方を原作に寄せ、各話の最後に「原作ネタ解説」をつけました。' },
  { key: 1, title: '第1集', sub: 'キャラクター紹介と世界観をもとに書いた最初の8話。' }
];
function shelfGroups(all) {
  const byNo = (a, b) => a.no - b.no;
  return SEASONS.map(g => [g, all.filter(s => !s.gen && (s.season || 1) === g.key).sort(byNo)])
    .concat([[{ title: 'Claude が書いたお話', sub: '「新しいお話」タブで書いてもらったお話です。' }, all.filter(s => s.gen)]])
    .filter(x => x[1].length);
}
function storyCard(s) {
  const p = prog(s.id), w = words(s);
  return `<button class="story" data-open="${esc(s.id)}">
    <span class="no">${s.gen ? '<span class="chip cheek">Claude作</span>' : 'No.' + pad(s.no)}</span>
    <h3>${esc(s.title)}</h3><span class="jt">${esc(s.ja)}</span>
    <span class="meta">${s.cast.filter(c => c !== 'Master').map(c => `<span class="chip">${esc(c)}</span>`).join('')}</span>
    <span class="foot"><span>${w}語・${Math.max(1, Math.round(w / S.settings.target))}分</span>${p.reads.length ? `<span class="done">読了 ${p.best}WPM${p.quiz ? '・' + p.quiz.score + '/' + p.quiz.total : ''}</span>` : '<span>未読</span>'}</span>
  </button>`;
}

function markup(text, vocab, used) {
  const hits = [];
  vocab.forEach((v, vi) => {
    if (used.has(vi)) return;
    for (const form of v[2].split('|')) {
      const m = new RegExp('(^|[^A-Za-z])(' + escRe(form) + ')(?![A-Za-z])', 'i').exec(text);
      if (m) { const at = m.index + m[1].length; hits.push([at, at + m[2].length, vi]); break; }
    }
  });
  hits.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  hits.forEach(h => { if (h[0] < pos) return; out += esc(text.slice(pos, h[0])) + `<button class="vw" data-v="${h[2]}">${esc(text.slice(h[0], h[1]))}</button>`; pos = h[1]; used.add(h[2]); });
  out += esc(text.slice(pos));

function hl(i) { view().querySelectorAll('.para').forEach(el => el.classList.toggle('now', +el.dataset.i === i)); if (i >= 0) { const el = view().querySelector(`.para[data-i="${i}"]`); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
function startTiming() {
  TTS.stop(); closePop();
  view().querySelectorAll('.tr').forEach(t => { t.hidden = true; });

  $('#clock').hidden = false;
  cur.t0 = Date.now();

  cur.timer = setInterval(() => { const c = $('#clock'); if (c) c.textContent = fmt((Date.now() - cur.t0) / 1000); }, 500);
  $('#text').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function finishTiming(st) {
  clearInterval(cur.timer); cur.timer = null;
  const sec = Math.max(1, (Date.now() - cur.t0) / 1000), w = words(st), wpm = Math.round(w / (sec / 60));
  $('#text').classList.remove('reading');
  $('#time').textContent = '⏱ もう一度計る';
  if (wpm > 500) {
    const r0 = $('#result'); r0.hidden = false;
    r0.innerHTML = `<p>${fmt(sec)} で読み終えたことになっています（${wpm}WPM）。さすがに速すぎるので、今回は記録しませんでした。本文を最後まで読んでから「読み終えた」を押してください。</p>`;
    r0.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  const p = prog(st.id);
  p.reads = p.reads.concat([{ d: today(), sec: Math.round(sec), wpm }]).slice(-20);
  p.best = Math.max(p.best || 0, wpm);
  saveProg(st.id);
  const target = S.settings.target, max = Math.max(260, wpm + 20);
  const verdict = wpm >= 200 ? 'とても速いペースです。内容もつかめていれば上級者の速さです。' : wpm >= target ? '本番で時間内に読み切れるペースです。確認問題で理解度も確かめましょう。' : wpm >= 110 ? 'あと少しで目標ペースです。音声で1回聞いてから読み直すと速くなります。' : 'まずは内容をつかむことを優先しましょう。訳で確認してから読み直すと効果的です。';
  const r = $('#result');
  r.hidden = false;
  r.innerHTML = `<div class="result"><div class="wpm">${wpm}<small>WPM</small></div>
    <div><p>${fmt(sec)} で ${w}語を読みました。${verdict}</p>
    <div class="gauge" role="img" aria-label="${wpm}WPM、目標${target}WPM"><i style="width:${Math.min(100, wpm / max * 100)}%"></i><span class="tick" style="left:${target / max * 100}%" title="目標 ${target}WPM"></span></div>
    <p class="note" style="margin-top:6px">ピンクの線＝目標 ${target}WPM（TOEIC リーディングを時間内に終える目安）</p></div></div>`;

}
function answer(st, qi, ci) {
  if (cur.answers[qi] != null) return;
  cur.answers[qi] = ci;
  const q = st.qs[qi];
  view().querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b => { b.disabled = true; const k = +b.dataset.c; if (k === q.a) b.classList.add('good'); else if (k === ci) b.classList.add('bad'); });
  $('#ex' + qi).textContent = (ci === q.a ? '✓ 正解。' : '✕ 不正解。正解は ' + 'ABCD'[q.a] + '。') + q.ex;
  if (Object.keys(cur.answers).length === st.qs.length) {
    const score = st.qs.reduce((a, qq, k) => a + (cur.answers[k] === qq.a ? 1 : 0), 0);
    const p = prog(st.id); p.quiz = { score, total: st.qs.length, d: today() };
    if (!p.reads.length) p.reads = [];
    saveProg(st.id);
    $('#qscore').textContent = `${score}/${st.qs.length}問正解。${score === st.qs.length ? 'ばっちりです！' : '間違えた問題は、訳をひらいて根拠の文を確かめましょう。'}`;
  }
}

async function generate(cast, theme) {
  if (!cast.length) { toast('使徒を1人以上選んでください'); return; }
  const box = $('#gen'), btn = $('#go');
  const pool = E.toeic.slice().sort(() => Math.random() - 0.5).slice(0, 14);
  const ctl = new AbortController();
  btn.disabled = true;
  box.innerHTML = `<div class="gen"><span class="spin"></span><p class="note" id="gp">Claude が構想を練っています…</p><button class="btn sm ghost" id="stop">中止</button></div>`;
  $('#stop').onclick = () => ctl.abort();
  try {
    const d = await AI.sample.json(AI.prompt(cast, theme, pool), { cache: false, signal: ctl.signal, onText: ({ text }) => { const g = $('#gp'); if (g) g.textContent = `書いています… ${text.length.toLocaleString()}文字`; } });
    const st = normGen(d || {});
    if (st.paras.length < 8 || countWords(st.paras.map(p => p[0]).join(' ')) < 250) throw { code: 'invalid_json' };
    st.id = 'g' + Date.now().toString(36); st.gen = true; st.created = new Date().toISOString(); st.no = 0;
    if (st.cast.indexOf('Master') < 0) st.cast.push('Master');
    S.gen.unshift(st);
    Store.save('gen/' + st.id, st);
    toast('新しいお話ができました');
    openStory(st.id);
  } catch (e) {
    const m = AI.message(e);
    box.innerHTML = m ? `<p class="note" style="margin-top:10px">${esc(m)}</p>` : '';
    const b = $('#go'); if (b) b.disabled = !AI.on;
  }
}

views.stats = () => {
  const all = stories();
  const reads = [].concat(...all.map(s => prog(s.id).reads.map(r => Object.assign({ t: s.title }, r)))).sort((a, b) => (a.d > b.d ? 1 : a.d < b.d ? -1 : 0));

  const pts = reads.slice(-30), target = S.settings.target;
  const W = 560, H = 190, L = 34, R = 12, T = 12, B = 26, max = Math.max(260, ...pts.map(p => p.wpm + 20));
  const X = i => L + (pts.length <= 1 ? (W - L - R) / 2 : i / (pts.length - 1) * (W - L - R)), Y = v => T + (1 - v / max) * (H - T - B);

    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">

    </div>
    <section class="card"><div class="sec-h"><h2>読むスピードの推移</h2><span class="note">直近30回・ピンクの線＝目標${target}WPM</span></div>

        ${[0, 100, 200].filter(v => v < max).map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}

        ${pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.wpm).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${esc(p.d)} ${esc(p.t)}：${p.wpm}WPM</title></circle>`).join('')}
      </svg>` : '<div class="empty">本棚のお話を「時間を計って読む」で読むと、ここに記録がたまります。</div>'}
    </section>
    <section class="card"><div class="sec-h"><h2>お話ごとの記録</h2></div>
      <table class="vtable">${all.map(s => { const p = prog(s.id); return `<tr><td>${esc(s.title)}</td><td>${p.reads.length ? '最高 ' + p.best + 'WPM・' + p.reads.length + '回' : '—'}${p.quiz ? '・問題 ' + p.quiz.score + '/' + p.quiz.total : ''}</td></tr>`; }).join('')}</table>
    </section>
    <section class="card"><div class="sec-h"><h2>設定</h2></div>
      <div class="row">
        <div class="field"><label for="tg">目標スピード</label><select id="tg">${[120, 150, 180, 200].map(v => `<option value="${v}" ${v === target ? 'selected' : ''}>${v} WPM</option>`).join('')}</select></div>
