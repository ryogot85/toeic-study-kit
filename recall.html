<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#EAEEEA; --line:#DCE2DE;
  --ink:#15201C; --ink-2:#55615C; --ink-3:#87918D;
  --accent:#0C7A62; --accent-ink:#FFFFFF; --accent-soft:#DDF1EA;
  --marker:#EEF06A;
  --good:#1F8A5B; --good-soft:#DFF3E8; --bad:#C2413B; --bad-soft:#F8E2DF; --hard:#A86A12; --hard-soft:#F6EBD6;
  --f-en:"Fraunces","Georgia","Times New Roman",serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Consolas","Menlo",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#151C19; --sunk:#1B2420; --line:#2A3531;
    --ink:#E5ECE8; --ink-2:#A2AEA9; --ink-3:#74807B;
    --accent:#4CCAA8; --accent-ink:#06231B; --accent-soft:#16352C;
    --marker:rgba(222,226,90,.32);
    --good:#58C995; --good-soft:#153326; --bad:#F07A72; --bad-soft:#3A1C1A; --hard:#E0A64E; --hard-soft:#35280F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#151C19; --sunk:#1B2420; --line:#2A3531;
  --ink:#E5ECE8; --ink-2:#A2AEA9; --ink-3:#74807B;
  --accent:#4CCAA8; --accent-ink:#06231B; --accent-soft:#16352C;
  --marker:rgba(222,226,90,.32);
  --good:#58C995; --good-soft:#153326; --bad:#F07A72; --bad-soft:#3A1C1A; --hard:#E0A64E; --hard-soft:#35280F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-jp);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.en{font-family:var(--f-en);font-optical-sizing:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-2);line-height:1.65}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mk{background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 92%,transparent 92%);padding:0 2px;border-radius:2px}

/* frame */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-en);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:14px 10px 12px;color:var(--ink-2);border-bottom:2px solid transparent;font-size:14px}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:22px 90px}
.banner{max-width:960px;margin:10px auto 0;padding-inline:16px}
.banner p{background:var(--hard-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:17px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:42px;line-height:1.3}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn.big{min-height:52px;padding:12px 26px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.hard{background:var(--hard-soft);color:var(--hard);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
button.chip{cursor:pointer}
.spk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
.spk:hover{color:var(--accent);border-color:var(--accent)}
.spk svg{width:16px;height:16px;fill:currentColor}

/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px 28px;align-items:center}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.big{font-family:var(--f-mono);font-weight:500;font-size:60px;line-height:1;letter-spacing:-.03em}
.big small{font-size:18px;color:var(--ink-2);letter-spacing:0;margin-left:4px}
.curve{width:100%;height:auto;display:block}
.curve text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3)}
.today{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
@media (max-width:600px){.today{grid-template-columns:auto 1fr}.today .go{grid-column:1/-1}}
.ring{width:84px;height:84px}
.ring text{font-family:var(--f-mono);font-size:15px;fill:var(--ink)}
.kv{display:flex;gap:22px;flex-wrap:wrap}
.kv div b{display:block;font-family:var(--f-mono);font-weight:500;font-size:22px}
.kv div span{font-size:12.5px;color:var(--ink-2)}
.lv{display:grid;grid-template-columns:130px 1fr 78px;gap:12px;align-items:center;font-size:13.5px;padding:6px 0}
@media (max-width:520px){.lv{grid-template-columns:96px 1fr 64px}}
.lvbar{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.lvbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);border-right:2px solid var(--surface)}
.lvbar b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--sunk))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--sunk))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--sunk))}
.heat i.l4{background:var(--accent)}
.bars7{width:100%;height:auto;display:block}
.bars7 text{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sbar .prog{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.sbar .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sbar .cnt{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.qwrap{max-width:680px;margin:0 auto}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px}
.qlabel{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.qlabel .fmt{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.word{font-family:var(--f-en);font-weight:600;font-size:44px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere}
.word.mid{font-size:32px}
.jp-prompt{font-size:24px;font-weight:700;line-height:1.5}
.phrase{font-family:var(--f-en);font-size:20px;line-height:1.55}
.phrase-ja{font-size:14.5px;color:var(--ink-2)}
.gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 3px;text-align:center;color:var(--accent);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:56px;font-size:15.5px;transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--ink-3);background:var(--sunk)}
.opt .k{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--sunk);font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.opt .t.en{font-size:18px}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.good .k{background:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.idk{margin-top:10px}
.typer{display:flex;gap:10px;margin-top:18px}
.typer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--f-en);font-size:20px;background:var(--surface)}
.fb{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:10px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.winfo{display:flex;flex-direction:column;gap:8px}
.winfo .top-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.winfo .w{font-family:var(--f-en);font-weight:600;font-size:26px}
.winfo .ja{font-size:18px;font-weight:700}
.winfo .rel{font-size:13px;color:var(--ink-2)}
.grades{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.grades .btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.timerline{height:3px;background:var(--sunk);border-radius:2px;margin-top:12px;overflow:hidden}
.timerline i{display:block;height:100%;background:var(--accent);width:100%}
.aibox{margin-top:12px;border-radius:12px;background:var(--sunk);padding:12px 14px;font-size:14px}
.aibox dt{font-size:12px;color:var(--accent);font-weight:700;margin-top:6px}
.aibox dt:first-child{margin-top:0}
.aibox dd{margin:2px 0 0}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink-3)}

/* list */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);min-height:40px}
.tools input{flex:1;min-width:180px}
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.wr:hover{background:var(--sunk)}
.wr .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.wr .ww{font-family:var(--f-en);font-weight:600;font-size:17px}
.wr .wj{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px}
.dot.new{background:var(--line)} .dot.lrn{background:var(--hard)} .dot.ok{background:var(--accent)} .dot.mst{background:var(--good)} .dot.lee{background:var(--bad)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;border:1px solid var(--line)}

/* story */
.story{font-family:var(--f-en);font-size:18px;line-height:1.8;white-space:pre-wrap}
.story button.tw{font:inherit;border:0;padding:0 2px;border-radius:3px;cursor:pointer;color:inherit;background:linear-gradient(transparent 55%,var(--marker) 55%)}
.pop{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:28px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink-2)}
.field select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);min-height:40px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  if (!s) return [];

    const m = x.match(/^(\S+)\s+([A-Za-z][A-Za-z '\-.,]*?)(?:\s+([^\x00-\x7F].*))?$/);

  });
}
function split(s) {
  const a = s.indexOf('['), b = s.indexOf(']');
  if (a < 0 || b < a) return { pre: s, key: '', post: '' };
  return { pre: s.slice(0, a), key: s.slice(a + 1, b), post: s.slice(b + 1) };
}

  const out = [], seen = new Set();
  let lv = 1, th = 'gen', n = 0;
  (window.WORDS_SRC || []).forEach(src => src.split('\n').forEach(raw => {

      n, id, w: p[0], pos: p[1], ja: p[2], main: p[2].split('；')[0].trim(),
      ph: p[3], phPre: ph.pre, phKey: ph.key, phPost: ph.post,

      rel: parseRel(p[5]), relRaw: p[5], lv, th

R.load = async function () {
  await Store.init();
  const t = today();
  const res = await Promise.all([Store.get('meta/settings'), Store.all('cards'), Store.all('days', { orderBy: 'date', dir: 'desc', limit: 140 }), Store.all('ai'), Store.all('stories', { orderBy: 'created', dir: 'desc', limit: 40 })]);
  S.settings = Object.assign({}, DEFAULTS, res[0] || {});
  res[1].forEach(c => { if (V.BY_ID.has(c._id)) { c.id = c._id; delete c._id; S.cards.set(c.id, c); } });
  S.days = res[2];
  res[3].forEach(a => S.ai.set(a._id, a));
  S.stories = res[4];
  S.day = S.days.find(d => d.date === t);
  if (!S.day) { S.day = newDay(t); S.days.unshift(S.day); }
};
function rollDay() { const t = today(); if (S.day.date !== t) { S.day = newDay(t); S.days.unshift(S.day); } return t; }
R.saveDay = () => { rollDay(); Store.save('days/' + S.day.date, S.day); };
R.saveSettings = () => Store.save('meta/settings', S.settings);
R.saveCard = c => Store.save('cards/' + c.id, c);

/* ---------- scheduling ---------- */
R.learned = c => !!c && (c.st === 'R' || c.st === 'K');
R.rNow = c => FS.R(diffDays(c.last, today()), c.s);
R.rAt = (c, date) => FS.R(diffDays(c.last, date), c.s);
R.examDays = () => diffDays(today(), R.EXAM);
function schedule(c) {
  const t = today();
  let due = addDays(t, FS.interval(c.s, S.settings.retention));
  // exam-aware cap: if the next review would fall after the exam and recall on exam day would drop
  // below the target, pull a final review into the week before the exam (spread to avoid a pile-up)
  const ex = R.EXAM;
  if (diffDays(t, ex) > 0 && due > addDays(ex, -2) && FS.R(diffDays(t, ex), c.s) < S.settings.retention) {
    const d = addDays(ex, -3 - (hash(c.id) % 6));
    due = d > t ? d : addDays(t, 1);
  }
  return due;
}
function logH(c, g, fmt, ms) { c.h = (c.h || []).concat([[today(), g, fmt || '', Math.round(ms || 0)]]).slice(-12); }
/* grade: 1 Again, 2 Hard, 3 Good, 4 Easy */
R.grade = function (id, g, fmt, ms) {
  const t = rollDay(), W = V.BY_ID.get(id);
  let c = S.cards.get(id);
  if (!R.learned(c)) {                         // first time: initialise the memory state
    c = Object.assign(c || { id }, { st: 'R', s: FS.s0(g), d: FS.d0(g), last: t, reps: 1, lapses: 0, intro: t });
    delete c.prio;
    S.day.nw++;
  } else if (c.last === t) {                   // same-day repeat (learning step or relearning)
    c.s = Math.max(0.05, FS.sameDay(c.s, g));
  } else {
    const r = FS.R(diffDays(c.last, t), c.s);
    if (g === 1) { c.s = FS.forget(c.d, c.s, r); c.lapses = (c.lapses || 0) + 1; }
    else c.s = FS.recall(c.d, c.s, r, g);
    c.d = FS.nextD(c.d, g); c.reps = (c.reps || 0) + 1; c.last = t;
    if (c.st === 'K' && g <= 2) c.st = 'R';
    S.day.rev++;
  }
  c.s = Math.round(c.s * 1000) / 1000; c.d = Math.round(c.d * 1000) / 1000;
  c.due = schedule(c);
  c.leech = (c.lapses || 0) >= 3;
  logH(c, g, fmt, ms);
  if (g === 1) S.day.ng++; else S.day.ok++;
  S.day.sec = Math.round(S.day.sec + Math.min(ms || 0, 30000) / 1000);
  S.cards.set(id, c); R.saveCard(c); R.saveDay();
  return c;
};
R.markKnown = function (id) {
  const t = rollDay();
  const c = Object.assign(S.cards.get(id) || { id }, { st: 'K', s: FS.s0(4), d: FS.d0(4), last: t, reps: 1, lapses: 0, intro: t });
  delete c.prio;
  c.due = schedule(c); logH(c, 4, 'scan', 0);
  S.day.known++;
  S.cards.set(id, c); R.saveCard(c); R.saveDay();
  return c;
};
R.markPriority = function (id) {
  const c = S.cards.get(id) || { id, st: 'N' };
  if (R.learned(c)) return;
  c.st = 'N'; c.prio = true; c.flagged = today();
  S.cards.set(id, c); R.saveCard(c);
};
R.resetCard = function (id) { S.cards.delete(id); Store.remove('cards/' + id); };

/* ---------- queries ---------- */
R.due = () => { const t = today(); return [...S.cards.values()].filter(c => R.learned(c) && c.due <= t).sort((a, b) => R.rNow(a) - R.rNow(b)); };
R.unlearned = () => V.WORDS.filter(w => !R.learned(S.cards.get(w.id)));
R.newQueue = () => {
  const list = R.unlearned();
  const pri = list.filter(w => { const c = S.cards.get(w.id); return c && c.prio; });
  const rest = list.filter(w => { const c = S.cards.get(w.id); return !(c && c.prio); });
  return pri.concat(rest);
};
R.newTarget = () => {
  if (S.settings.newPerDay !== 'auto') return +S.settings.newPerDay || 0;
  const days = diffDays(today(), addDays(R.EXAM, -R.CUTOFF_DAYS));
  if (days <= 0) return 0;
  return clamp(Math.ceil(R.unlearned().length / days), 8, 30);
};
R.newLeft = () => Math.max(0, R.newTarget() - S.day.nw);
R.counts = () => {
  const out = { total: V.WORDS.length, learned: 0, known: 0, mastered: 0, leech: 0, byLevel: {} };
  [1, 2, 3, 4].forEach(l => { out.byLevel[l] = { total: 0, learned: 0, mastered: 0 }; });
  V.WORDS.forEach(w => {
    const c = S.cards.get(w.id), L = out.byLevel[w.lv]; L.total++;
    if (R.learned(c)) { out.learned++; L.learned++; if (c.st === 'K') out.known++; if (c.s >= 30) { out.mastered++; L.mastered++; } if (c.leech) out.leech++; }
  });
  return out;
};
/* expected number of words recalled on a date if study stopped today */
R.expectedAt = date => { let n = 0; S.cards.forEach(c => { if (R.learned(c)) n += R.rAt(c, date); }); return n; };
R.projection = () => {
  const cut = addDays(R.EXAM, -R.CUTOFF_DAYS), days = Math.max(0, diffDays(today(), cut));
  const willLearn = Math.min(V.WORDS.length, R.counts().learned + R.newLeft() + R.newTarget() * Math.max(0, days - 1));
  return Math.round(willLearn * S.settings.retention);
};
R.forecast = n => { const t = today(), out = []; for (let i = 1; i <= n; i++) { const d = addDays(t, i); let k = 0; S.cards.forEach(c => { if (R.learned(c) && c.due === d) k++; }); out.push({ d, n: k }); } return out; };

/* ---------- distractors ---------- */
const normJA = s => s.replace(/[〜～]/g, '').replace(/（.*?）/g, '').replace(/[をにでがはのと、。・]/g, '').replace(/する$/, '');
function similarJA(a, b) { const x = normJA(a), y = normJA(b); return !x || !y || x === y || x.indexOf(y) >= 0 || y.indexOf(x) >= 0; }
const related = (a, b) => a.rel.some(r => r.w.toLowerCase() === b.w.toLowerCase()) || b.rel.some(r => r.w.toLowerCase() === a.w.toLowerCase());
function candidates(w) {
  return V.WORDS.filter(x => x.id !== w.id && x.pos === w.pos && !similarJA(x.main, w.main) && !related(w, x));
}
R.choicesJA = w => {
  const pool = shuffle(candidates(w)).sort((a, b) => Math.abs(a.lv - w.lv) - Math.abs(b.lv - w.lv));
  const picked = [];
  for (const x of pool) { if (picked.every(p => !similarJA(p.main, x.main))) picked.push(x); if (picked.length === 3) break; }
  return shuffle(picked.concat([w]));
};
R.choicesEN = w => {
  const score = x => (x.w[0] === w.w[0] ? 0 : 2) + Math.abs(x.w.length - w.w.length) / 3 + Math.abs(x.lv - w.lv) + Math.random() * 1.5;
  const pool = candidates(w).sort((a, b) => score(a) - score(b));
  const picked = [];
  for (const x of pool) { if (picked.every(p => !similarJA(p.main, x.main))) picked.push(x); if (picked.length === 3) break; }
  return shuffle(picked.concat([w]));
};

/* ---------- speech ---------- */
const quality = v => (/natural|neural|online/i.test(v.name) ? 3 : /google/i.test(v.name) ? 2 : 1);
const TTS = R.TTS = {
  ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  en: [], token: 0, _u: null,
  init() {
    if (!this.ok) return;
    const load = () => {
      let all = []; try { all = speechSynthesis.getVoices() || []; } catch (e) { all = []; }
      this.en = all.filter(v => /^en([-_]|$)/i.test(v.lang)).sort((a, b) => quality(b) - quality(a) || (/en[-_]US/i.test(b.lang) ? 1 : 0) - (/en[-_]US/i.test(a.lang) ? 1 : 0));
      R.emit('voices');
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  voice() { return this.en.find(v => v.name === S.settings.voice) || this.en[0] || null; },
  stop() { this.token++; try { if (this.ok) speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
  speak(text, opt) {
    opt = opt || {};
    return new Promise(res => {
      if (!this.ok || !text) return res(false);
      if (!opt.queue) this.stop();
      const token = this.token, u = new SpeechSynthesisUtterance(text), v = this.voice();
      if (v) u.voice = v; u.lang = v ? v.lang : 'en-US'; u.rate = opt.rate || 0.95;
      let done = false; const fin = ok => { if (!done) { done = true; clearTimeout(g); res(ok && token === this.token); } };
      u.onend = () => fin(true); u.onerror = () => fin(false);
      const g = setTimeout(() => fin(true), 4000 + text.length * 150);
      this._u = u;
      setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { fin(false); } }, 40);
    });
  }
};

/* ---------- Claude (the page's sample capability) ---------- */
const AI = R.AI = {
  sample: null, ready: false, off: false,
  async init() {
    try { this.sample = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch (e) { this.sample = null; }
    this.ready = true; R.emit('ai');
  },
  get on() { return !!this.sample && !this.off; },
  message(e) {
    const c = e && e.code;
    if (c === 'cancelled') return '';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) { this.off = true; R.emit('ai'); return 'Claude の機能はオンライン版（claude.ai）で使えます。'; }
    if (c === 'rate_limited') return '混み合っているか利用上限に達しました。少し時間をおいて試してください。';
    if (c === 'session_expired') return 'claude.ai に再ログインしてから試してください。';
    if (c === 'invalid_json' || c === 'empty_completion') return 'うまく作れませんでした。もう一度試してください。';
    if (c === 'refused') return 'この依頼には応答できませんでした。';
    return '通信が途切れました。もう一度試してください。';
  },
  wordLine(w) { return `英単語: ${w.w}（${V.POS[w.pos] || w.pos}）／意味: ${w.ja}／フレーズ: ${w.ph.replace(/[[\]]/g, '')}（${w.pj.replace(/[[\]]/g, '')}）`; },
  async mnemonic(w, opt) {
    if (!this.on) throw { code: 'not_granted' };
    const prompt = `あなたは記憶術と語源に詳しい英語講師です。日本人のTOEIC学習者（目標800点）が次の単語を長期記憶できるように材料を作ってください。\n${this.wordLine(w)}\n\n出力はJSONのみ:\n{"etym":"語の成り立ち（接頭辞・語根・接尾辞とその意味）。確実でない場合は空文字","image":"意味・音・つづりを結びつける鮮明な情景（1〜2文）","hook":"覚えるための短いフック（語呂合わせが自然に作れる時だけ。無理なら空文字）","example":{"en":"TOEICに出そうな新しい例文（フレーズとは別の場面）","ja":"その和訳"},"confuse":[{"word":"紛らわしい語","note":"違い（1文）"}]}\nconfuse は本当に紛らわしい語がある時だけ最大2つ。すべて日本語（例文の en を除く）。`;
    const d = await this.sample.json(prompt, { cache: false, signal: opt && opt.signal, onText: opt && opt.onText });
    const s = v => (typeof v === 'string' ? v.trim() : '');
    const out = {
      etym: s(d && d.etym), image: s(d && d.image), hook: s(d && d.hook),
      ex: d && d.example && s(d.example.en) ? [{ en: s(d.example.en), ja: s(d.example.ja) }] : [],
      confuse: (d && Array.isArray(d.confuse) ? d.confuse : []).filter(x => x && s(x.word)).slice(0, 2).map(x => ({ word: s(x.word), note: s(x.note) }))
    };
    if (!out.etym && !out.image && !out.hook && !out.ex.length) throw { code: 'invalid_json' };
    const prev = S.ai.get(w.id) || {};
    const rec = Object.assign({}, prev, out, { ex: (prev.ex || []).concat(out.ex).slice(-4), updated: new Date().toISOString() });
    S.ai.set(w.id, rec); Store.save('ai/' + w.id, rec);
    return rec;
  },
  async example(w) {
    if (!this.on) throw { code: 'not_granted' };
    const prev = S.ai.get(w.id) || {};
    const used = (prev.ex || []).map(e => e.en).join(' / ');
    const d = await this.sample.json(`TOEICに出そうな自然な英文を1つ作ってください。見出し語を必ず含め、ビジネスや日常の具体的な場面にしてください。\n${this.wordLine(w)}\n${used ? '既出の例文（これとは違う場面に）: ' + used + '\n' : ''}出力はJSONのみ: {"en":"例文","ja":"自然な和訳"}`, { cache: false, modelTier: 'quick' });
    if (!d || typeof d.en !== 'string' || !d.en.trim()) throw { code: 'invalid_json' };
    const rec = Object.assign({}, prev, { ex: (prev.ex || []).concat([{ en: d.en.trim(), ja: String(d.ja || '').trim() }]).slice(-4), updated: new Date().toISOString() });
    S.ai.set(w.id, rec); Store.save('ai/' + w.id, rec);
    return rec;
  },
  async story(words, opt) {
    if (!this.on) throw { code: 'not_granted' };
    const list = words.map(w => `- ${w.id}: ${w.w}（${w.main}）`).join('\n');
    const prompt = `TOEIC Part 7 風の短い英文（メール・社内通知・記事・広告のいずれか、130〜190語）を書いてください。次の目標語をできるだけ全部、自然な文脈で使ってください（活用形は可）。\n${list}\n\nルール:\n- 本文中の目標語は必ず [[本文での形|id]] の形で囲む（例: [[reserved|reserve]]）。id は上のリストの左側の文字列。\n- 目標語以外は囲まない。架空の会社名・人名を使う。\n- 本文のあとに、目標語の意味の理解を問う4択問題を3問（例: 'The word "X" in paragraph 1 is closest in meaning to'、または文脈から意味を問う問題）。\n- 解説は日本語で1〜2文。\n出力はJSONのみ: {"title":"日本語の短いタイトル","kind":"E-mail","text":"本文（段落は\\n\\nで区切る）","questions":[{"q":"...","choices":["","","",""],"answer":0,"ex":"..."}]}`;
    const d = await this.sample.json(prompt, { cache: false, signal: opt && opt.signal, onText: opt && opt.onText });
    if (!d || typeof d.text !== 'string' || d.text.indexOf('[[') < 0) throw { code: 'invalid_json' };
    const qs = (Array.isArray(d.questions) ? d.questions : []).filter(q => q && Array.isArray(q.choices) && q.choices.length === 4 && Number(q.answer) >= 0 && Number(q.answer) < 4).slice(0, 3)
      .map(q => ({ q: String(q.q || ''), choices: q.choices.map(String), answer: Number(q.answer), ex: String(q.ex || '') }));
    const st = { id: 's' + Date.now().toString(36), created: new Date().toISOString(), words: words.map(w => w.id), title: String(d.title || 'Reading'), kind: String(d.kind || 'Text'), text: d.text, qs, done: false };
    S.stories.unshift(st); Store.save('stories/' + st.id, st);
    return st;
  }
};
})();

</script>
<script>
/* m-ui.js — shell, dashboard, word list, word detail, settings */
(function () {
'use strict';
const R = window.RC, S = R.S, V = window.VOCAB, esc = R.esc;
const $ = (s, r) => (r || document).querySelector(s);
const view = () => $('#view');
const pct = x => Math.round(x * 100) + '%';
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
R.SPK = SPK;

/* ---------- shell ---------- */
let tt = null;
R.toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); };
R.on('banner', m => { $('#bannerText').textContent = m; $('#banner').hidden = false; });
R.current = 'home';
R.go = name => {
  if (R.leaveSession) R.leaveSession();
  R.TTS.stop(); R.closeModal();
  R.current = name;
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.view === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  (VIEWS[name] || VIEWS.home)();
  window.scrollTo(0, 0);
};
const refresh = () => { if (R.loaded && VIEWS[R.current]) VIEWS[R.current](); };
R.on('ai', refresh);
function dday() { const n = R.examDays(); $('#dday').textContent = n > 0 ? '本番まで ' + n + '日' : n === 0 ? '本番当日' : ''; }
R.statusOf = w => {
  const c = S.cards.get(w.id);
  if (!R.learned(c)) return c && c.prio ? { k: 'new', t: '優先して学ぶ' } : { k: 'new', t: '未学習' };
  if (c.leech) return { k: 'lee', t: '苦手' };
  if (c.st === 'K') return { k: 'ok', t: '既知' };
  if (c.s >= 30) return { k: 'mst', t: '定着' };
  return { k: c.s < 5 ? 'lrn' : 'ok', t: c.s < 5 ? '学習中' : '復習中' };
};
R.phraseHTML = (w, gap) => esc(w.phPre) + (gap ? '<span class="gap">?</span>' : '<span class="mk">' + esc(w.phKey) + '</span>') + esc(w.phPost);
R.pjHTML = w => esc(w.pjPre) + '<b>' + esc(w.pjKey) + '</b>' + esc(w.pjPost);
R.relHTML = w => w.rel.length ? w.rel.map(r => `<span>${esc(r.tag)} <span class="en">${esc(r.w)}</span>${r.ja ? ' ' + esc(r.ja) : ''}</span>`).join('　') : '';

/* ---------- charts ---------- */
function curveSVG() {
  const t = R.today(), days = Math.max(1, R.examDays()), total = V.WORDS.length;
  const W = 540, H = 200, L = 40, Rt = 14, T = 16, B = 28;
  const X = d => L + d / days * (W - L - Rt), Y = v => T + (1 - v / total) * (H - T - B);
  const N = Math.min(days, 80), pts = [];
  for (let i = 0; i <= N; i++) { const d = Math.round(i * days / N); pts.push([d, R.expectedAt(R.addDays(t, d))]); }
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const area = line + ` L${X(days).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z`;
  const proj = R.projection();
  const grid = [0, 250, 500, 750, 1000].map(v => `<line x1="${L}" x2="${W - Rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v}</text>`).join('');
  const has = pts[0][1] > 0.5;
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="本番までの記憶の予測グラフ">
    ${grid}
    <line x1="${L}" x2="${W - Rt}" y1="${Y(proj)}" y2="${Y(proj)}" stroke="var(--ink-3)" stroke-dasharray="5 4"/>
    <text x="${W - Rt}" y="${Y(proj) - 6}" text-anchor="end" style="fill:var(--ink-2)">計画どおり続けた場合 約${proj}語</text>
    ${has ? `<path d="${area}" fill="var(--accent-soft)" opacity=".8"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${X(0)}" cy="${Y(pts[0][1])}" r="4" fill="var(--accent)"/><circle cx="${X(days)}" cy="${Y(pts[pts.length - 1][1])}" r="4" fill="var(--accent)"><title>本番日の予測 ${Math.round(pts[pts.length - 1][1])}語</title></circle>`
      : `<text x="${(L + W) / 2}" y="${Y(500)}" text-anchor="middle" style="fill:var(--ink-2)">学習を始めると、ここに記憶の予測曲線が表示されます</text>`}
    <text x="${X(0)}" y="${H - 8}">今日</text><text x="${X(days)}" y="${H - 8}" text-anchor="end">本番 12/19</text>
  </svg>`;
}
function ring(done, goal) {
  const r = 34, c = 2 * Math.PI * r, f = goal ? Math.min(1, done / goal) : 1;
  return `<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="今日の進み具合 ${done}/${goal}"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="8"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="47" text-anchor="middle">${Math.round(f * 100)}%</text></svg>`;
}
function heatmap() {
  const t = R.today(), start = R.addDays(t, -(7 * 14 + new Date().getDay()));
  const by = new Map(S.days.map(d => [d.date, (d.rev || 0) + (d.nw || 0) + (d.known || 0)]));
  let cells = '';
  for (let d = start; d <= t; d = R.addDays(d, 1)) {
    const n = by.get(d) || 0, l = n === 0 ? '' : n < 10 ? 'l1' : n < 25 ? 'l2' : n < 50 ? 'l3' : 'l4';
    cells += `<i class="${l}" title="${d}：${n}語"></i>`;
  }
  return `<div class="heat" role="img" aria-label="直近15週の学習量">${cells}</div>`;
}
function forecastBars() {
  const f = R.forecast(14), max = Math.max(5, ...f.map(x => x.n)), W = 540, H = 120, bw = 26, gap = (W - 20 - 14 * bw) / 13;
  return `<svg class="bars7" viewBox="0 0 ${W} ${H}" role="img" aria-label="今後14日の復習予定">${f.map((x, i) => { const h = Math.round(x.n / max * 72), X = 10 + i * (bw + gap); return `<g><title>${x.d}：${x.n}語</title><rect x="${X}" y="${92 - h}" width="${bw}" height="${h}" rx="4" fill="var(--accent)"/>${x.n ? `<text x="${X + bw / 2}" y="${86 - h}" text-anchor="middle" style="fill:var(--ink-2)">${x.n}</text>` : ''}${i % 2 === 0 ? `<text x="${X + bw / 2}" y="110" text-anchor="middle">${x.d.slice(5).replace('-', '/')}</text>` : ''}</g>`; }).join('')}<line x1="6" x2="${W - 6}" y1="92.5" y2="92.5" stroke="var(--line)"/></svg>`;
}

/* ---------- views ---------- */
const VIEWS = R.VIEWS = {};

  view().innerHTML = `<div class="stack">

    <section class="card">

            <div><b>${nl}</b><span>新しい単語${S.settings.newPerDay === 'auto' ? '（自動）' : ''}</span></div>

        </div>
        <div class="go row">
          ${due.length || nl ? '<button class="btn primary big" id="start">学習を始める</button>' : '<button class="btn big" id="more">今日の分は完了。もう5語学ぶ</button>'}
        </div>
      </div>
      <div class="row" style="margin-top:14px;justify-content:space-between">
        <p class="note">1回は約20問・5分ほどです。空いた時間に少しずつ進めると記憶に残りやすくなります。</p>
        <button class="btn sm" id="scan">知っている単語を先に除外する</button>
      </div>
    </section>

    <div class="grid2">
      <section class="card">
        <div class="sec-h"><h2>レベル別の進み具合</h2><span class="note">濃い色＝定着（1か月以上もつ）</span></div>
        ${[1, 2, 3, 4].map(l => { const b = cnt.byLevel[l]; return `<div class="lv"><span>${V.LEVELS[l].name} <span class="faint">${V.LEVELS[l].score}</span></span>
          <div class="lvbar" title="学習済み ${b.learned} / 定着 ${b.mastered} / 全 ${b.total}"><i style="width:${b.learned / b.total * 100}%"></i><b style="width:${b.mastered / b.total * 100}%"></b></div>

        <p class="note" style="margin-top:8px">学習済み ${cnt.learned}語（うち既知 ${cnt.known}）・定着 ${cnt.mastered}語</p>

        ${leeches.length ? `<div class="row">${leeches.map(c => `<button class="chip bad" data-word="${esc(c.id)}"><span class="en">${esc(V.BY_ID.get(c.id).w)}</span></button>`).join('')}</div><p class="note" style="margin-top:8px">タップで詳しく見られます。覚え方の作成はオンライン版で使えます。</p>` : '<p class="note">まだありません。何度も忘れる単語はここに集まり、覚え方を工夫できます。</p>'}
      </section>
    </div>

  const st = $('#start'); if (st) st.onclick = () => R.startSession({});
  const mo = $('#more'); if (mo) mo.onclick = () => R.startSession({ extraNew: 5 });
  $('#scan').onclick = () => R.startScan();

let listState = { q: '', lv: '0', st: 'all', limit: 150 };
VIEWS.words = () => {
  dday();
  view().innerHTML = `<div class="stack">
    <div class="tools">
      <input id="q" type="search" placeholder="英語か日本語で検索" value="${esc(listState.q)}" aria-label="検索">
      <select id="lv" aria-label="レベル"><option value="0">全レベル</option>${[1, 2, 3, 4].map(l => `<option value="${l}" ${listState.lv == l ? 'selected' : ''}>${V.LEVELS[l].name}（${V.LEVELS[l].score}）</option>`).join('')}</select>

    </div>
    <div class="wl" id="wl"></div>
  </div>`;
  const draw = () => {
    const q = listState.q.trim().toLowerCase();
    const rows = V.WORDS.filter(w => (listState.lv === '0' || w.lv == listState.lv) && (!q || w.w.toLowerCase().indexOf(q) >= 0 || w.ja.indexOf(listState.q.trim()) >= 0)
      && (listState.st === 'all' || R.statusOf(w).k === listState.st));
    const shown = rows.slice(0, listState.limit);
    $('#wl').innerHTML = (rows.length ? shown.map(w => { const s = R.statusOf(w), c = S.cards.get(w.id); return `<button class="wr" data-word="${esc(w.id)}"><span class="no">${String(w.n).padStart(4, '0')}</span>
      <span style="min-width:0"><span class="ww">${esc(w.w)}</span> <span class="faint" style="font-size:12px">${esc(w.pos)}</span><br><span class="wj">${esc(w.ja)}</span></span>
      <span class="note" style="text-align:right;white-space:nowrap"><span class="dot ${s.k}"></span>${s.t}${R.learned(c) ? '<br><span class="mono faint">' + pct(R.rNow(c)) + '</span>' : ''}</span></button>`; }).join('') : '<div class="empty">該当する単語がありません。</div>')
      + (rows.length > shown.length ? `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="moreRows">さらに表示（残り ${rows.length - shown.length}語）</button></div>` : '');
    $('#wl').querySelectorAll('[data-word]').forEach(b => { b.onclick = () => R.openWord(b.dataset.word); });
    const m = $('#moreRows'); if (m) m.onclick = () => { listState.limit += 300; draw(); };
  };
  let deb = null;
  $('#q').oninput = e => { clearTimeout(deb); deb = setTimeout(() => { listState.q = e.target.value; listState.limit = 150; draw(); }, 150); };
  $('#lv').onchange = e => { listState.lv = e.target.value; listState.limit = 150; draw(); };
  $('#st').onchange = e => { listState.st = e.target.value; listState.limit = 150; draw(); };
  draw();
};

/* ---------- word detail ---------- */
R.closeModal = () => { const m = $('#modal'); if (m) m.innerHTML = ''; document.removeEventListener('keydown', escClose); };
function escClose(e) { if (e.key === 'Escape') R.closeModal(); }
function wordCurve(c) {
  const t = R.today(), days = Math.max(14, R.examDays()), W = 520, H = 120, L = 34, Rt = 10, T = 10, B = 22;
  const X = d => L + d / days * (W - L - Rt), Y = v => T + (1 - v) * (H - T - B);
  const pts = []; for (let i = 0; i <= 60; i++) { const d = i * days / 60; pts.push([d, R.rAt(c, R.addDays(t, Math.round(d)))]); }
  const due = Math.max(0, R.diffDays(t, c.due));
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="この単語の忘却曲線">
    ${[0, 0.5, 1].map(v => `<line x1="${L}" x2="${W - Rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 5}" y="${Y(v) + 3.5}" text-anchor="end">${v * 100}%</text>`).join('')}
    <path d="${pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${due <= days ? `<line x1="${X(due)}" x2="${X(due)}" y1="${T}" y2="${H - B}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><text x="${X(due)}" y="${H - 6}" text-anchor="middle">次の復習</text>` : ''}
    <text x="${L}" y="${H - 6}">今日</text>${R.examDays() > 0 ? `<text x="${X(R.examDays())}" y="${T + 10}" text-anchor="end" style="fill:var(--ink-2)">本番</text>` : ''}
  </svg>`;
}
function aiHTML(a) {
  if (!a) return '';
  const dl = [];
  if (a.etym) dl.push(['語の成り立ち', esc(a.etym)]);
  if (a.image) dl.push(['イメージ', esc(a.image)]);
  if (a.hook) dl.push(['覚え方', esc(a.hook)]);
  (a.ex || []).forEach((e, i) => dl.push([i ? '例文' + (i + 1) : '例文', `<span class="en">${esc(e.en)}</span><br><span class="muted">${esc(e.ja)}</span>`]));
  (a.confuse || []).forEach(x => dl.push(['紛らわしい語', `<span class="en">${esc(x.word)}</span>：${esc(x.note)}`]));
  return dl.length ? `<dl class="aibox">${dl.map(d => `<dt>${d[0]}</dt><dd>${d[1]}</dd>`).join('')}</dl>` : '';
}
R.aiHTML = aiHTML;
R.openWord = id => {
  const w = V.BY_ID.get(id); if (!w) return;
  const c = S.cards.get(id), learned = R.learned(c), a = S.ai.get(id), s = R.statusOf(w);
  $('#modal').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(w.w)}">
    <div class="row" style="justify-content:space-between"><span class="note">No.${String(w.n).padStart(4, '0')}・${V.LEVELS[w.lv].name}・${esc(V.THEMES[w.th] || '')}</span><button class="btn sm ghost" id="mclose">閉じる</button></div>
    <div class="winfo" style="margin-top:8px">
      <div class="top-line"><span class="w" style="font-size:34px">${esc(w.w)}</span><span class="chip">${esc(V.POS[w.pos] || w.pos)}</span><button class="spk" data-say="${esc(w.w)}" aria-label="発音を聞く">${SPK}</button></div>
      <div class="ja">${esc(w.ja)}</div>
      <div class="row" style="gap:8px"><span class="phrase">${R.phraseHTML(w)}</span><button class="spk" data-say="${esc(w.ph.replace(/[[\]]/g, ''))}" aria-label="フレーズを聞く">${SPK}</button></div>
      <div class="phrase-ja">${R.pjHTML(w)}</div>
      ${w.rel.length ? `<div class="rel">${R.relHTML(w)}</div>` : ''}
    </div>
    <div class="card" style="margin-top:14px;padding:14px 16px;background:var(--sunk);border:0">
      <div class="row" style="justify-content:space-between"><b style="font-size:14px">記憶の状態</b><span class="chip"><span class="dot ${s.k}"></span>${s.t}</span></div>
      ${learned ? `<div class="kv" style="margin-top:8px">
        <div><b>${pct(R.rNow(c))}</b><span>いま思い出せる確率</span></div>
        <div><b>${pct(R.rAt(c, R.EXAM))}</b><span>本番日の予測</span></div>
        <div><b>${c.s < 1 ? '<1' : Math.round(c.s)}日</b><span>記憶の安定度</span></div>
        <div><b>${c.due.slice(5).replace('-', '/')}</b><span>次の復習</span></div></div>
        ${wordCurve(c)}
        <p class="note">復習 ${c.reps || 0}回・忘れた回数 ${c.lapses || 0}回。安定度は「思い出せる確率が90%に下がるまでの日数」です。</p>` : '<p class="note" style="margin-top:6px">まだ学習していません。</p>'}
    </div>
    <div id="aiArea">${aiHTML(a)}</div>
    <div class="row" style="margin-top:14px">
      ${R.AI.on ? `<button class="btn sm primary" id="mn">${a && (a.etym || a.image) ? '覚え方を作り直す' : 'Claude に覚え方を作ってもらう'}</button><button class="btn sm" id="ex">例文をもう1つ</button>` : ''}
      ${!learned ? '<button class="btn sm" id="known">もう知っている</button><button class="btn sm" id="prio">優先して学ぶ</button>' : ''}
      ${c ? '<button class="btn sm ghost" id="reset">記録をリセット</button>' : ''}
    </div>
    <div id="confirm"></div>
  </div></div>`;
  document.addEventListener('keydown', escClose);
  $('#scrim').onclick = e => { if (e.target.id === 'scrim') R.closeModal(); };
  $('#mclose').onclick = R.closeModal;
  $('#modal').querySelectorAll('[data-say]').forEach(b => { b.onclick = () => R.TTS.speak(b.dataset.say); });
  const run = async (btn, fn) => {
    btn.disabled = true; const label = btn.textContent; btn.innerHTML = '<span class="spin"></span> 作成中…';
    try { const rec = await fn(); $('#aiArea').innerHTML = aiHTML(rec); btn.textContent = label; }
    catch (e) { R.toast(R.AI.message(e) || '中断しました'); btn.textContent = label; }
    finally { btn.disabled = false; }
  };
  const mn = $('#mn'); if (mn) mn.onclick = () => run(mn, () => R.AI.mnemonic(w));
  const ex = $('#ex'); if (ex) ex.onclick = () => run(ex, () => R.AI.example(w));
  const kn = $('#known'); if (kn) kn.onclick = () => { R.markKnown(id); R.toast('既知にしました（本番前に一度だけ確認が出ます）'); R.openWord(id); refresh(); };
  const pr = $('#prio'); if (pr) pr.onclick = () => { R.markPriority(id); R.toast('次の学習で優先して出します'); R.openWord(id); };
  const rs = $('#reset'); if (rs) rs.onclick = () => {
    $('#confirm').innerHTML = '<div class="row" style="margin-top:10px"><span class="note">この単語の記憶データを消して、未学習に戻しますか？</span><button class="btn sm" id="rsYes">リセットする</button><button class="btn sm ghost" id="rsNo">やめる</button></div>';
    $('#rsYes').onclick = () => { R.resetCard(id); R.toast('リセットしました'); R.openWord(id); refresh(); };
    $('#rsNo').onclick = () => { $('#confirm').innerHTML = ''; };
  };
};

/* ---------- boot ---------- */
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) R.go(b.dataset.view); });
R.on('voices', () => { if (R.current === 'settings') VIEWS.settings(); });
async function boot() {
  R.TTS.init(); R.AI.init();
  await R.load();
  R.loaded = true;
  R.go('home');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();

</script>
<script>
/* m-session.js — learning sessions (pretest → encode → spaced retrieval) and the known-word scan */
(function () {
'use strict';
const R = window.RC, S = R.S, V = window.VOCAB, esc = R.esc;
const $ = (s, r) => (r || document).querySelector(s);
const view = () => $('#view');
const FMT = { mc: '意味を選ぶ', aud: '聞いて意味を選ぶ', clz: 'フレーズを完成させる', rev: '英語で言うと？', typ: 'つづりを書く' };
const SLOW = { mc: 6000, aud: 7000, clz: 9000, rev: 8000, typ: 15000 };
let ses = null, cur = null;

function pickFmt(c, avoid) {
  const s = (c && c.s) || 0;
  let list = s < 3 ? ['mc', 'aud', 'mc'] : s < 10 ? ['aud', 'clz', 'mc'] : s < 30 ? ['clz', 'rev', 'aud'] : ['rev', 'clz', 'aud'];
  if (S.settings.typing && s >= 10) list.push('typ');
  if (!R.TTS.ok) list = list.filter(f => f !== 'aud');
  const last = c && c.h && c.h.length ? c.h[c.h.length - 1][2] : '';

/* ---------- retrieval questions ---------- */
function renderQ() {
  const it = cur.it, w = cur.w, f = it.fmt;

  } else if (f === 'clz') {

  } else if (f === 'rev' || f === 'typ') {

      <div class="row idk"><button class="btn sm ghost" id="idk">わからない</button><span class="note">頭文字：<span class="en">${esc(w.w[0])}</span>・${w.w.length}文字</span></div>`;

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9' -]/g, '').replace(/\s+/g, ' ').trim();

/* ---------- shared bindings ---------- */

/* ---------- summary ---------- */
function summary() {

    <div class="row">${more ? `<button class="btn primary big" id="again">続けてもう1セット（残り${more}語）</button>` : ''}<button class="btn big" id="home">ホームへ</button></div>

  R.current = 'summary';
  view().innerHTML = `<div class="qwrap"><section class="card"><div class="eyebrow">仕分け完了</div><h1 style="font-size:22px;margin-top:4px">${s.known}語を学習リストから外しました</h1>
    <p class="note" style="margin-top:10px">「知らない」と答えた${s.unknown}語は優先して学習します。既知にした単語も、本番前に思い出せるか一度だけ確認が出ます。</p>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="h">ホームへ</button></div></section></div>`;
  $('#h').onclick = () => R.go('home');
}
document.addEventListener('keydown', e => {
  if (R.current !== 'scan' || !scan) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const b = e.key === '1' ? view().querySelector('#yes') || view().querySelector('.opt[data-i="0"]') : e.key === '2' ? view().querySelector('#no') || view().querySelector('.opt[data-i="1"]') : e.key === '3' ? view().querySelector('.opt[data-i="2"]') : e.key === '4' ? view().querySelector('.opt[data-i="3"]') : null;
  if (b && !b.disabled) { e.preventDefault(); b.click(); }
});
})();

</script>
<script>
/* m-story.js — Claude writes a TOEIC-style passage from the words you are learning */
(function () {
'use strict';
const R = window.RC, S = R.S, V = window.VOCAB, esc = R.esc;
const $ = (s, r) => (r || document).querySelector(s);
const view = () => $('#view');
let ctl = null;

function pickWords() {
  const t = R.today(), cards = [...S.cards.values()].filter(c => R.learned(c) && c.st !== 'K');
  const score = c => (c.leech ? 0 : 3) + (c.intro && R.diffDays(c.intro, t) <= 7 ? 0 : 2) + R.rNow(c) + Math.random() * 0.8;
  return cards.sort((a, b) => score(a) - score(b)).slice(0, 10).map(c => V.BY_ID.get(c.id)).filter(Boolean);
}
function storyHTML(st) {
  const parts = [], re = /\[\[([^\]|]+)\|([^\]]+)\]\]/g;
  let last = 0, m;
  while ((m = re.exec(st.text))) {
    parts.push(esc(st.text.slice(last, m.index)));
    const id = m[2].trim(), w = V.BY_ID.get(id);
    parts.push(w ? `<button class="tw" data-id="${esc(id)}">${esc(m[1])}</button>` : esc(m[1]));
    last = re.lastIndex;
  }
  parts.push(esc(st.text.slice(last)));
  return parts.join('');
}
R.VIEWS.read = () => {
  const words = pickWords();
  view().innerHTML = `<div class="stack">
    <section class="card">
      <div class="eyebrow">Reading with your words</div>
      <h1 style="font-size:20px;margin-top:4px">覚えた単語で読むストーリー</h1>
      <p class="note" style="margin-top:8px">最近覚えた単語と苦手な単語を使って、Claude が TOEIC Part 7 風の英文を書き下ろします。単語帳で覚えた意味を実際の文脈で読むと、使い方ごと記憶に定着し、長文を読むスピードも上がります。</p>
      ${!R.AI.on ? '<p class="note" style="margin-top:10px">Claude の機能はオンライン版（claude.ai）で使えます。</p>'
        : words.length < 4 ? '<p class="note" style="margin-top:10px">学習済みの単語が4語以上になると作れます。まずは「今日」から学習を始めましょう。</p>'
        : `<p class="note" style="margin-top:10px">使う単語：${words.map(w => `<span class="en">${esc(w.w)}</span>`).join('、')}</p><div class="row" style="margin-top:12px"><button class="btn primary" id="gen">ストーリーを作る</button><span class="note">20〜60秒かかります</span></div>`}
      <div id="genOut"></div>
    </section>
    <section class="card"><div class="sec-h"><h2>これまでのストーリー</h2></div>
      ${S.stories.length ? `<div class="wl">${S.stories.map(st => `<button class="wr" data-st="${esc(st.id)}" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="chip ${st.done ? 'good' : 'acc'}">${st.done ? '読了' : '未読'}</span><span style="min-width:0"><b>${esc(st.title)}</b><br><span class="wj">${esc(st.kind)}・${st.words.length}語</span></span><span class="mono faint">${esc(String(st.created).slice(5, 10).replace('-', '/'))}</span></button>`).join('')}</div>` : '<p class="note">まだありません。</p>'}
    </section>
  </div>`;
  const g = $('#gen');
  if (g) g.onclick = async () => {
    g.disabled = true;
    const out = $('#genOut');
    out.innerHTML = '<p class="note" style="margin-top:12px"><span class="spin"></span> Claude が書いています… <button class="btn sm ghost" id="stop">中止</button></p>';
    ctl = new AbortController();
    $('#stop').onclick = () => ctl && ctl.abort();
    try { const st = await R.AI.story(words, { signal: ctl.signal }); openStory(st.id); }
    catch (e) { const m = R.AI.message(e); out.innerHTML = m ? `<p class="note" style="margin-top:12px">${esc(m)}</p>` : ''; g.disabled = false; }
    finally { ctl = null; }
  };
  view().querySelectorAll('[data-st]').forEach(b => { b.onclick = () => openStory(b.dataset.st); });
};
function openStory(id) {
  const st = S.stories.find(s => s.id === id);
  if (!st) return;
  const picked = {};
  view().innerHTML = `<div class="qwrap stack">
    <div class="row"><button class="btn sm ghost" id="back">← ストーリー一覧</button></div>
    <section class="card">
      <div class="eyebrow">${esc(st.kind)}</div>
      <h1 style="font-size:20px;margin-top:4px">${esc(st.title)}</h1>
      <p class="note" style="margin:6px 0 14px">マーカーの単語をタップすると意味を確認できます。まずは意味を思い出しながら読んでみてください。</p>
      <div class="story">${storyHTML(st)}</div>
      <div id="pop"></div>
    </section>
    ${st.qs.length ? `<section class="card"><div class="sec-h"><h2>確認問題</h2></div>${st.qs.map((q, qi) => `<div style="margin-bottom:16px"><p class="en" style="font-size:16.5px;margin-bottom:8px">${qi + 1}. ${esc(q.q)}</p><div class="opts" style="margin-top:0">${q.choices.map((c, ci) => `<button class="opt" data-q="${qi}" data-c="${ci}"><span class="k">${'ABCD'[ci]}</span><span class="t en">${esc(c)}</span></button>`).join('')}</div><div class="note" id="qx${qi}" style="margin-top:8px"></div></div>`).join('')}</section>` : ''}
  </div>`;
  window.scrollTo(0, 0);
  $('#back').onclick = () => R.VIEWS.read();
  view().querySelectorAll('.tw').forEach(b => { b.onclick = () => {
    const w = V.BY_ID.get(b.dataset.id); if (!w) return;
    $('#pop').innerHTML = `<div class="pop"><div class="row" style="justify-content:space-between"><span><b class="en" style="font-size:18px">${esc(w.w)}</b>　${esc(w.ja)}</span><span class="row" style="gap:6px"><button class="spk" id="psay" aria-label="発音を聞く">${R.SPK}</button><button class="btn sm ghost" id="pdet">詳しく</button></span></div><div class="phrase" style="font-size:16px;margin-top:4px">${R.phraseHTML(w)}</div></div>`;
    $('#psay').onclick = () => R.TTS.speak(w.w);
    $('#pdet').onclick = () => R.openWord(w.id);
  }; });
  view().querySelectorAll('.opt[data-q]').forEach(b => { b.onclick = () => {
    const qi = +b.dataset.q, ci = +b.dataset.c, q = st.qs[qi];
    if (picked[qi] != null) return;
    picked[qi] = ci;
    view().querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x => { x.disabled = true; const k = +x.dataset.c; x.classList.add(k === q.answer ? 'good' : k === ci ? 'bad' : 'dim'); });
    $('#qx' + qi).textContent = (ci === q.answer ? '正解。' : '不正解。') + (q.ex || '');
    if (Object.keys(picked).length === st.qs.length && !st.done) { st.done = true; R.Store.save('stories/' + st.id, st); }
  }; });
}
})();

</script>
<script>
/* pwa.js — offline kit glue shared by every page: service worker, link back to the kit home, persistent storage */
(function () {
  'use strict';
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ }); });
  }
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (p) { if (!p) return navigator.storage.persist(); }).catch(function () {});
    }
  } catch (e) { /* ignore */ }
  function addHome() {
    var top = document.querySelector('.top-in');
    if (!top || document.querySelector('.kit-home')) return;
    var a = document.createElement('a');
    a.href = './';
    a.className = 'kit-home';
    a.textContent = '‹ Kit';
    a.setAttribute('aria-label', 'TOEIC Study Kit のホームに戻る');
    a.style.cssText = 'font:600 13px/1 system-ui,-apple-system,sans-serif;color:inherit;opacity:.7;text-decoration:none;padding:10px 6px 10px 0;white-space:nowrap';
    top.insertBefore(a, top.firstChild);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addHome); else addHome();
})();

</script>
